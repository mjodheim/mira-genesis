active_research_question: >-
  After M070's frozen agent scored 0/2 because Windows Unicode and descendant-process transport
  failed, can a separately frozen UTF-8/process-tree-hardened agent complete at least one task from
  a fresh blind independently maintained pair while retaining no-network isolation and
  evaluator-owned success?

