name: M027 seeded clade guidance

# Development only. Pull requests exercise four paired seeds; the 64-seed comparison
# remains a separately recorded local development run.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m027-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run M027 focused tests
        run: pytest -q tests/test_m027_seeded_clade.py
      - name: Run four paired structural seeds
        run: >-
          python scripts/run_m027_seeded_clade_comparison.py
          --seeds 4
          --workers 4
          --output results/M027_seeded_clade_smoke.json
      - name: Verify smoke-only and isolation guardrails
        run: |
          python - <<'PYTHON'
          import json
          import pathlib
          import sys

          payload = json.loads(
              pathlib.Path("results/M027_seeded_clade_smoke.json")
              .read_text(encoding="utf-8")
          )
          summary = payload["summary"]
          required = {
              "comparison_status": "insufficient_paired_seeds",
              "coverage_exact": True,
              "mismatch_coverage_exposes_hidden_signal": True,
              "aligned_control_exact": True,
              "hidden_fields_visible_to_selectors": False,
              "integer_only_selection_traces": True,
          }
          for key, expected in required.items():
              if summary.get(key) != expected:
                  sys.exit(f"{key}={summary.get(key)!r}, expected {expected!r}")
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: m027-smoke-${{ github.run_id }}
          path: results/M027_seeded_clade_smoke.json
          if-no-files-found: error
          retention-days: 30
