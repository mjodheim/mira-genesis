name: M014b sealed evaluation

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: read

env:
  PYTHONPATH: .:scripts

jobs:
  evaluate:
    if: github.head_ref == 'research/m014b-sealed-portable-plasticity'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Run development-only tests
        run: pytest -q tests/test_m014b.py
      - name: Audit isolation
        run: python scripts/audit_m014b_isolation.py
      - name: Run canonical sealed evaluation
        env:
          GITHUB_ACTIONS: 'true'
        run: >-
          python scripts/run_m014b_evaluation.py
          --canonical
          --git-commit "${{ github.event.pull_request.head.sha }}"
          --github-run-id "${{ github.run_id }}"
          --github-run-attempt "${{ github.run_attempt }}"
          --event-action opened
          --output-dir results/M014b
      - uses: actions/upload-artifact@v4
        with:
          name: m014b-sealed-evidence-${{ github.run_id }}
          path: results/M014b/
          if-no-files-found: error
          retention-days: 90
