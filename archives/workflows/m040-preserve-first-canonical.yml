# ARCHIVED after preservation run 30930586262 and artifact 8900997802.
# This exact-seed reproduction preserved the verified first evaluation after an outer
# JSON-serialization failure. Intentionally outside .github/workflows.

name: M040 preserve first canonical result

# The immutable first execution (run 30930249547 at arming head
# 5a5c2370231806b3295e0bce3f8aa449b2a465b3) completed the engine and independent
# verification, then failed while JSON-encoding raw journal bytes. This workflow reproduces
# only that exact seed and preserves the result with the development artefact's established
# hexadecimal byte encoding. It is not a new scientific run.

on:
  pull_request:
    paths:
      - 'experiments/M040/run_canonical.py'
      - '.github/workflows/m040-preserve-first-canonical.yml'

permissions:
  contents: read

concurrency:
  group: m040-preserve-first-canonical
  cancel-in-progress: false

jobs:
  reproduce-and-preserve:
    if: github.event.pull_request.head.ref == 'research/m040-canonical-freeze'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the preservation implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the frozen package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pin the byte-only repair
        run: |
          python - <<'PY'
          import runpy

          module = runpy.run_path('experiments/M040/run_canonical.py')
          encoded = module['_json_value']({
              'record': b'\x00\xff',
              'nested': (b'journal',),
          })
          assert encoded == {
              'record': {'encoding': 'hex', 'value': '00ff'},
              'nested': [{'encoding': 'hex', 'value': '6a6f75726e616c'}],
          }
          PY

      - name: Reproduce the exact first evaluation and preserve its artefact
        env:
          M040_CANONICAL_RUN: '1'
        run: |
          python experiments/M040/run_canonical.py \
            --head-sha 5a5c2370231806b3295e0bce3f8aa449b2a465b3 \
            --parent-sha bc6e73c591cc9e996d5cb22ded71384b57d0c8cc \
            --marker experiments/M040/CANONICAL_ARMED.json \
            --protocol experiments/M040/PROTOCOL.md \
            --execution-kind reproduction-after-serialization-failure \
            --original-run-id 30930249547 \
            --output m040-canonical-result.json

      - name: Independently verify the preserved positive result
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from metamorphosis.m040_result_verify import verify_m040_result

          raw = Path('m040-canonical-result.json').read_bytes()
          payload = json.loads(raw)
          assert payload['schema'] == 'm040-canonical-envelope/1'
          assert payload['status'] == 'first-canonical-result'
          assert payload['execution_kind'] == 'reproduction-after-serialization-failure'
          assert payload['original_workflow_run'] == '30930249547'
          assert payload['arming_head_sha'] == '5a5c2370231806b3295e0bce3f8aa449b2a465b3'
          assert payload['frozen_parent_sha'] == 'bc6e73c591cc9e996d5cb22ded71384b57d0c8cc'
          assert payload['protocol_sha256'] == '4816bc3c32e4fc04df5de4fad784a8935f0b8757c544dbc3862a1d2cb7b59d30'
          assert payload['scientific_outcome'] == 'positive'
          assert payload['combined_expected_claim_supported'] is True
          verify_m040_result(payload['result'])
          print(f"artifact_sha256={hashlib.sha256(raw).hexdigest()}")
          print(f"artifact_bytes={len(raw)}")
          PY

      - name: Upload the preserved canonical artefact
        uses: actions/upload-artifact@v4
        with:
          name: m040-first-canonical-preserved-5a5c2370231806b3295e0bce3f8aa449b2a465b3
          path: m040-canonical-result.json
          if-no-files-found: error
          retention-days: 90
