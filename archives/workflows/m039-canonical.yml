name: M039 first canonical run

# ARCHIVED after first immutable run 30907896768 on arming head
# 02df1fab0bc589d7563c6d9293073751220185f3. This file is documentation and is
# intentionally outside .github/workflows.
on:
  pull_request:
    paths:
      - 'experiments/M039/CANONICAL_ARMED.json'
      - 'experiments/M039/PROTOCOL.md'
      - 'experiments/M039/run_canonical.py'
      - 'metamorphosis/m039_*.py'
      - 'scripts/check_m039_canonical_guard.py'
      - '.github/workflows/m039-canonical.yml'

permissions:
  contents: read

concurrency:
  group: m039-canonical-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  guarded-canonical-run:
    name: Guarded first M039 canonical run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the immutable pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Inspect the head without opening the block
        id: guard
        shell: bash
        run: |
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD)
          args=()
          for path in "${changed[@]}"; do
            args+=(--changed-file "$path")
          done
          python scripts/check_m039_canonical_guard.py \
            --head-sha "$(git rev-parse HEAD)" \
            --parent-sha "$(git rev-parse HEAD^)" \
            --commit-message "$(git log -1 --pretty=%B)" \
            --github-output "$GITHUB_OUTPUT" \
            "${args[@]}"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.armed == 'true'
        with:
          python-version: '3.11'

      - name: Install the frozen package
        if: steps.guard.outputs.armed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Execute and preserve the first canonical result
        if: steps.guard.outputs.armed == 'true'
        env:
          M039_CANONICAL_RUN: '1'
        run: |
          python experiments/M039/run_canonical.py \
            --head-sha "$(git rev-parse HEAD)" \
            --parent-sha "$(git rev-parse HEAD^)" \
            --marker experiments/M039/CANONICAL_ARMED.json \
            --protocol experiments/M039/PROTOCOL.md \
            --output m039-canonical-result.json

      - name: Verify immutable first-run metadata
        if: steps.guard.outputs.armed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('m039-canonical-result.json').read_text())
          assert payload['schema'] == 'm039-canonical-result/1'
          assert payload['status'] == 'first-canonical-result'
          assert payload['first_run_only'] is True
          assert payload['reruns_are_reproductions_only'] is True
          assert payload['arming_head_sha'] == '${{ github.event.pull_request.head.sha }}'
          assert 'combined_expected_claim_supported' in payload['result']
          PY

      - name: Upload the immutable canonical artifact
        if: steps.guard.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: m039-first-canonical-${{ github.event.pull_request.head.sha }}
          path: m039-canonical-result.json
          if-no-files-found: error
          retention-days: 90

      - name: Confirm the block stayed closed
        if: steps.guard.outputs.armed != 'true'
        run: echo "M039 canonical block remains closed on this commit."
