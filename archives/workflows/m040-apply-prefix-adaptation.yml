name: Apply M040 prefix adaptation

on:
  pull_request:
    paths:
      - '.github/workflows/m040-apply-prefix-adaptation.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply committed prefix-adaptation mechanism
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          engine_path = Path('metamorphosis/m040_engine.py')
          engine = engine_path.read_text()
          engine = engine.replace('DEVELOPMENT_SEED = 400_042', 'DEVELOPMENT_SEED = 400_044', 1)
          engine = engine.replace('POST_MIGRATION_DEPTH = 2', 'POST_MIGRATION_DEPTH = 3', 1)
          engine = engine.replace(
              '    generating_program: tuple[Atom, ...]\n    observation_depth: int = OBSERVATION_DEPTH',
              '    generating_program: tuple[Atom, ...]\n'
              '    task_family: str\n'
              '    observation_depth: int = OBSERVATION_DEPTH',
              1,
          )
          engine = engine.replace(
              '            "generating_program": [atom.to_list() for atom in self.generating_program],\n'
              '            "observation_depth": self.observation_depth,',
              '            "generating_program": [atom.to_list() for atom in self.generating_program],\n'
              '            "task_family": self.task_family,\n'
              '            "observation_depth": self.observation_depth,',
              1,
          )
          engine = engine.replace(
              '    preferred_programs: Sequence[Sequence[str]] = (),\n'
              '    maximum_depth: int = POST_MIGRATION_DEPTH,',
              '    preferred_programs: Sequence[Sequence[str]] = (),\n'
              '    adapt_prefixes: bool = False,\n'
              '    maximum_depth: int = POST_MIGRATION_DEPTH,',
              1,
          )

          preferred_start = engine.index('    def evaluate_preferred_program(')
          preferred_end = engine.index('\n    def descend(', preferred_start)
          preferred_block = textwrap.indent(textwrap.dedent('''
          def evaluate_completed_preferred(
              selected: Sequence[LineageTool],
              expanded: Sequence[Atom],
              current: DFA,
              *,
              reason: str,
          ) -> SearchResult | None:
              nonlocal best_quality
              counters.candidates_constructed += 1
              normalized = normalize_dfa(current)
              quality = 0
              for word, expected in sorted(observations.items()):
                  counters.evidence_checks += 1
                  quality += int(normalized.accepts(word) == expected)
              best_quality = max(best_quality, quality)
              if quality != len(observations):
                  return None
              counters.candidates_evaluated += 1
              exact, _ = exact_equivalence(normalized, target)
              if not exact:
                  return None
              ids = tuple(tool.tool_id for tool in selected)
              return SearchResult(
                  arm=arm,
                  exact=True,
                  reason=reason,
                  quality_numerator=len(observations),
                  quality_denominator=len(observations),
                  accepted_candidate_id=_candidate_id(
                      arm=arm,
                      tool_ids=ids,
                      program=tuple(expanded),
                      body=normalized,
                  ),
                  accepted_tool_ids=ids,
                  accepted_program=tuple(expanded),
                  accepted_body=normalized,
                  counters=counters.mapping(),
              )

          def apply_prefix(tool_ids: Sequence[str]) -> tuple[DFA, list[LineageTool], list[Atom]] | None:
              current: DFA | None = founder
              selected: list[LineageTool] = []
              expanded: list[Atom] = []
              for tool_id in tool_ids:
                  tool = registry_by_id.get(str(tool_id))
                  if tool is None:
                      return None
                  counters.symbolic_search_nodes += 1
                  if counters.symbolic_search_nodes > node_budget:
                      return None
                  atoms = _tool_atoms(tool)
                  for atom in atoms:
                      counters.primitive_expansion_operations += 1
                      current = apply_atom(current, atom)  # type: ignore[arg-type]
                      if current is None:
                          return None
                      expanded.append(atom)
                  if tool.provenance.origin == ORIGIN_LINEAGE_CONSTRUCTED:
                      counters.tool_symbols_used += 1
                  selected.append(tool)
              if current is None:
                  return None
              return current, selected, expanded

          primitive_suffixes = tuple(
              tool for tool in ordered_registry
              if tool.provenance.origin == ORIGIN_PROTOCOL_SUPPLIED
          )
          for preferred_program in preferred_programs:
              prefix = apply_prefix(preferred_program)
              if prefix is None:
                  continue
              prefix_body, prefix_tools, prefix_atoms = prefix
              if adapt_prefixes:
                  for suffix in primitive_suffixes:
                      counters.symbolic_search_nodes += 1
                      if counters.symbolic_search_nodes > node_budget:
                          return SearchResult(
                              arm=arm,
                              exact=False,
                              reason="symbolic_node_budget_exhausted",
                              quality_numerator=best_quality,
                              quality_denominator=len(observations),
                              accepted_candidate_id=None,
                              accepted_tool_ids=(),
                              accepted_program=(),
                              accepted_body=None,
                              counters=counters.mapping(),
                          )
                      current: DFA | None = prefix_body
                      suffix_atoms = _tool_atoms(suffix)
                      for atom in suffix_atoms:
                          counters.primitive_expansion_operations += 1
                          current = apply_atom(current, atom)  # type: ignore[arg-type]
                          if current is None:
                              break
                      if current is None:
                          continue
                      found = evaluate_completed_preferred(
                          prefix_tools + [suffix],
                          prefix_atoms + list(suffix_atoms),
                          current,
                          reason="transported_prefix_adapted",
                      )
                      if found is not None:
                          return found
              else:
                  found = evaluate_completed_preferred(
                      prefix_tools,
                      prefix_atoms,
                      prefix_body,
                      reason="transported_continuation_adopted",
                  )
                  if found is not None:
                      return found
          '''), '    ').rstrip()
          engine = engine[:preferred_start] + preferred_block + engine[preferred_end:]

          task_start = engine.index('def _post_task(')
          task_end = engine.index('\n\ndef _certificate(', task_start)
          task_block = textwrap.dedent('''
          def _post_task_exact_frontier(
              *,
              packet: M040TransportPacket,
              founder: DFA,
              task_seed: int,
          ) -> M040PostTask:
              registry = {tool.tool_id: tool for tool in packet.tool_registry}
              primitive_tools = tuple(
                  tool for tool in packet.tool_registry
                  if tool.provenance.origin == ORIGIN_PROTOCOL_SUPPLIED
              )
              programs = list(packet.learning_state.continuation_programs)
              random.Random(task_seed).shuffle(programs)
              primitive_reachable = _reachable(founder, primitive_tools, POST_MIGRATION_DEPTH)
              for program_ids in programs[:TASK_GENERATION_ATTEMPTS]:
                  tools = tuple(registry[tool_id] for tool_id in program_ids)
                  raw, program = _apply_tools(founder, tools)
                  if raw is None:
                      continue
                  target = normalize_dfa(raw)
                  if target.n_states <= founder.n_states:
                      continue
                  if dfa_digest(target) in primitive_reachable:
                      continue
                  observations = _observations(target)
                  certificate = proved_structural_incapacity(
                      founder,
                      observations,
                      maximum_search_nodes=MAXIMUM_SEARCH_NODES,
                      maximum_prefix_count=MAXIMUM_PREFIX_COUNT,
                  )
                  if certificate.proves_incapacity():
                      return M040PostTask(
                          task_seed=task_seed,
                          parent_digest=dfa_digest(founder),
                          target=target,
                          generating_tool_ids=tuple(program_ids),
                          generating_program=program,
                          task_family="exact_frontier",
                      )
              raise M040EngineError("no transported continuation frontier produced an admissible task")


          def _post_task_prefix_adaptation(
              *,
              packet: M040TransportPacket,
              founder: DFA,
              task_seed: int,
          ) -> M040PostTask:
              registry = {tool.tool_id: tool for tool in packet.tool_registry}
              primitive_tools = [
                  tool for tool in packet.tool_registry
                  if tool.provenance.origin == ORIGIN_PROTOCOL_SUPPLIED
              ]
              if not primitive_tools:
                  raise M040EngineError("transported packet contains no birth primitives")
              programs = list(packet.learning_state.continuation_programs)
              rng = random.Random(task_seed)
              rng.shuffle(programs)
              rng.shuffle(primitive_tools)
              primitive_reachable = _reachable(founder, primitive_tools, POST_MIGRATION_DEPTH)
              attempts = 0
              for prefix_ids in programs:
                  prefix_tools = tuple(registry[tool_id] for tool_id in prefix_ids)
                  for suffix in primitive_tools:
                      attempts += 1
                      if attempts > TASK_GENERATION_ATTEMPTS:
                          break
                      tool_ids = tuple(prefix_ids) + (suffix.tool_id,)
                      if len(tool_ids) > POST_MIGRATION_DEPTH:
                          continue
                      raw, program = _apply_tools(founder, prefix_tools + (suffix,))
                      if raw is None:
                          continue
                      target = normalize_dfa(raw)
                      if target.n_states <= founder.n_states:
                          continue
                      if dfa_digest(target) in primitive_reachable:
                          continue
                      observations = _observations(target)
                      certificate = proved_structural_incapacity(
                          founder,
                          observations,
                          maximum_search_nodes=MAXIMUM_SEARCH_NODES,
                          maximum_prefix_count=MAXIMUM_PREFIX_COUNT,
                      )
                      if not certificate.proves_incapacity():
                          continue
                      return M040PostTask(
                          task_seed=task_seed,
                          parent_digest=dfa_digest(founder),
                          target=target,
                          generating_tool_ids=tool_ids,
                          generating_program=program,
                          task_family="prefix_plus_primitive",
                      )
              raise M040EngineError("no transported prefix plus primitive produced an admissible task")
          ''').strip()
          engine = engine[:task_start] + task_block + engine[task_end:]

          engine = engine.replace(
              'def _execute(master_seed: int, protocol_commitment: str) -> M040DevelopmentResult:',
              'def _execute(\n'
              '    master_seed: int,\n'
              '    protocol_commitment: str,\n'
              '    *,\n'
              '    task_family: str = "prefix_adaptation",\n'
              ') -> M040DevelopmentResult:',
              1,
          )
          engine = engine.replace(
              '    task = _post_task(packet=rehydrated, founder=rehydrated_source, task_seed=task_seed)',
              '    if task_family == "exact_frontier":\n'
              '        task = _post_task_exact_frontier(\n'
              '            packet=rehydrated, founder=rehydrated_source, task_seed=task_seed\n'
              '        )\n'
              '    elif task_family == "prefix_adaptation":\n'
              '        task = _post_task_prefix_adaptation(\n'
              '            packet=rehydrated, founder=rehydrated_source, task_seed=task_seed\n'
              '        )\n'
              '    else:\n'
              '        raise M040EngineError(f"unknown M040 task family {task_family!r}")',
              1,
          )
          engine = engine.replace(
              '        preferred_programs=rehydrated.learning_state.continuation_programs,\n    )\n    fresh =',
              '        preferred_programs=rehydrated.learning_state.continuation_programs,\n'
              '        adapt_prefixes=(task_family == "prefix_adaptation"),\n'
              '    )\n    fresh =',
              1,
          )
          engine = engine.replace(
              '            rehydrated.learning_state.continuation_programs,\n        ),\n'
              '        "fresh_on_b"',
              '            rehydrated.learning_state.continuation_programs,\n'
              '            task_family == "prefix_adaptation",\n'
              '        ),\n'
              '        "fresh_on_b"',
              1,
          )
          engine = engine.replace(
              '        "fresh_on_b": (rehydrated_source, None, primitive_registry, (), ()),\n'
              '        "unchanged_parent_migrated": (original_founder, None, primitive_registry, (), ()),\n'
              '        "output_only": (None, rehydrated_source, (), (), ()),\n'
              '        "learning_state_ablated": (rehydrated_source, None, full_registry, (), ()),\n'
              '        "learned_tool_ablated": (rehydrated_source, None, tool_ablated_registry, (), ()),',
              '        "fresh_on_b": (rehydrated_source, None, primitive_registry, (), (), False),\n'
              '        "unchanged_parent_migrated": (original_founder, None, primitive_registry, (), (), False),\n'
              '        "output_only": (None, rehydrated_source, (), (), (), False),\n'
              '        "learning_state_ablated": (rehydrated_source, None, full_registry, (), (), False),\n'
              '        "learned_tool_ablated": (rehydrated_source, None, tool_ablated_registry, (), (), False),',
              1,
          )
          engine = engine.replace(
              '        audit_founder, output_body, audit_registry, preferred_ids, preferred_programs = audit_input',
              '        (\n'
              '            audit_founder, output_body, audit_registry, preferred_ids,\n'
              '            preferred_programs, audit_adapt_prefixes,\n'
              '        ) = audit_input',
              1,
          )
          engine = engine.replace(
              '            preferred_programs=preferred_programs,\n'
              '            maximum_depth=POST_MIGRATION_DEPTH,',
              '            preferred_programs=preferred_programs,\n'
              '            adapt_prefixes=audit_adapt_prefixes,\n'
              '            maximum_depth=POST_MIGRATION_DEPTH,',
              1,
          )
          engine = engine.replace(
              '    require_replay: bool = True,\n) -> M040DevelopmentResult:\n'
              '    first = _execute(master_seed, protocol_commitment)',
              '    require_replay: bool = True,\n'
              '    task_family: str = "prefix_adaptation",\n'
              ') -> M040DevelopmentResult:\n'
              '    first = _execute(master_seed, protocol_commitment, task_family=task_family)',
              1,
          )
          engine = engine.replace(
              '    replayed = _execute(master_seed, protocol_commitment)',
              '    replayed = _execute(master_seed, protocol_commitment, task_family=task_family)',
              1,
          )
          engine_path.write_text(engine)

          audit_path = Path('metamorphosis/m040_search_audit.py')
          audit = audit_path.read_text()
          audit = audit.replace(
              '    preferred_programs: Sequence[Sequence[str]],\n'
              '    maximum_depth: int,',
              '    preferred_programs: Sequence[Sequence[str]],\n'
              '    adapt_prefixes: bool,\n'
              '    maximum_depth: int,',
              1,
          )
          audit = audit.replace(
              '    preferred_programs: tuple[tuple[str, ...], ...]\n'
              '    maximum_depth: int',
              '    preferred_programs: tuple[tuple[str, ...], ...]\n'
              '    adapt_prefixes: bool\n'
              '    maximum_depth: int',
              1,
          )
          audit = audit.replace(
              '            "preferred_programs": [list(program) for program in self.preferred_programs],\n'
              '            "maximum_depth": self.maximum_depth,',
              '            "preferred_programs": [list(program) for program in self.preferred_programs],\n'
              '            "adapt_prefixes": self.adapt_prefixes,\n'
              '            "maximum_depth": self.maximum_depth,',
              1,
          )
          preferred_audit_start = audit.index('        for program_index, program_ids in enumerate(preferred_programs):')
          preferred_audit_end = audit.index('\n        def descend(', preferred_audit_start)
          preferred_audit = textwrap.indent(textwrap.dedent('''
          primitive_suffixes = tuple(
              tool for tool in ordered_registry
              if tool.provenance.origin == ORIGIN_PROTOCOL_SUPPLIED
          )
          for program_index, program_ids in enumerate(preferred_programs):
              selected: list[LineageTool] = []
              expanded: list[Atom] = []
              current: DFA | None = founder
              program_valid = True
              for position, tool_id in enumerate(program_ids):
                  tool = registry_by_id.get(str(tool_id))
                  if tool is None:
                      transcript.append({
                          "kind": "preferred_program_missing_tool",
                          "arm": arm,
                          "program_index": program_index,
                          "position": position,
                          "tool_id": str(tool_id),
                      })
                      program_valid = False
                      break
                  symbolic_nodes += 1
                  if symbolic_nodes > node_budget:
                      reason = "symbolic_node_budget_exhausted"
                      stop = True
                      break
                  atoms = _tool_atoms(tool)
                  applied = 0
                  for atom in atoms:
                      primitive_operations += 1
                      applied += 1
                      current = apply_atom(current, atom)  # type: ignore[arg-type]
                      if current is None:
                          break
                      expanded.append(atom)
                  transcript.append({
                      "kind": "preferred_prefix_expansion",
                      "arm": arm,
                      "program_index": program_index,
                      "position": position,
                      "tool_id": tool.tool_id,
                      "primitive_operations_applied": applied,
                      "success": current is not None,
                      "raw_result_digest": None if current is None else _raw_body_digest(current),
                  })
                  if current is None:
                      program_valid = False
                      break
                  if tool.provenance.origin == ORIGIN_LINEAGE_CONSTRUCTED:
                      tool_symbols_used += 1
                  selected.append(tool)
              if stop:
                  break
              if not program_valid or current is None:
                  continue
              if adapt_prefixes:
                  for suffix_index, suffix in enumerate(primitive_suffixes):
                      symbolic_nodes += 1
                      if symbolic_nodes > node_budget:
                          reason = "symbolic_node_budget_exhausted"
                          stop = True
                          break
                      suffix_body: DFA | None = current
                      suffix_atoms = _tool_atoms(suffix)
                      applied = 0
                      for atom in suffix_atoms:
                          primitive_operations += 1
                          applied += 1
                          suffix_body = apply_atom(suffix_body, atom)  # type: ignore[arg-type]
                          if suffix_body is None:
                              break
                      transcript.append({
                          "kind": "preferred_suffix_expansion",
                          "arm": arm,
                          "program_index": program_index,
                          "suffix_index": suffix_index,
                          "suffix_tool_id": suffix.tool_id,
                          "primitive_operations_applied": applied,
                          "success": suffix_body is not None,
                          "raw_result_digest": (
                              None if suffix_body is None else _raw_body_digest(suffix_body)
                          ),
                      })
                      if suffix_body is not None and evaluate_completed(
                          selected=selected + [suffix],
                          expanded=expanded + list(suffix_atoms),
                          body=suffix_body,
                          source="transported_prefix_adaptation",
                          requested_depth=len(program_ids) + 1,
                      ):
                          stop = True
                          break
              elif evaluate_completed(
                  selected=selected,
                  expanded=expanded,
                  body=current,
                  source="transported_continuation",
                  requested_depth=len(program_ids),
              ):
                  stop = True
              if stop:
                  break
          '''), '        ').rstrip()
          audit = audit[:preferred_audit_start] + preferred_audit + audit[preferred_audit_end:]
          audit = audit.replace(
              '                "transported_continuation_adopted"\n'
              '                if source == "transported_continuation"\n'
              '                else "exact_candidate_adopted"',
              '                "transported_prefix_adapted"\n'
              '                if source == "transported_prefix_adaptation"\n'
              '                else (\n'
              '                    "transported_continuation_adopted"\n'
              '                    if source == "transported_continuation"\n'
              '                    else "exact_candidate_adopted"\n'
              '                )',
              1,
          )
          audit = audit.replace(
              '        maximum_depth=maximum_depth,\n'
              '        node_budget=node_budget,',
              '        adapt_prefixes=adapt_prefixes,\n'
              '        maximum_depth=maximum_depth,\n'
              '        node_budget=node_budget,',
              1,
          )
          audit_path.write_text(audit)

          failures_path = Path('tests/test_m040_consumed_failures.py')
          failures = failures_path.read_text().replace(
              'run_m040_development(master_seed=400043, require_replay=False)',
              'run_m040_development(\n'
              '            master_seed=400043, require_replay=False, task_family="exact_frontier"\n'
              '        )',
              1,
          )
          failures_path.write_text(failures)

          tests_path = Path('tests/test_m040_post_migration.py')
          tests = tests_path.read_text()
          tests = tests.replace(
              '    assert tuple(arms["complete_migrated_lineage"].accepted_tool_ids) in packet.learning_state.continuation_programs',
              '    accepted_ids = tuple(arms["complete_migrated_lineage"].accepted_tool_ids)\n'
              '    assert accepted_ids[:-1] in packet.learning_state.continuation_programs\n'
              '    suffix = next(tool for tool in packet.tool_registry if tool.tool_id == accepted_ids[-1])\n'
              '    assert suffix.provenance.origin == "protocol_supplied"\n'
              '    assert accepted_ids not in packet.learning_state.continuation_programs',
              1,
          )
          tests += textwrap.dedent('''

          def test_prefix_adaptation_task_is_not_fully_stored_in_packet(result) -> None:
              packet = rehydrate_packet(result.packet_json, expected_sha256=result.packet_sha256)
              accepted = tuple(result.arms["complete_migrated_lineage"].accepted_tool_ids)
              assert result.task.task_family == "prefix_plus_primitive"
              assert accepted == result.task.generating_tool_ids
              assert accepted[:-1] in packet.learning_state.continuation_programs
              assert accepted not in packet.learning_state.continuation_programs
              assert result.task.digest() not in result.packet_json
          ''')
          tests_path.write_text(tests)
          PY
      - name: Compile amendment before measurement
        run: |
          python -m py_compile \
            metamorphosis/m040_engine.py \
            metamorphosis/m040_search_audit.py \
            tests/test_m040_post_migration.py \
            tests/test_m040_consumed_failures.py
      - name: Evaluate seed 400044 with exhaustive replay
        run: |
          python -m pip install -e ".[dev]"
          pytest -q \
            tests/test_m040_duplicate_dependencies.py \
            tests/test_m040_post_migration.py \
            tests/test_m040_consumed_failures.py
      - name: Commit amendment implementation
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          mkdir -p archives/workflows
          cp .github/workflows/m040-apply-prefix-adaptation.yml archives/workflows/m040-apply-prefix-adaptation.yml
          git rm .github/workflows/m040-apply-prefix-adaptation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            metamorphosis/m040_engine.py \
            metamorphosis/m040_search_audit.py \
            tests/test_m040_post_migration.py \
            tests/test_m040_consumed_failures.py \
            archives/workflows/m040-apply-prefix-adaptation.yml
          git commit -m 'feat(m040): adapt transported continuation prefixes after migration'
          git push origin "HEAD:${BRANCH}"
