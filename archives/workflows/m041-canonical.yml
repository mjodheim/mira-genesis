# ARCHIVED after the unique first M041 run 30937650241.
# Arming head: 6c404f7fce00087048dcb7d6e346bd5c84308cf8
# Scientific outcome: negative.
# Retained for reproduction only; intentionally outside .github/workflows.

name: M041 first canonical completion run

on:
  pull_request:
    paths:
      - 'experiments/M041/CANONICAL_ARMED.json'
      - 'experiments/M041/PROTOCOL.md'
      - 'experiments/M041/run_canonical.py'
      - 'metamorphosis/m040_engine.py'
      - 'metamorphosis/m041_*.py'
      - 'scripts/check_m041_canonical_guard.py'
      - '.github/workflows/m041-canonical.yml'

permissions:
  contents: read

concurrency:
  group: m041-canonical-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  guarded-canonical-run:
    name: Guarded first M041 completion run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the immutable pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Inspect the head without opening the sealed block
        id: guard
        shell: bash
        run: |
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD)
          args=()
          for path in "${changed[@]}"; do
            args+=(--changed-file "$path")
          done
          python scripts/check_m041_canonical_guard.py \
            --head-sha "$(git rev-parse HEAD)" \
            --parent-sha "$(git rev-parse HEAD^)" \
            --commit-message "$(git log -1 --pretty=%B)" \
            --github-output "$GITHUB_OUTPUT" \
            "${args[@]}"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.armed == 'true'
        with:
          python-version: '3.11'

      - name: Install the frozen package
        if: steps.guard.outputs.armed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Execute and preserve the unique completion result
        if: steps.guard.outputs.armed == 'true'
        env:
          M041_CANONICAL_RUN: '1'
        run: |
          python experiments/M041/run_canonical.py \
            --head-sha "$(git rev-parse HEAD)" \
            --parent-sha "$(git rev-parse HEAD^)" \
            --marker experiments/M041/CANONICAL_ARMED.json \
            --protocol experiments/M041/PROTOCOL.md \
            --output m041-canonical-result.json

      - name: Verify immutable first-run metadata
        if: steps.guard.outputs.armed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('m041-canonical-result.json').read_text())
          assert payload['schema'] == 'm041-canonical-envelope/1'
          assert payload['status'] == 'first-canonical-result'
          assert payload['first_run_only'] is True
          assert payload['reruns_are_reproductions_only'] is True
          assert payload['arming_head_sha'] == '${{ github.event.pull_request.head.sha }}'
          assert payload['scientific_outcome'] in {'positive', 'negative'}
          assert isinstance(payload['canonical_completion_claim_supported'], bool)
          PY

      - name: Upload the immutable first result
        if: steps.guard.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: m041-first-canonical-${{ github.event.pull_request.head.sha }}
          path: m041-canonical-result.json
          if-no-files-found: error
          retention-days: 90

      - name: Confirm the sealed block stayed closed
        if: steps.guard.outputs.armed != 'true'
        run: echo "M041 canonical block remains closed on this commit."
