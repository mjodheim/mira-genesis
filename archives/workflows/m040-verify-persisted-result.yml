name: Verify M040 persisted result

on:
  pull_request:
    paths:
      - '.github/workflows/m040-verify-persisted-result.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Remove an accidental task-digest comparison shortcut
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('metamorphosis/m040_result_verify.py')
          text = path.read_text()
          old = '    _require(task["target_digest"] == payload["task_digest"] or _sha(payload["task_digest"], "task digest"), "")\n'
          new = '    _sha(payload["task_digest"], "task digest")\n'
          if old not in text:
              raise SystemExit('task-digest shortcut not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run baseline and all persisted-result mutations
        run: |
          python -m pip install -e ".[dev]"
          pytest -q tests/test_m040_result_verifier.py
      - name: Archive workflow and commit verified result checker
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          mkdir -p archives/workflows
          cp .github/workflows/m040-verify-persisted-result.yml archives/workflows/m040-verify-persisted-result.yml
          git rm .github/workflows/m040-verify-persisted-result.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add metamorphosis/m040_result_verify.py archives/workflows/m040-verify-persisted-result.yml
          git commit -m 'test(m040): verify committed result against 29 mutations'
          git push origin "HEAD:${BRANCH}"
