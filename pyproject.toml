# Without an explicit build system and package list, `pip install -e ".[dev]"` —
# the command documented in the README and in docs/REPRODUCIBILITY.md — fails because
# setuptools refuses flat-layout discovery when `results/`, `archives/` and
# `experiments/` live next to the package. The former CI never exposed this because it
# installed dependencies manually without reading this file.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-genesis"
version = "0.20.0"
description = "Experimental trans-substrate cognitive metamorphosis research"
requires-python = ">=3.11"
# `numpy` is the only runtime dependency. It supports batched behavioural-equivalence
# calculations in the `*_eval_support` modules. `torch` and `scipy` were declared but
# no longer imported after retirement R001; see `archives/RETIRED_CODE.md`.
dependencies = [
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
# `scripts/` contains repository entry points executed from the project root rather
# than an installable package; `pytest.ini_options.pythonpath` exposes it to tests.
packages = ["metamorphosis"]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]
