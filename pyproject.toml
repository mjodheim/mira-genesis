# Sans `build-system` ni `tool.setuptools.packages`, `pip install -e ".[dev]"` —
# la commande documentée dans le README et dans docs/REPRODUCIBILITY.md — échouait :
# setuptools refuse la découverte à plat quand `results/`, `archives/` et
# `experiments/` cohabitent avec le paquet. L'ancienne CI ne l'a jamais rencontré
# parce qu'elle installait ses dépendances à la main, sans lire ce fichier.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-genesis"
version = "0.12.0"
description = "Experimental trans-substrate cognitive metamorphosis research"
requires-python = ">=3.11"
# `numpy` est la seule dépendance d'exécution réelle : elle sert au calcul par lots
# de l'équivalence comportementale dans les modules `*_eval_support`.
# `torch` et `scipy` étaient déclarés mais jamais importés depuis le retrait R001
# (voir `archives/RETIRED_CODE.md`).
dependencies = [
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
# `scripts/` est un ensemble de points d'entrée exécutés depuis la racine, pas un
# paquet installable ; `pytest.ini_options.pythonpath` s'en charge.
packages = ["metamorphosis"]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]
