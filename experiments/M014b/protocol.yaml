experiment: M014b
title: Portable Plasticity — sealed evaluation
status: frozen
protocol_frozen: true
frozen_at: 2026-07-31
results_allowed: true

question: >-
  Can a serialized learning policy migrate with an inherited finite competence
  to a runtime-sealed opaque substrate, identify a previously unseen local
  behavioral modification from fewer queries than the registered baselines,
  synthesize an exact updated native body, and preserve the archived prior body?

validated_prerequisites:
  - M012b_sealed_autonomous_morphogenesis
  - M013e_sealed_unknown_substrate_migration

development_only_namespace:
  demonstrations: 31xxx
  positive_cases: 32xxx_to_33xxx
  negative_cases: 37xxx
  search: 41xxx_to_45xxx
sealed_case_source: runtime_cryptographic_nonce
stored_evaluation_seeds_before_first_run: false
canonical_trigger: first_pull_request_opened_run
canonical_attempt: 1

principal_cases:
  inherited_competences: 12
  opaque_machines: 3
  total_chains: 36
  machine_families: 3
  hidden_words_per_old_body: 20000
  hidden_words_per_new_body: 20000

portable_plasticity_passport:
  training_source: deterministic_development_demonstrations_only
  required_fields:
    - hypothesis_language
    - learned_prior
    - active_query_policy
    - uncertainty_representation
    - abstention_rule
    - consolidation_rule
    - development_provenance_sha256
  forbidden_fields:
    - evaluation_target
    - evaluation_seed
    - expected_answers
    - opcode_map
    - machine_specific_compiler
  maximum_serialized_bytes: 2048

learnable_update_language:
  - acceptance_flip
  - transition_redirect
  - one_acceptance_flip_plus_one_transition_redirect
negative_control_families:
  three_edit_targets: 4
  state_adding_targets: 4
  nondeterministic_or_changing_oracles: 4

budgets:
  substrate_probe_calls: 120
  update_oracle_calls: 192
  median_total_update_calls: 52
  maximum_total_update_calls: 72
  morphogenesis_attempts_per_body: 3
  native_components: 360
  serialized_body_bytes: 16777216

baselines:
  - random_query_policy_same_hypothesis_language
  - inherited_skill_without_learned_plasticity_passport
  - scratch_lstar_with_evaluator_equivalence_oracle
  - oracle_transformation_ceiling

acceptance_criteria:
  - exact_principal_chains_at_least_32_of_36
  - at_least_10_of_12_per_machine
  - all_claimed_successes_exact_hidden_serialized_semantic_and_archive_safe
  - median_identification_calls_at_most_24
  - identification_at_least_25_percent_better_than_scratch_lstar
  - identification_at_least_20_percent_better_than_random_and_no_passport
  - bounded_total_update_cost_median_52_max_72
  - oracle_transformation_gap_at_most_four
  - negative_controls_12_of_12_zero_false_success_zero_archive_mutation
  - complete_sealed_traceability_and_portable_passport

interpretation_limit: >-
  A success validates portable plasticity only for a finite language of local
  DFA edits on runtime-sealed opaque Boolean substrates. It does not validate
  general learning, autobiographical continuity, continuous-physics adaptation,
  AGI, or open-ended self-improvement.
