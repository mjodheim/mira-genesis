name: Genesis causal fixture expectation repair

on:
  push:
    branches:
      - fix/genesis-novel-causal-ablation-20260909

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/genesis-novel-causal-ablation-20260909
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Update the stale demonstration expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_genesis_demonstration.py")
          text = path.read_text(encoding="utf-8")
          old_doc = """    t2 and t3 are `error` rather than `unsolved` because the body raises instead of returning a
              wrong answer. A parent that had merely never learned those tasks would return nothing for them,
              which grades as `unsolved`; this body reaches.
          """
          new_doc = """    t2, t3 and the newly gained t4 are `error` rather than `unsolved` because the body raises
              instead of returning a wrong answer. The t4 loss is now load-bearing: it proves the ablation
              breaks work newly gained by this generation, not only work retained from its parent.
          """
          if text.count(old_doc) != 1:
              raise SystemExit("demonstration ablation docstring anchor changed")
          text = text.replace(old_doc, new_doc, 1)

          old_row = '        "t4": "solved",\n'
          if text.count(old_row) != 1:
              raise SystemExit("demonstration t4 expectation anchor changed")
          text = text.replace(old_row, '        "t4": "error",\n', 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run the stale expectation regression
        run: >-
          python -m pytest -q
          tests/test_genesis_demonstration.py::test_the_ablated_generation_breaks_rather_than_falling_back_to_its_parent

      - name: Publish the corrected expectation and remove this workflow
        shell: bash
        run: |
          git config user.name 'Anthony Mets'
          git config user.email '110968830+mjodheim@users.noreply.github.com'
          git rm .github/workflows/genesis-causal-fixture-expectation-repair.yml
          git add tests/test_genesis_demonstration.py
          git commit -s -m 'test(genesis): align ablation expectation with causal fixture'
          git push origin HEAD:fix/genesis-novel-causal-ablation-20260909
