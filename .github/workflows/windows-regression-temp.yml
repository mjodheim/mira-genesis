name: Temporary Windows regression

on:
  pull_request:
    paths:
      - 'mira_core/process.py'
      - 'mira_core/memory.py'
      - 'tests/**'
      - '.github/workflows/windows-regression-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install project and test dependency
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Reproduce Codex Windows and memory regressions
        shell: pwsh
        run: python -m pytest -q tests/test_codex_audit_regressions.py
      - name: Diagnose complete-suite collection on Windows
        id: collection
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pytest --collect-only -q 2>&1 | Tee-Object -FilePath collection.txt
          exit $LASTEXITCODE
      - name: Report only collection-error modules
        if: always()
        shell: pwsh
        run: |
          Write-Host '=== WINDOWS COLLECTION ERRORS ==='
          Select-String -Path collection.txt -Pattern 'ERROR collecting|ModuleNotFoundError: No module named .fcntl.' | ForEach-Object { $_.Line }
      - name: Require complete collection
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.collection.outcome }}' -ne 'success') { exit 1 }
