name: GPT56 post-migration form focused validation

on:
  push:
    branches:
      - review/gpt56-genesis-post-migration-form-fast-validation-20260910

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run focused Genesis continuation tests
        run: >-
          pytest -q
          tests/test_genesis_post_migration_form_continuation.py
          tests/test_genesis_program_form_scope.py
          tests/test_genesis_repeated_meta_policy_descent.py
          tests/test_genesis_integrated_meta_loop.py
          tests/test_genesis_generated_restore.py
          tests/test_genesis_meta_policy_evolution.py
          tests/test_genesis_meta_policy_measurement_revalidation.py
          tests/test_genesis_meta_policy_budget_crash_consistency.py
