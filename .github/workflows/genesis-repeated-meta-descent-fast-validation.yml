name: Genesis repeated MetaPolicy descent focused validation

on:
  push:
    branches:
      - review/gpt56-genesis-repeated-meta-descent-fast-validation-20260909

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run focused repeated MetaPolicy descent tests
        run: |
          pytest -q \
            tests/test_genesis_repeated_meta_policy_descent.py \
            tests/test_genesis_meta_policy_runtime_integration.py \
            tests/test_genesis_meta_policy_budget_crash_consistency.py \
            tests/test_genesis_meta_policy_evolution.py \
            tests/test_genesis_meta_policy_measurement_revalidation.py \
            tests/test_genesis_meta_policy_order_invariance.py \
            tests/test_genesis_integrated_meta_loop.py \
            tests/test_genesis_generated_policy_mutation.py \
            tests/test_genesis_durable_policy_causality.py \
            tests/test_genesis_cross_objective_retention.py
