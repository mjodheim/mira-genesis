name: GPT56 executable form identity validation

on:
  push:
    branches:
      - validation/gpt56-genesis-executable-form-identity-20260911

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Apply prospective repair
        run: python scripts/apply_gpt56_executable_form_identity_patch.py
      - name: Run focused migration/campaign regressions
        run: >-
          python -m pytest -q
          tests/test_genesis_persistent_metamorphic_campaign.py
          tests/test_genesis_post_migration_form_continuation.py
          tests/test_genesis_generated_parent_dependency.py
          tests/test_genesis_migration.py
          tests/test_genesis_loop.py
          tests/test_genesis_artifact_immutability.py
      - name: Remove one-shot validation apparatus
        run: |
          rm scripts/apply_gpt56_executable_form_identity_patch.py
          rm .github/workflows/gpt56-executable-form-identity-validation.yml
      - name: Check repository structure
        run: |
          python scripts/check_repository_integrity.py --orphans
          python scripts/check_repository_integrity.py --dependencies
      - name: Publish clean validated tree
        run: |
          git config user.name 'Anthony Mets'
          git config user.email '110968830+mjodheim@users.noreply.github.com'
          git add -A
          git commit -s -m 'fix(genesis): verify form change by resolved executable identity'
          git push origin HEAD:validation/gpt56-genesis-executable-form-identity-20260911
