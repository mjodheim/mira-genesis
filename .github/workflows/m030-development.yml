name: M030 untouched-seed confirmation

# Development only. Smoke execution uses seeds 128-131 so the frozen confirmation
# block 64-127 remains untouched until the recorded local development run.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m030-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run M030 focused tests
        run: pytest -q tests/test_m030_unseen_confirmation.py
      - name: Run four non-confirmatory smoke seeds
        run: >-
          python scripts/run_m030_unseen_component_confirmation.py
          --seed-start 128
          --seeds 4
          --workers 4
          --output results/M030_unseen_component_smoke.json
      - name: Verify smoke-only and isolation guardrails
        run: |
          python - <<'PYTHON'
          import json
          import pathlib
          import sys

          payload = json.loads(
              pathlib.Path("results/M030_unseen_component_smoke.json")
              .read_text(encoding="utf-8")
          )
          summary = payload["summary"]
          required = {
              "comparison_status": "insufficient_paired_seeds",
              "exact_confirmation_seed_range": False,
              "coverage_exact": True,
              "aligned_control_exact": True,
              "component_probe_controls_pass": True,
              "component_probe_hidden_disjoint": True,
              "unique_task_evaluations": True,
              "hidden_fields_visible_to_selectors": False,
              "integer_only_selection_traces": True,
          }
          for key, expected in required.items():
              if summary.get(key) != expected:
                  sys.exit(f"{key}={summary.get(key)!r}, expected {expected!r}")
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: m030-smoke-${{ github.run_id }}
          path: results/M030_unseen_component_smoke.json
          if-no-files-found: error
          retention-days: 30
