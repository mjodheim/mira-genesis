name: Genesis focused validation

on:
  push:
    branches:
      - review/gpt56-genesis-fast-validation-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run focused Genesis frontier tests
        run: |
          pytest -q \
            tests/test_genesis_endogenous_frontier.py \
            tests/test_genesis_generated_search.py \
            tests/test_genesis_generated_restore.py \
            tests/test_genesis_policy_evolution.py \
            tests/test_genesis_artifact_immutability.py
