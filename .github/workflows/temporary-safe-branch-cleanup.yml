name: Temporary safe branch archive cleanup

on:
  push:
    branches:
      - maintenance/repo-consolidation-20260909

permissions:
  contents: write

jobs:
  archive-and-delete:
    if: github.repository == 'mjodheim/mira-genesis'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Archive and atomically delete branches already contained in main
        shell: bash
        run: |
          set -euo pipefail

          expected_main='e0487b2ed8b88db2f50102123c0e6dd49176cdd0'
          branches=(
            'audit/scientific-validation-20260905'
            'docs/state-sync-20260905'
            'docs/sync-m124-state-20260906'
            'fix/codex-audit-hardening-20260905'
            'research/m120-h65-successor'
            'research/m120-readiness'
            'research/m121-h66-g7-groundwork'
            'research/m122-flattened-contract'
            'research/m123-two-point-stress'
            'research/m124-pinned-cardinalities'
            'review/m125-preimplementation-20260906'
          )

          git fetch --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

          actual_main="$(git rev-parse origin/main)"
          if [[ "$actual_main" != "$expected_main" ]]; then
            echo "main moved unexpectedly: expected $expected_main, found $actual_main" >&2
            exit 1
          fi

          # Complete preflight before creating or deleting any remote ref.
          for branch in "${branches[@]}"; do
            remote_ref="refs/remotes/origin/$branch"
            if ! git show-ref --verify --quiet "$remote_ref"; then
              echo "missing remote branch: $branch" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "origin/$branch" origin/main; then
              echo "branch is not contained in main: $branch" >&2
              exit 1
            fi
          done

          # Prepare archive tags locally. Existing tags are accepted only when exact.
          for branch in "${branches[@]}"; do
            branch_sha="$(git rev-parse "origin/$branch")"
            tag="archive/$branch"
            tag_ref="refs/tags/$tag"
            if git show-ref --verify --quiet "$tag_ref"; then
              tag_sha="$(git rev-parse "$tag_ref^{commit}")"
              if [[ "$tag_sha" != "$branch_sha" ]]; then
                echo "archive tag collision for $branch: $tag_sha != $branch_sha" >&2
                exit 1
              fi
            else
              git tag "$tag" "$branch_sha"
            fi
          done

          tag_refspecs=()
          for branch in "${branches[@]}"; do
            tag="archive/$branch"
            tag_refspecs+=("refs/tags/$tag:refs/tags/$tag")
          done
          git push --atomic origin "${tag_refspecs[@]}"

          # No branch deletion is attempted until every remote tag points at the branch tip.
          for branch in "${branches[@]}"; do
            branch_sha="$(git rev-parse "origin/$branch")"
            tag="archive/$branch"
            remote_tag_sha="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"
            if [[ "$remote_tag_sha" != "$branch_sha" ]]; then
              echo "remote archive verification failed for $branch" >&2
              exit 1
            fi
          done

          delete_refspecs=()
          for branch in "${branches[@]}"; do
            delete_refspecs+=(":refs/heads/$branch")
          done
          git push --atomic origin "${delete_refspecs[@]}"

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "branch still exists after deletion: $branch" >&2
              exit 1
            fi
            echo "archived and deleted: $branch"
          done
