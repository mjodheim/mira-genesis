name: M092 first canonical criterion search

# This workflow is intentionally inert until one exact marker-only commit arms it. The transport
# is merged and reviewed before that commit exists, so the first target search cannot be rehearsed
# or silently repaired inside the same change that consumes it.
on:
  pull_request:
    paths:
      - 'experiments/M092/CANONICAL_SEARCH_ARMED.json'
      - 'experiments/M092/PROTOCOL.json'
      - 'experiments/M092/TARGET_THEOREM.json'
      - 'metamorphosis/m092_criterion_search.py'
      - 'metamorphosis/m092_resume_validation.py'
      - 'metamorphosis/m092_search_enumerator.py'
      - 'metamorphosis/m092_certificate_policy_search.py'
      - 'metamorphosis/m092_certificate_generator.py'
      - 'metamorphosis/m092_proof_search.py'
      - 'metamorphosis/m092_candidate_validation.py'
      - 'metamorphosis/m092_certificate_verifier.py'
      - 'metamorphosis/m092_kernel.py'
      - 'metamorphosis/m092_runtime.py'
      - 'scripts/run_m092_criterion_search.py'
      - 'scripts/check_m092_criterion_freeze.py'
      - 'scripts/check_m092_canonical_guard.py'
      - 'scripts/package_m092_canonical_search.py'
      - '.github/workflows/m092-canonical-search.yml'

permissions:
  contents: read
  actions: read

# A constant group serialises every possible arming branch. Together with the prior-artifact check,
# a second branch cannot race the first one and consume another purported "first" search.
concurrency:
  group: m092-first-canonical-criterion-search
  cancel-in-progress: false

jobs:
  guarded-first-search:
    name: Guarded first M092 canonical criterion search
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the immutable pull-request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Inspect the head without opening the search
        id: guard
        shell: bash
        run: |
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD)
          mapfile -t statuses < <(git diff-tree --no-commit-id --name-status -r HEAD^ HEAD)
          args=()
          status_args=()
          for path in "${changed[@]}"; do
            args+=(--changed-file "$path")
          done
          for status in "${statuses[@]}"; do
            status_args+=(--changed-status "$status")
          done
          python scripts/check_m092_canonical_guard.py \
            --head-sha "$(git rev-parse HEAD)" \
            --parent-sha "$(git rev-parse HEAD^)" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --commit-message "$(git log -1 --pretty=%B)" \
            --github-output "$GITHUB_OUTPUT" \
            "${args[@]}" \
            "${status_args[@]}"

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.armed == 'true'
        with:
          python-version: '3.11'

      - name: Install the frozen package
        if: steps.guard.outputs.armed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Refuse a second completed first-run artifact
        if: steps.guard.outputs.armed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = (
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              "/actions/artifacts?name=m092-first-canonical-search&per_page=100"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          if payload.get("total_count", 0) != 0:
              raise SystemExit("a completed M092 first canonical search artifact already exists")
          print("No completed M092 first canonical search artifact exists.")
          PY

      - name: Recheck every decisive M092 pre-search boundary
        if: steps.guard.outputs.armed == 'true'
        run: |
          python -m scripts.check_m092a_checkpoint
          python -m scripts.check_m092b_protocol
          python -m scripts.check_m092b_candidate_scanner
          python -m scripts.check_m092b_search_enumerator
          python -m scripts.check_m092_certificate_policy_search
          python -m scripts.check_m092_criterion_freeze --assert-pre-search

      # The job retains thirty minutes after this step's deadline. The runner writes genesis before
      # consuming a proposal and then atomically checkpoints only at completed program boundaries.
      # A normal timeout therefore leaves a reproducible prefix for the preservation steps.
      - name: Execute the unique frozen target search
        id: search
        if: steps.guard.outputs.armed == 'true'
        timeout-minutes: 330
        run: |
          python scripts/run_m092_criterion_search.py \
            --requirement experiments/M092/TARGET_THEOREM.json \
            --output m092-canonical-search-state.json \
            --program-limit 2000000 \
            --checkpoint-programs 1000

      - name: Record every reached canonical execution attempt
        id: attempt_record
        if: always() && steps.guard.outputs.armed == 'true' && steps.search.outcome != 'skipped'
        env:
          SEARCH_OUTCOME: ${{ steps.search.outcome }}
          ARM_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARM_PARENT_SHA: ${{ github.event.pull_request.base.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state_path = Path('m092-canonical-search-state.json')
          state = None
          if state_path.is_file():
              candidate = json.loads(state_path.read_text(encoding='utf-8'))
              if not isinstance(candidate, dict):
                  raise SystemExit('canonical checkpoint is not a JSON object')
              state = candidate

          terminal_statuses = {
              'candidate_selected',
              'program_budget_exhausted',
              'certificate_budget_exhausted',
          }
          payload = {
              'schema': 'm092-canonical-search-attempt/1',
              'arming_head_sha': os.environ['ARM_HEAD_SHA'],
              'arming_parent_sha': os.environ['ARM_PARENT_SHA'],
              'github_run_id': int(os.environ['RUN_ID']),
              'github_run_attempt': int(os.environ['RUN_ATTEMPT']),
              'execution_step_outcome': os.environ['SEARCH_OUTCOME'],
              'target_search_execution_step_reached': True,
              'checkpoint_present': state is not None,
              'checkpoint_status': None if state is None else state.get('status'),
              'checkpoint_generated_programs': None if state is None else state.get('generated_programs'),
              'checkpoint_certificate_policy_attempts': (
                  None if state is None else state.get('certificate_policy_attempts')
              ),
              'checkpoint_state_digest': None if state is None else state.get('state_digest'),
              'checkpoint_terminal': (
                  False if state is None else state.get('status') in terminal_statuses
              ),
              'candidate_executed_for_selection': (
                  False if state is None else state.get('candidate_executed_for_selection')
              ),
              'qualification_loaded': False if state is None else state.get('qualification_loaded'),
              'retry_rule': 'exact_same_arming_head_deterministic_reproduction_only',
          }
          Path('m092-canonical-search-attempt.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      # Completed-result preservation is deliberately evaluated before the secondary attempt upload.
      # A failure of that secondary upload must not suppress an otherwise valid terminal artifact.
      - name: Package immutable first-run provenance
        id: package
        if: always() && steps.guard.outputs.armed == 'true' && steps.search.outcome == 'success'
        run: |
          python scripts/package_m092_canonical_search.py \
            --state m092-canonical-search-state.json \
            --marker experiments/M092/CANONICAL_SEARCH_ARMED.json \
            --target-theorem experiments/M092/TARGET_THEOREM.json \
            --head-sha "$(git rev-parse HEAD)" \
            --parent-sha "$(git rev-parse HEAD^)" \
            --output m092-first-canonical-search-result.json

      - name: Confirm selection remained separate from qualification
        id: separation
        if: always() && steps.package.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('m092-first-canonical-search-result.json').read_text())
          assert payload['schema'] == 'm092-canonical-criterion-search-result/1'
          assert payload['status'] == 'first-canonical-criterion-search-result'
          assert payload['first_run_only'] is True
          assert payload['reruns_are_reproductions_only'] is True
          assert payload['target_search_executed'] is True
          assert payload['qualification_loaded'] is False
          assert payload['candidate_executed_for_selection'] is False
          assert payload['terminal_search_status'] in {
              'candidate_selected', 'program_budget_exhausted', 'certificate_budget_exhausted'
          }
          PY
          test ! -e experiments/M092/VALIDATION_RECEIPT.json
          test ! -e experiments/M092/SUBSTRATE_B.json
          test ! -e experiments/M092/LANGUAGE_B.json
          test ! -e experiments/M092/QUALIFICATION.json
          test ! -e experiments/M092/RESULT.json

      - name: Upload the immutable completed canonical search artifact
        if: always() && steps.package.outcome == 'success' && steps.separation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: m092-first-canonical-search
          path: |
            m092-canonical-search-state.json
            m092-first-canonical-search-result.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve every reached canonical execution attempt
        if: always() && steps.guard.outputs.armed == 'true' && steps.search.outcome != 'skipped' && steps.attempt_record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: m092-canonical-search-attempt-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            m092-canonical-search-attempt.json
            m092-canonical-search-state.json
          if-no-files-found: error
          retention-days: 90

      - name: Confirm the canonical search stayed closed
        if: steps.guard.outputs.armed != 'true'
        run: echo "M092 canonical criterion search remains closed on this commit."
