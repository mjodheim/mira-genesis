name: M092 first canonical criterion search

# One marker-only PR commit arms one logical search. The search may span multiple hosted jobs, but
# every continuation consumes only the immutable predecessor artifact from the same arming head.
on:
  pull_request:
    paths:
      - 'experiments/M092/CANONICAL_SEARCH_ARMED.json'
      - 'experiments/M092/PROTOCOL.json'
      - 'experiments/M092/TARGET_THEOREM.json'
      - 'metamorphosis/m092_criterion_search.py'
      - 'metamorphosis/m092_resume_validation.py'
      - 'metamorphosis/m092_search_enumerator.py'
      - 'metamorphosis/m092_certificate_policy_search.py'
      - 'metamorphosis/m092_certificate_generator.py'
      - 'metamorphosis/m092_proof_search.py'
      - 'metamorphosis/m092_candidate_validation.py'
      - 'metamorphosis/m092_certificate_verifier.py'
      - 'metamorphosis/m092_kernel.py'
      - 'metamorphosis/m092_runtime.py'
      - 'scripts/run_m092_criterion_search.py'
      - 'scripts/check_m092_criterion_freeze.py'
      - 'scripts/check_m092_canonical_guard.py'
      - 'scripts/package_m092_canonical_search.py'
      - 'scripts/package_m092_canonical_segment.py'
      - '.github/workflows/m092-canonical-search.yml'
  workflow_dispatch:
    inputs:
      arming_pr_number:
        description: Exact still-open marker-only arming PR number
        required: true
        type: string
      arming_head_sha:
        description: Immutable marker-only arming head
        required: true
        type: string
      arming_parent_sha:
        description: Frozen parent of the arming commit
        required: true
        type: string
      segment_index:
        description: Exact next zero-based canonical segment index
        required: true
        type: string
      previous_run_id:
        description: Run containing the predecessor segment artifact
        required: true
        type: string
      previous_artifact_id:
        description: Immutable predecessor artifact id
        required: true
        type: string
      previous_artifact_digest:
        description: SHA-256 returned by upload-artifact for the predecessor
        required: true
        type: string

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: m092-first-canonical-criterion-search
  cancel-in-progress: false

jobs:
  guarded-canonical-segment:
    name: Guarded M092 canonical criterion-search segment
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Resolve immutable invocation identity
        id: invocation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          INPUT_PR_NUMBER: ${{ inputs.arming_pr_number }}
          INPUT_HEAD: ${{ inputs.arming_head_sha }}
          INPUT_PARENT: ${{ inputs.arming_parent_sha }}
          INPUT_SEGMENT: ${{ inputs.segment_index }}
          INPUT_PREVIOUS_RUN: ${{ inputs.previous_run_id }}
          INPUT_PREVIOUS_ARTIFACT: ${{ inputs.previous_artifact_id }}
          INPUT_PREVIOUS_DIGEST: ${{ inputs.previous_artifact_digest }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          if os.environ['EVENT_NAME'] == 'pull_request':
              values = {
                  'arming_pr_number': os.environ['PR_NUMBER'],
                  'arming_head_sha': os.environ['PR_HEAD'],
                  'arming_parent_sha': os.environ['PR_BASE'],
                  'segment_index': '0',
                  'previous_run_id': '',
                  'previous_artifact_id': '',
                  'previous_artifact_digest': '',
              }
          else:
              values = {
                  'arming_pr_number': os.environ['INPUT_PR_NUMBER'],
                  'arming_head_sha': os.environ['INPUT_HEAD'],
                  'arming_parent_sha': os.environ['INPUT_PARENT'],
                  'segment_index': os.environ['INPUT_SEGMENT'],
                  'previous_run_id': os.environ['INPUT_PREVIOUS_RUN'],
                  'previous_artifact_id': os.environ['INPUT_PREVIOUS_ARTIFACT'],
                  'previous_artifact_digest': os.environ['INPUT_PREVIOUS_DIGEST'],
              }
              if int(values['segment_index']) <= 0:
                  raise SystemExit('workflow_dispatch is reserved for continuation segments')
              for field in ('arming_pr_number', 'previous_run_id', 'previous_artifact_id'):
                  if int(values[field]) <= 0:
                      raise SystemExit(f'{field} must be a positive integer')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              for key, value in values.items():
                  handle.write(f'{key}={value}\n')
          PY

      - name: Check out the immutable arming head
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.invocation.outputs.arming_head_sha }}
          fetch-depth: 2

      - name: Verify the arming PR and marker-only commit
        id: guard
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ARMING_PR_NUMBER: ${{ steps.invocation.outputs.arming_pr_number }}
          ARM_HEAD_SHA: ${{ steps.invocation.outputs.arming_head_sha }}
          ARM_PARENT_SHA: ${{ steps.invocation.outputs.arming_parent_sha }}
        run: |
          actual_parent="$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD)" = "$ARM_HEAD_SHA"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$actual_parent" = "$ARM_PARENT_SHA"
            python - <<'PY'
          import json
          import os
          import urllib.request

          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{os.environ['ARMING_PR_NUMBER']}"
          request = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              pr = json.load(response)
          if pr.get('state') != 'open':
              raise SystemExit('canonical arming PR is no longer open')
          if pr.get('head', {}).get('sha') != os.environ['ARM_HEAD_SHA']:
              raise SystemExit('canonical arming PR head moved')
          if pr.get('base', {}).get('sha') != os.environ['ARM_PARENT_SHA']:
              raise SystemExit('canonical arming PR base moved')
          PY
          fi

          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD)
          mapfile -t statuses < <(git diff-tree --no-commit-id --name-status -r HEAD^ HEAD)
          args=()
          status_args=()
          for path in "${changed[@]}"; do args+=(--changed-file "$path"); done
          for status in "${statuses[@]}"; do status_args+=(--changed-status "$status"); done
          python scripts/check_m092_canonical_guard.py \
            --head-sha "$ARM_HEAD_SHA" \
            --parent-sha "$actual_parent" \
            --base-sha "$ARM_PARENT_SHA" \
            --commit-message "$(git log -1 --pretty=%B)" \
            --github-output "$GITHUB_OUTPUT" \
            "${args[@]}" "${status_args[@]}"

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.armed == 'true'
        with:
          python-version: '3.11'

      - name: Install the frozen package
        if: steps.guard.outputs.armed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Refuse an already completed canonical result
        if: steps.guard.outputs.armed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          name = urllib.parse.quote('m092-first-canonical-search', safe='')
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts?name={name}&per_page=100"
          request = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          if any(not item.get('expired') for item in payload.get('artifacts', [])):
              raise SystemExit('a completed M092 canonical search artifact already exists')
          PY

      - name: Recheck every decisive M092 pre-search boundary
        if: steps.guard.outputs.armed == 'true'
        run: |
          python -m scripts.check_m092a_checkpoint
          python -m scripts.check_m092b_protocol
          python -m scripts.check_m092b_candidate_scanner
          python -m scripts.check_m092b_search_enumerator
          python -m scripts.check_m092_certificate_policy_search
          python -m scripts.check_m092_criterion_freeze --assert-pre-search

      - name: Validate canonical segment position and predecessor artifact metadata
        id: segment_meta
        if: steps.guard.outputs.armed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARM_HEAD_SHA: ${{ steps.invocation.outputs.arming_head_sha }}
          SEGMENT_INDEX: ${{ steps.invocation.outputs.segment_index }}
          PREVIOUS_RUN_ID: ${{ steps.invocation.outputs.previous_run_id }}
          PREVIOUS_ARTIFACT_ID: ${{ steps.invocation.outputs.previous_artifact_id }}
          PREVIOUS_ARTIFACT_DIGEST: ${{ steps.invocation.outputs.previous_artifact_digest }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          index = int(os.environ['SEGMENT_INDEX'])
          head = os.environ['ARM_HEAD_SHA']
          current_name = f'm092-canonical-search-segment-{head}-{index:06d}'
          previous_name = None if index == 0 else f'm092-canonical-search-segment-{head}-{index - 1:06d}'
          headers = {
              'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          name = urllib.parse.quote(current_name, safe='')
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts?name={name}&per_page=100"
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
              existing = json.load(response)
          if any(not item.get('expired') for item in existing.get('artifacts', [])):
              raise SystemExit('this canonical segment index already has an immutable artifact')

          if index == 0:
              if any(os.environ[key] for key in ('PREVIOUS_RUN_ID', 'PREVIOUS_ARTIFACT_ID', 'PREVIOUS_ARTIFACT_DIGEST')):
                  raise SystemExit('genesis segment unexpectedly names a predecessor artifact')
          else:
              run_id = int(os.environ['PREVIOUS_RUN_ID'])
              artifact_id = int(os.environ['PREVIOUS_ARTIFACT_ID'])
              url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}/artifacts?per_page=100"
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  artifacts = json.load(response).get('artifacts', [])
              matches = [item for item in artifacts if item.get('id') == artifact_id]
              if len(matches) != 1:
                  raise SystemExit('predecessor artifact id does not belong to the declared run')
              artifact = matches[0]
              if artifact.get('expired'):
                  raise SystemExit('predecessor canonical artifact has expired')
              if artifact.get('name') != previous_name:
                  raise SystemExit('predecessor canonical artifact name differs')
              api_digest = str(artifact.get('digest') or '').removeprefix('sha256:')
              supplied_digest = os.environ['PREVIOUS_ARTIFACT_DIGEST'].removeprefix('sha256:')
              if not api_digest or api_digest != supplied_digest:
                  raise SystemExit('predecessor immutable artifact digest differs')
              workflow_run = artifact.get('workflow_run') or {}
              if workflow_run.get('head_sha') not in (None, head):
                  raise SystemExit('predecessor artifact was produced from a different arming head')

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f'current_name={current_name}\n')
              handle.write(f'previous_name={previous_name or ""}\n')
          PY

      - name: Download exact predecessor segment
        if: steps.guard.outputs.armed == 'true' && steps.invocation.outputs.segment_index != '0'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.invocation.outputs.previous_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.invocation.outputs.previous_run_id }}
          path: previous-segment

      - name: Execute the next deterministic canonical segment
        id: search
        if: steps.guard.outputs.armed == 'true'
        continue-on-error: true
        env:
          ARM_HEAD_SHA: ${{ steps.invocation.outputs.arming_head_sha }}
          ARM_PARENT_SHA: ${{ steps.invocation.outputs.arming_parent_sha }}
          SEGMENT_INDEX: ${{ steps.invocation.outputs.segment_index }}
        run: |
          if [ "$SEGMENT_INDEX" = "0" ]; then
            timeout --signal=TERM --kill-after=30s 320m \
              python scripts/run_m092_criterion_search.py \
                --requirement experiments/M092/TARGET_THEOREM.json \
                --output m092-canonical-search-state.json \
                --program-limit 2000000 \
                --checkpoint-programs 1
          else
            timeout --signal=TERM --kill-after=30s 320m \
              python scripts/run_m092_criterion_search.py \
                --requirement experiments/M092/TARGET_THEOREM.json \
                --state previous-segment/m092-canonical-search-state.json \
                --canonical-segment-record previous-segment/m092-canonical-search-segment.json \
                --arming-head-sha "$ARM_HEAD_SHA" \
                --arming-parent-sha "$ARM_PARENT_SHA" \
                --previous-segment-index "$((SEGMENT_INDEX - 1))" \
                --output m092-canonical-search-state.json \
                --program-limit 2000000 \
                --checkpoint-programs 1
          fi

      - name: Package immutable segment receipt
        id: segment_record
        if: always() && steps.guard.outputs.armed == 'true' && steps.search.outcome != 'skipped'
        env:
          SEGMENT_INDEX: ${{ steps.invocation.outputs.segment_index }}
          ARM_HEAD_SHA: ${{ steps.invocation.outputs.arming_head_sha }}
          ARM_PARENT_SHA: ${{ steps.invocation.outputs.arming_parent_sha }}
          PREVIOUS_ARTIFACT_ID: ${{ steps.invocation.outputs.previous_artifact_id }}
          PREVIOUS_ARTIFACT_DIGEST: ${{ steps.invocation.outputs.previous_artifact_digest }}
          SEARCH_OUTCOME: ${{ steps.search.outcome }}
        run: |
          args=(
            --output-state m092-canonical-search-state.json
            --requirement experiments/M092/TARGET_THEOREM.json
            --arming-head-sha "$ARM_HEAD_SHA"
            --arming-parent-sha "$ARM_PARENT_SHA"
            --segment-index "$SEGMENT_INDEX"
            --search-step-outcome "$SEARCH_OUTCOME"
            --github-run-id "${{ github.run_id }}"
            --github-run-attempt "${{ github.run_attempt }}"
            --output m092-canonical-search-segment.json
          )
          if [ "$SEGMENT_INDEX" != "0" ]; then
            args+=(
              --input-state previous-segment/m092-canonical-search-state.json
              --previous-segment previous-segment/m092-canonical-search-segment.json
              --previous-artifact-id "$PREVIOUS_ARTIFACT_ID"
              --previous-artifact-digest "$PREVIOUS_ARTIFACT_DIGEST"
            )
          fi
          python scripts/package_m092_canonical_segment.py "${args[@]}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path('m092-canonical-search-segment.json').read_text())
          progressed = (
              value['generated_programs_end'] > value['generated_programs_start']
              or value['certificate_policy_attempts_end'] > value['certificate_policy_attempts_start']
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f"terminal={'true' if value['checkpoint_terminal'] else 'false'}\n")
              handle.write(f"segment_digest={value['segment_digest']}\n")
              handle.write(f"progressed={'true' if progressed else 'false'}\n")
          PY

      - name: Upload immutable canonical segment
        id: segment_upload
        if: always() && steps.segment_record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.segment_meta.outputs.current_name }}
          path: |
            m092-canonical-search-state.json
            m092-canonical-search-segment.json
          if-no-files-found: error
          retention-days: 90

      - name: Package terminal canonical search result
        id: package
        if: always() && steps.segment_upload.outcome == 'success' && steps.segment_record.outputs.terminal == 'true'
        run: |
          python scripts/package_m092_canonical_search.py \
            --state m092-canonical-search-state.json \
            --terminal-segment m092-canonical-search-segment.json \
            --marker experiments/M092/CANONICAL_SEARCH_ARMED.json \
            --target-theorem experiments/M092/TARGET_THEOREM.json \
            --head-sha "${{ steps.invocation.outputs.arming_head_sha }}" \
            --parent-sha "${{ steps.invocation.outputs.arming_parent_sha }}" \
            --output m092-first-canonical-search-result.json

      - name: Confirm terminal result remains pre-qualification
        id: separation
        if: always() && steps.package.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('m092-first-canonical-search-result.json').read_text())
          assert payload['schema'] == 'm092-canonical-criterion-search-result/2'
          assert payload['qualification_loaded'] is False
          assert payload['candidate_executed_for_selection'] is False
          assert payload['independent_reproduction_required'] is True
          assert payload['qualification_may_begin_before_reproduction'] is False
          assert payload['terminal_search_status'] in {
              'candidate_selected', 'program_budget_exhausted', 'certificate_budget_exhausted'
          }
          PY
          test ! -e experiments/M092/VALIDATION_RECEIPT.json
          test ! -e experiments/M092/SUBSTRATE_B.json
          test ! -e experiments/M092/LANGUAGE_B.json
          test ! -e experiments/M092/QUALIFICATION.json
          test ! -e experiments/M092/RESULT.json

      - name: Upload immutable completed canonical search artifact
        if: always() && steps.package.outcome == 'success' && steps.separation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: m092-first-canonical-search
          path: |
            m092-canonical-search-state.json
            m092-canonical-search-segment.json
            m092-first-canonical-search-result.json
          if-no-files-found: error
          retention-days: 90

      - name: Dispatch exact next canonical segment
        if: always() && steps.segment_upload.outcome == 'success' && steps.segment_record.outputs.terminal == 'false' && steps.segment_record.outputs.progressed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARMING_PR_NUMBER: ${{ steps.invocation.outputs.arming_pr_number }}
          ARM_HEAD_SHA: ${{ steps.invocation.outputs.arming_head_sha }}
          ARM_PARENT_SHA: ${{ steps.invocation.outputs.arming_parent_sha }}
          SEGMENT_INDEX: ${{ steps.invocation.outputs.segment_index }}
          ARTIFACT_ID: ${{ steps.segment_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.segment_upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          next_index = int(os.environ['SEGMENT_INDEX']) + 1
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/m092-canonical-search.yml/dispatches"
          payload = {
              'ref': 'main',
              'inputs': {
                  'arming_pr_number': os.environ['ARMING_PR_NUMBER'],
                  'arming_head_sha': os.environ['ARM_HEAD_SHA'],
                  'arming_parent_sha': os.environ['ARM_PARENT_SHA'],
                  'segment_index': str(next_index),
                  'previous_run_id': os.environ['GITHUB_RUN_ID'],
                  'previous_artifact_id': os.environ['ARTIFACT_ID'],
                  'previous_artifact_digest': os.environ['ARTIFACT_DIGEST'],
              },
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f'continuation dispatch returned HTTP {response.status}')
          print(f'Dispatched canonical segment {next_index}.')
          PY

      - name: Refuse an automatic retry loop with zero checkpoint progress
        if: always() && steps.segment_upload.outcome == 'success' && steps.segment_record.outputs.terminal == 'false' && steps.segment_record.outputs.progressed != 'true'
        run: |
          echo "Canonical segment made no completed-program progress; automatic continuation is fail-closed."
          exit 1

      - name: Confirm the canonical search stayed closed
        if: steps.guard.outputs.armed != 'true'
        run: echo "M092 canonical criterion search remains closed on this commit."
