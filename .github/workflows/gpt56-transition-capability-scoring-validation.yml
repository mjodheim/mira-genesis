name: GPT56 transition capability scoring validation

on:
  push:
    branches:
      - validation/gpt56-genesis-transition-capability-scoring-20260911

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Apply prospective repair
        run: python scripts/apply_gpt56_transition_capability_scoring_patch.py
      - name: Run focused architectural transition regressions
        run: >-
          python -m pytest -q
          tests/test_genesis_persistent_metamorphic_campaign.py
          tests/test_genesis_post_migration_form_continuation.py
          tests/test_genesis_generated_parent_dependency.py
          tests/test_genesis_migration.py
          tests/test_genesis_meta_policy_order_invariance.py
          tests/test_genesis_repeated_meta_descent.py
      - name: Remove one-shot validation apparatus
        run: |
          rm scripts/apply_gpt56_transition_capability_scoring_patch.py
          rm .github/workflows/gpt56-transition-capability-scoring-validation.yml
      - name: Publish clean validated tree
        run: |
          git config user.name 'Anthony Mets'
          git config user.email '110968830+mjodheim@users.noreply.github.com'
          git add -A
          git commit -m 'fix(genesis): score form transitions by discovered capability' -m 'Signed-off-by: Anthony Mets <110968830+mjodheim@users.noreply.github.com>'
          git push origin HEAD:validation/gpt56-genesis-transition-capability-scoring-20260911
