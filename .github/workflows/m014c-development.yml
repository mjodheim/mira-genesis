name: M014c development benchmark

# Banc de développement de M014c, volontairement séparé de `ci.yml`.
#
# Ce workflow ne produit aucun résultat canonique : `experiments/M014c/STATUS.md`
# interdit toute évaluation scellée tant que les portes de gel ne sont pas franchies.
# Il ne se déclenche que sur la branche de recherche et à la demande — jamais sur les
# pull requests vers `main`, dont la validation relève de `ci.yml`.

on:
  push:
    branches: [research/m014c-distribution-general-plasticity]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m014c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the package and its development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the M014c development tests
        run: pytest -q tests/test_m014c.py

      - name: Run the generated-profile development benchmark
        run: python scripts/run_m014c_development.py

      - name: Refuse any canonical claim from this workflow
        run: |
          python - <<'PYTHON'
          import json
          import pathlib
          import sys

          path = pathlib.Path("results/M014c_development.json")
          summary = json.loads(path.read_text(encoding="utf-8"))["summary"]
          if not summary.get("development_only"):
              sys.exit("the benchmark dropped its development-only marker")
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PYTHON

      - uses: actions/upload-artifact@v4
        with:
          name: m014c-development-${{ github.run_id }}
          path: results/M014c_development.json
          if-no-files-found: error
          retention-days: 30
