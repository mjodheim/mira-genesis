name: M014c development

on:
  push:
    branches: [research/m014c-distribution-general-plasticity]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONPATH: .:scripts

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Run M014c development tests
        run: pytest -q tests/test_m014c.py
