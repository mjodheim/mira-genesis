name: GPT56 architectural probe crash consistency validation

on:
  push:
    branches:
      - validation/gpt56-genesis-architectural-probe-crash-consistency-20260911

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Apply prospective repair
        run: |
          python scripts/apply_gpt56_architectural_probe_crash_consistency_patch.py
          python scripts/fix_gpt56_architectural_probe_crash_patch_anchor.py
      - name: Run focused metamorphic crash-consistency regressions
        run: >-
          python -m pytest -q
          tests/test_genesis_persistent_metamorphic_campaign.py
          tests/test_genesis_post_migration_form_continuation.py
          tests/test_genesis_generated_parent_dependency.py
          tests/test_genesis_migration.py
          tests/test_genesis_meta_policy_order_invariance.py
      - name: Remove one-shot validation apparatus
        run: |
          rm scripts/apply_gpt56_architectural_probe_crash_consistency_patch.py
          rm scripts/fix_gpt56_architectural_probe_crash_patch_anchor.py
          rm .github/workflows/gpt56-architectural-probe-crash-consistency-validation.yml
      - name: Check repository structure
        run: python scripts/check_repository_integrity.py
      - name: Publish clean validated tree
        run: |
          git config user.name 'Anthony Mets'
          git config user.email '110968830+mjodheim@users.noreply.github.com'
          git add -A
          git commit -m 'fix(genesis): make architectural probe rounds non-redrawable' -m 'Signed-off-by: Anthony Mets <110968830+mjodheim@users.noreply.github.com>'
          git push origin HEAD:validation/gpt56-genesis-architectural-probe-crash-consistency-20260911
