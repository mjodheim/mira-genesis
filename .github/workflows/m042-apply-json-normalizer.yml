name: Apply M042 JSON normalizer

on:
  pull_request:
    paths:
      - '.github/workflows/m042-apply-json-normalizer.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Encode byte records canonically before digesting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('metamorphosis/m042_engine.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from typing import Mapping\n',
              'from typing import Mapping, Sequence\n',
              1,
          )
          anchor = '''class M042EngineError(RuntimeError):
              pass


          @dataclass(frozen=True)'''.replace('          ', '')
          replacement = '''class M042EngineError(RuntimeError):
              pass


          def _json_value(value: object) -> object:
              if isinstance(value, bytes):
                  return {"encoding": "hex", "value": value.hex()}
              if isinstance(value, Mapping):
                  return {str(key): _json_value(item) for key, item in value.items()}
              if isinstance(value, Sequence) and not isinstance(value, (str, bytes, bytearray)):
                  return [_json_value(item) for item in value]
              return value


          @dataclass(frozen=True)'''.replace('          ', '')
          if anchor not in text:
              raise SystemExit('M042 normalizer anchor not found')
          text = text.replace(anchor, replacement, 1)
          old = 'json.dumps(self.mapping(), sort_keys=True, separators=(",", ":")).encode("utf-8")'
          new = 'json.dumps(_json_value(self.mapping()), sort_keys=True, separators=(",", ":")).encode("utf-8")'
          if text.count(old) != 2:
              raise SystemExit(f'expected two digest serialisations, found {text.count(old)}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit the representation-only repair
        run: |
          git config user.name "mjodheim"
          git config user.email "110968830+mjodheim@users.noreply.github.com"
          git add metamorphosis/m042_engine.py
          git commit -m "fix(m042): encode byte records before digesting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
