name: M012b sealed evaluation

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: read

env:
  PYTHONPATH: .:scripts

jobs:
  evaluate:
    if: github.head_ref == 'research/m012b-sealed-morphogenesis'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime and test dependencies
        run: python -m pip install --upgrade pip pytest numpy

      - name: Run development-only tests
        run: pytest -q tests/test_m012b.py

      - name: Audit evaluation isolation
        run: python scripts/audit_m012b_isolation.py

      - name: Run the one canonical sealed evaluation
        env:
          M012B_EVENT_ACTION: opened
        run: >-
          python scripts/run_m012b_evaluation.py
          --canonical
          --git-commit "${{ github.event.pull_request.head.sha }}"
          --github-run-id "${{ github.run_id }}"
          --github-run-attempt "${{ github.run_attempt }}"
          --event-action opened
          --output-dir results/M012b

      - name: Upload immutable evidence
        uses: actions/upload-artifact@v4
        with:
          name: m012b-sealed-evidence-${{ github.run_id }}
          path: results/M012b/
          if-no-files-found: error
          retention-days: 90
