name: V22R prospective root-capsule preflight

on:
  push:
    branches:
      - research/rsi-v22r-retained-evaluator

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Genesis
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frozen Brewstead host
        uses: actions/checkout@v4
        with:
          repository: mjodheim/mjodheim-brewstead
          ref: 720b27c8bc80de16c04953e13d5f9e8425beea8c
          path: host

      - name: Verify inherited V22 identities used by V22R
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            "experiment/rsi_v22/utility.py":"8ebae4e02b0450af997bc7f3b2ce4fcedfb2121886bb0d80ad9da522244e7d8d",
            "experiment/rsi_v22/V22_TRANSFER_PROPOSER_PROTOCOL.md":"f28109600e1090254e2b70a666cd519724014c199ecce281970cc84dba5e23ca",
            "experiment/rsi_v22/calibration-manifest.json":"948e7ad615f859a0005bf48b12e21deca7cad9ed4daf9bcc214352c47e3822a0",
            "experiment/rsi_v22/VERIFY_OUTPUT.py":"17b5587a0ba5ffb96a80547b8a618703d022891650cb472fddab2c411a9cd6f2",
            "experiment/rsi_v22/campaign.py":"4447ed003d868e8cd6f0a5d81730f2e7c7ab4527c7be2359d919db7a7f958f58",
            "experiment/rsi_v22/evaluate_proposal.py":"40bf7ef0062abb2b4c332c4330ce58e46239d50a9ee7b098cf579571802d22c9",
            "experiment/rsi_v22/build_next_bundles.py":"a97005766a3988ab0066e908905bfbb32bf385fcdd9fde74c1c2b28e596de9ba",
            "experiment/rsi_v22/adjudicate.py":"5975251d49ddc3e32bdf001dcbf8e5c04d07cddb3f0efa73125c3e51de39b07e",
            "experiment/rsi_v22/campaign_cli.py":"d81eda4fca11f2c663db305d17f7c4a6bef7cd6d87a929db8b3beb6637429f73",
            "experiment/rsi_v22/policies/g1_search_policy.py":"3354f887a93a08d9f00e9c54ccb097003f727ba77c1e1b4e9997adf676d35434",
            "experiment/rsi_v22/policies/g2_search_policy.py":"69d0d725601cd32adff27379dbb25f5c7be29946f9e9c6ac4858a0634cbd5fdf",
            "experiment/rsi_v22/defects/game-state-estate-max-fields.patch":"a101cb1b5533e41d8c0d395f28c44c382b1a1fc9acd0e64793ec5ad56a8cc358",
            "experiment/rsi_v22/defects/progression-merchant-coin-bonus.patch":"c53eb07feb70153c8ba89e3212b1539be03a12c556f8fa7eab4be66bb0e19d3a",
            "experiment/rsi_v22/defects/catalog-crop-ingredient-name.patch":"a3db807edf55a1e4525148b358f9c1aebc7b3120f1c68e7e40a2d6a47858604e",
            "experiment/rsi_v22/evaluator/GameStateEstateReservedTest.java":"c6ceb2e94313321ea81d7e58734f55aa5bedb0154b5b972715c9c02899896177",
            "experiment/rsi_v22/evaluator/ProgressionMerchantReservedTest.java":"0bd2985e793be1a7ad0cdb5f000bcd6c4fcbcee822623d5fe834aec17b170129",
            "experiment/rsi_v22/evaluator/CatalogCropIngredientReservedTest.java":"486e823877bb4ecaee01d249353b4d6f104e7ebed0768bcc6c47c42a96e181ff",
          }
          for path,want in expected.items():
              got=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if got!=want:
                  raise SystemExit(f"inherited identity mismatch {path}: {got} != {want}")
              print(f"V22R_INHERITED_HASH_PASS {path} {got}")
          builder=Path("experiment/rsi_v22r/build_root_bundles.py")
          print("V22R_ROOT_BUILDER_SHA256",hashlib.sha256(builder.read_bytes()).hexdigest())
          PY

      - name: Build every V22R capsule twice and require byte identity
        shell: bash
        run: |
          set -euo pipefail
          APP=6babe495ef00f2a5c666a5268bace3c79c5a226a
          python3 experiment/rsi_v22r/build_root_bundles.py --host "$GITHUB_WORKSPACE/host" --apparatus-commit "$APP" --out /tmp/v22r-a > /tmp/build-a.json
          python3 experiment/rsi_v22r/build_root_bundles.py --host "$GITHUB_WORKSPACE/host" --apparatus-commit "$APP" --out /tmp/v22r-b > /tmp/build-b.json
          diff -u /tmp/build-a.json /tmp/build-b.json
          for a in /tmp/v22r-a/*.zip; do
            b="/tmp/v22r-b/$(basename "$a")"
            cmp "$a" "$b"
          done
          echo "===V22R_BUILD_RECORD==="
          cat /tmp/build-a.json
          echo "===END_V22R_BUILD_RECORD==="

      - name: Prove old V22 transcripts cannot satisfy V22R slots
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin results/rsi-v22-r1-20260924:refs/remotes/origin/results/rsi-v22-r1-20260924
          mkdir -p /tmp/old-results
          copy_old() {
            local short="$1"
            git show "refs/remotes/origin/results/rsi-v22-r1-20260924:results/rsi-v22/r1-20260924/$short/proposal.patch" > "/tmp/old-results/$short-proposal.patch"
            git show "refs/remotes/origin/results/rsi-v22-r1-20260924:results/rsi-v22/r1-20260924/$short/transcript.json" > "/tmp/old-results/$short-transcript.json"
          }
          copy_old game-state
          copy_old progression
          copy_old catalog

          check_one() {
            local short="$1" task="$2"
            local bundle="/tmp/v22r-a/genesis-v22r-$task-r1-shared-s1.zip"
            local work="/tmp/check-$short"
            rm -rf "$work"; mkdir -p "$work"
            python3 - "$bundle" "$work" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z: z.extractall(sys.argv[2])
          PY
            if (cd "$work" && python3 VERIFY_OUTPUT.py "/tmp/old-results/$short-proposal.patch" "/tmp/old-results/$short-transcript.json"); then
              echo "old transcript unexpectedly passed for $task" >&2
              exit 1
            fi
            python3 - "$work/task-manifest.json" "/tmp/old-results/$short-transcript.json" "/tmp/fresh-$short-transcript.json" <<'PY'
          import hashlib,json,sys
          mp,oldp,outp=sys.argv[1:]
          m=json.load(open(mp))
          t=json.load(open(oldp))
          t["campaign_slot_id"]=m["campaign_slot_id"]
          t["parent_node_id"]=m["parent_node_id"]
          t["parent_tree_digest"]=m["parent_tree_digest"]
          t["task_manifest_sha256"]=hashlib.sha256(open(mp,"rb").read()).hexdigest()
          with open(outp,"w") as f:
              json.dump(t,f,indent=2)
              f.write("\n")
          PY
            (cd "$work" && python3 VERIFY_OUTPUT.py "/tmp/old-results/$short-proposal.patch" "/tmp/fresh-$short-transcript.json") | grep -Fx "GENESIS_RSI_V22_TRANSFER_OUTPUT=PASS"
          }

          check_one game-state brewstead-game-state-estate-max-fields
          check_one progression brewstead-progression-merchant-coin-bonus
          check_one catalog brewstead-catalog-crop-ingredient-name

      - name: Upload prospective V22R capsules
        uses: actions/upload-artifact@v4
        with:
          name: v22r-r1-prospective-capsules
          path: /tmp/v22r-a
          if-no-files-found: error
