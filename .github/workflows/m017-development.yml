name: M017 development benchmark

# Banc de développement de M017, volontairement séparé de `ci.yml`.
#
# Ce workflow ne produit aucun résultat canonique : `experiments/M017/STATUS.md`
# interdit toute évaluation scellée tant que les portes de gel ne sont pas franchies.
# Il ne se déclenche que sur la branche de recherche et à la demande — jamais sur les
# pull requests vers `main`, dont la validation relève de `ci.yml`.

on:
  push:
    branches: [research/m017-self-extending-language]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m017-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the package and its development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the M017 development tests
        run: pytest -q tests/test_m017.py

      - name: Run the language-growth development benchmark
        run: python scripts/run_m017_development.py

      - name: Refuse any canonical claim from this workflow
        run: |
          python - <<'PYTHON'
          import json
          import pathlib
          import sys

          summary = json.loads(
              pathlib.Path("results/M017_development.json").read_text(encoding="utf-8")
          )["summary"]
          if not summary.get("development_only"):
              sys.exit("the benchmark dropped its development-only marker")
          if summary.get("false_successes"):
              sys.exit("a solution was reported that is not exactly equivalent")
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PYTHON

      - uses: actions/upload-artifact@v4
        with:
          name: m017-development-${{ github.run_id }}
          path: results/M017_development.json
          if-no-files-found: error
          retention-days: 30

  dispersion:
    # Porte de gel n°2 : mesurer de combien la comparaison décisive varie d'un
    # environnement à l'autre. Coûteuse, donc sur demande seulement — mais elle doit
    # avoir tourné avant que le moindre seuil soit figé. M014b a préenregistré une
    # marge sans jamais faire cette mesure.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the package and its development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Measure the across-environment dispersion
        run: python scripts/run_m017_dispersion.py

      - uses: actions/upload-artifact@v4
        with:
          name: m017-dispersion-${{ github.run_id }}
          path: results/M017_dispersion_development.json
          if-no-files-found: error
          retention-days: 90
