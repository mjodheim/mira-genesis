name: CI

# Permanent continuous integration for the repository.
# This workflow never produces a canonical scientific result. It only guarantees that
# the working tree remains installable, importable and testable.
# Sealed evaluations use experiment-specific workflows that are moved to
# `archives/workflows/` after their one canonical run has been consumed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          # M070+ freeze guards verify exact pre-target commits and their blobs.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up the native Node.js target runtime
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Record runtime identities
        run: |
          python --version
          node --version

      - name: Install the package and its development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the complete test suite
        run: pytest -q

  integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # The citation check establishes that every commit the registers name by SHA is still
          # reachable. A shallow checkout cannot answer that, and reports so rather than passing.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install the package and its development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Every module must import cleanly
        run: python scripts/check_repository_integrity.py --imports

      - name: No orphan module may remain in the working tree
        run: python scripts/check_repository_integrity.py --orphans

      - name: Declared dependencies must match real imports
        run: python scripts/check_repository_integrity.py --dependencies

      - name: Every commit the record cites must still resolve
        run: python scripts/check_repository_integrity.py --citations

  sealed-bank-boundary:
    name: Sealed task-bank boundary
    runs-on: ubuntu-latest
    # Raised from 10 for M091, whose checker re-runs the acquisition, every arm including a
    # depth-six exhaustive search over the inherited language, and three fresh processes.
    timeout-minutes: 30
    # M086-A recorded a positive verdict partly because a scientific checker existed without
    # being decisive in CI. These steps are decisive: a sealed-bank plaintext, a decryption key,
    # an unprotected digest-bearing artifact, an unsigned reveal or a committed result each turn
    # this job red on the pull request that introduced it.
    steps:
      - uses: actions/checkout@v6
        with:
          # M092-A verifies the recorded source commit and its exact tree identity.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install the package and its development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: No sealed-bank plaintext, key or unprotected digest may be tracked
        run: python scripts/check_blind_bank_leakage.py

      - name: No blind sealed bank may be revealed and no result may exist
        run: python scripts/check_blind_bank_readiness.py --assert-not-revealed

      # The gate reporting `phase: draft` on a repository with no artifacts proves nothing about
      # what it would refuse once artifacts exist. This constructs the three violations external
      # review found -- an attestation paired with another run's payload, a ledger materialization
      # belonging to another frozen spec, and matched twins differing beyond the withheld
      # capability -- and fails if any of them is now accepted.
      - name: The sealed-run, ledger and matched-pair bindings must refuse their violations
        run: python scripts/check_blind_bank_readiness.py --self-test

      - name: M075's independent-maintainer boundary must remain fail-closed
        run: |
          python scripts/check_m075_private_readiness.py
          if python scripts/check_m075_private_readiness.py --require-ready; then
            echo "M075 reports itself ready for private payload reveal." >&2
            echo "That is a deliberate scientific act and may not pass CI unreviewed." >&2
            exit 1
          fi

      - name: The M087 result must reproduce from its own preserved arms
        run: python scripts/check_m087_result.py --require-result

      - name: The M088 result must reproduce from its own preserved artifacts
        run: python scripts/check_m088_result.py --require-result

      - name: The M089 result must reproduce from its own preserved artifacts
        run: python scripts/check_m089_result.py --require-result

      - name: The M090 result must replay from its own preserved artifacts
        run: python scripts/check_m090_result.py --require-result

      # M091 replays the science rather than reading booleans: the acquisition is re-run from the
      # frozen substrate, the refutation certificates are re-verified against the requirement, the
      # qualification is re-materialized from a recomputed salt, every arm is repeated including
      # the depth-six budget arm, and the verdict is recomputed. It reproduces a negative as
      # readily as a positive.
      - name: The M091 result must replay from its own preserved artifacts
        run: python scripts/check_m091_result.py --require-result

      # M092 is deliberately pre-result. These checks preserve the sealed M092-A source, the exact
      # pre-search protocol and the scanner's five positive controls without inventing a result.
      - name: The M092-A substrate checkpoint must remain byte-exact
        run: python -m scripts.check_m092a_checkpoint

      - name: The M092-B protocol must remain frozen before search and qualification
        run: python -m scripts.check_m092b_protocol

      - name: The M092-B candidate scanner must refuse all frozen anti-cheating fixtures
        run: python -m scripts.check_m092b_candidate_scanner

      - name: The M092-B proposal stream must resume byte-identically
        run: python -m scripts.check_m092b_search_enumerator

      # M092-C/D freeze the candidate-side global certificate construction and the criterion
      # selector before the first target search exists.  These gates are intentionally pre-search:
      # they use only the neutral countdown rehearsal and fail if result/registration artifacts
      # appear prematurely.  Once the canonical run is preserved they must be replaced by the
      # decisive M092 result checker rather than weakened or skipped.
      - name: M092 path-wise certificate policy search must remain target-neutral
        run: python -m scripts.check_m092_certificate_policy_search

      - name: The complete M092 criterion instrument must remain frozen before target search
        run: python -m scripts.check_m092_criterion_freeze --assert-pre-search

      # M093 adopted a patch into mira_core/memory.py and is an engineering rehearsal that says
      # so. M094 was frozen on 18 August 2026 and run on 19 August 2026; neither had a gate here
      # before that, so nothing in CI ran the M094 checker and the freeze was enforced only by
      # unit tests.
      #
      # --require-result is the armed form, and it is now the right one: it demands that a run
      # exists and that every one of the twelve conditions is computed and true. It replaces the
      # --strict form used while the milestone was unrun, which could only say that nothing had
      # failed yet. The checker recomputes rather than reads: it re-derives the qualification
      # draw from the recorded mechanism digest, replays the independent validator against the
      # preserved candidate, and replays the design audit's inherited-implementation sections.
      - name: The M094 result must reproduce from its own preserved artifacts
        run: python scripts/check_m094_result.py --require-result --no-write

      - name: M085's external-maintainer boundary must remain fail-closed
        run: |
          if python scripts/check_m085_readiness.py --require-ready; then
            echo "M085 reports itself ready for payload reveal." >&2
            echo "That is a deliberate scientific act and may not pass CI unreviewed." >&2
            exit 1
          fi
