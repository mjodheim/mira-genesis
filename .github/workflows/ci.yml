name: CI

# Permanent continuous integration for the repository.
# This workflow never produces a canonical scientific result. It only guarantees that
# the working tree remains installable, importable and testable.
# Sealed evaluations use experiment-specific workflows that are moved to
# `archives/workflows/` after their one canonical run has been consumed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          # M070+ freeze guards verify exact pre-target commits and their blobs.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up the native Node.js target runtime
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Record runtime identities
        run: |
          python --version
          node --version

      - name: Install the package and its development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the complete test suite
        run: pytest -q

  integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install the package and its development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Every module must import cleanly
        run: python scripts/check_repository_integrity.py --imports

      - name: No orphan module may remain in the working tree
        run: python scripts/check_repository_integrity.py --orphans

      - name: Declared dependencies must match real imports
        run: python scripts/check_repository_integrity.py --dependencies

  sealed-bank-boundary:
    name: Sealed task-bank boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # M086-A recorded a positive verdict partly because a scientific checker existed without
    # being decisive in CI. These steps are decisive: a sealed-bank plaintext, a decryption key,
    # an unprotected digest-bearing artifact, an unsigned reveal or a committed result each turn
    # this job red on the pull request that introduced it.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install the package and its development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: No sealed-bank plaintext, key or unprotected digest may be tracked
        run: python scripts/check_blind_bank_leakage.py

      - name: No blind sealed bank may be revealed and no result may exist
        run: python scripts/check_blind_bank_readiness.py --assert-not-revealed

      # The gate reporting `phase: draft` on a repository with no artifacts proves nothing about
      # what it would refuse once artifacts exist. This constructs the three violations external
      # review found -- an attestation paired with another run's payload, a ledger materialization
      # belonging to another frozen spec, and matched twins differing beyond the withheld
      # capability -- and fails if any of them is now accepted.
      - name: The sealed-run, ledger and matched-pair bindings must refuse their violations
        run: python scripts/check_blind_bank_readiness.py --self-test

      - name: M075's independent-maintainer boundary must remain fail-closed
        run: |
          python scripts/check_m075_private_readiness.py
          if python scripts/check_m075_private_readiness.py --require-ready; then
            echo "M075 reports itself ready for private payload reveal." >&2
            echo "That is a deliberate scientific act and may not pass CI unreviewed." >&2
            exit 1
          fi

      - name: The M087 result must reproduce from its own preserved arms
        run: python scripts/check_m087_result.py --require-result

      - name: M085's external-maintainer boundary must remain fail-closed
        run: |
          if python scripts/check_m085_readiness.py --require-ready; then
            echo "M085 reports itself ready for payload reveal." >&2
            echo "That is a deliberate scientific act and may not pass CI unreviewed." >&2
            exit 1
          fi
