name: GPT56 policy registry binding validation

on:
  push:
    branches:
      - validation/gpt56-genesis-policy-registry-binding-20260911

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Apply prospective repair
        run: python scripts/apply_gpt56_policy_registry_binding_patch.py
      - name: Run focused generated-policy regressions
        run: >-
          python -m pytest -q
          tests/test_genesis_policy_registry_binding.py
          tests/test_genesis_persistent_metamorphic_campaign.py
          tests/test_genesis_generated_parent_dependency.py
          tests/test_genesis_post_migration_form_continuation.py
          tests/test_genesis_repeated_meta_policy_descent.py
          tests/test_genesis_meta_policy_order_invariance.py
          tests/test_genesis_generated_policy_mutation.py
          tests/test_genesis_objective_policy_recursion.py
          tests/test_genesis_generated_search.py
          tests/test_genesis_generated_restore.py
          tests/test_genesis_controller_authority.py
      - name: Remove one-shot validation apparatus
        run: |
          rm scripts/apply_gpt56_policy_registry_binding_patch.py
          rm .github/workflows/gpt56-policy-registry-binding-validation.yml
      - name: Check repository structure
        run: |
          python scripts/check_repository_integrity.py --orphans
          python scripts/check_repository_integrity.py --dependencies
      - name: Publish clean validated tree
        run: |
          git config user.name 'Anthony Mets'
          git config user.email '110968830+mjodheim@users.noreply.github.com'
          git add -A
          git commit -s -m 'fix(genesis): bind generated candidates to policy registry identity'
          git push origin HEAD:validation/gpt56-genesis-policy-registry-binding-20260911
