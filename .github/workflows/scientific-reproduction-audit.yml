name: Scientific reproduction audit

# Audit-only replay of preserved scientific results.
# This workflow never creates a new scientific observation and never changes a recorded verdict.
# For the local-first M095-M111 line, the original checker ran while HEAD was still exactly the
# frozen source and RESULT.json existed only in the working tree. Reproduction reconstructs that
# state: checkout the freeze, then overlay the preserved first RESULT.json without moving HEAD.

on:
  pull_request:
    paths:
      - '.github/workflows/scientific-reproduction-audit.yml'
      - 'scripts/**'
      - 'metamorphosis/**'
      - 'experiments/**'
      - 'docs/audits/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserved-results:
    name: Historical replays (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [M095-M100, M101-M106, M107-M112]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.16'

      - name: Restore the frozen SQLite runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://www.sqlite.org/2026/sqlite-autoconf-3530100.tar.gz \
            --output /tmp/sqlite-autoconf-3530100.tar.gz
          tar -xzf /tmp/sqlite-autoconf-3530100.tar.gz -C /tmp
          cd /tmp/sqlite-autoconf-3530100
          ./configure --prefix="$HOME/sqlite-3.53.1" --disable-static
          make -j2
          make install
          echo "$HOME/sqlite-3.53.1/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/sqlite-3.53.1/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Verify canonical runtime and install generic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3
          import sys
          print(sys.version)
          print("sqlite", sqlite3.sqlite_version)
          assert sys.version_info[:3] == (3, 11, 16)
          assert sqlite3.sqlite_version == "3.53.1"
          PY
          python -m pip install --upgrade pip
          python -m pip install numpy
          git fetch --force --tags origin

      - name: Reconstruct original checker state and replay
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          root = Path.cwd()
          shard = os.environ["SHARD"]
          worktree_root = Path("/tmp/genesis-scientific-replays") / shard
          shutil.rmtree(worktree_root, ignore_errors=True)
          worktree_root.mkdir(parents=True)

          # Fields: milestone, freeze ref, first-result ref, checker args, expected verdict,
          # overlay RESULT.json while keeping HEAD at freeze.
          shards = {
              "M095-M100": [
                  ("M095", "951c7c271f07a5bf2c08735c30b8d49f39cf8b73", "47c69387261e624f205b4d102cc5dec40c289348", ["scripts/check_m095_result.py", "--no-write"], "negative", True),
                  ("M096", "experiment/m096-contract-safe-freeze", "experiment/m096-positive-result", ["scripts/check_m096_result.py", "--no-write"], "positive", True),
                  ("M097", "experiment/m097-operation-acquisition-freeze", "experiment/m097-positive-result", ["scripts/check_m097_result.py", "--no-write"], "positive", True),
                  ("M098", "experiment/m098-process-persistence-freeze", "experiment/m098-negative-result", ["scripts/check_m098_result.py", "--no-write"], "negative", True),
                  ("M099", "experiment/m099-stable-persistence-freeze", "experiment/m099-positive-result", ["scripts/check_m099_result.py", "--no-write"], "positive", True),
                  ("M100", "c4214d6bdaeb1326c9dcd6d336ff1d4173c96c98", "experiment/m100-positive-result", ["scripts/check_m100_result.py", "--no-write"], "positive", True),
              ],
              "M101-M106": [
                  ("M101", "experiment/m101-frozen-protocol-v4", "experiment/m101-canonical-first-result", ["scripts/check_m101_result.py", "--no-write"], "positive", True),
                  # M102 has no --no-write flag: without --write it is already read-only.
                  ("M102", "experiment/m102-frozen-protocol-v1", "experiment/m102-canonical-first-result", ["scripts/check_m102_result.py"], "positive", True),
                  ("M103", "experiment/m103-frozen-protocol-v1", "experiment/m103-canonical-first-result", ["scripts/check_m103_result.py", "--replay"], "negative", True),
                  ("M104", "experiment/m104-frozen-protocol-v1", "experiment/m104-canonical-first-result", ["scripts/check_m104_result.py", "--replay"], "positive", True),
                  ("M105", "experiment/m105-frozen-protocol-v2", "experiment/m105-canonical-first-result", ["scripts/check_m105_result.py", "--replay"], "negative", True),
                  ("M106", "experiment/m106-frozen-protocol-v1", "experiment/m106-canonical-first-result", ["scripts/check_m106_result.py", "--replay"], "positive", True),
              ],
              "M107-M112": [
                  ("M107", "experiment/m107-frozen-protocol-v1", "experiment/m107-canonical-first-result", ["scripts/check_m107_result.py", "--replay"], "positive", True),
                  ("M108", "experiment/m108-frozen-protocol-v1", "experiment/m108-canonical-first-result", ["scripts/check_m108_result.py", "--replay"], "positive", True),
                  ("M109", "experiment/m109-frozen-protocol-v1", "experiment/m109-canonical-first-result", ["scripts/check_m109_result.py", "--replay"], "positive", True),
                  ("M110", "experiment/m110-frozen-protocol-v1", "experiment/m110-canonical-first-result", ["scripts/check_m110_result.py", "--replay"], "positive", True),
                  ("M111", "experiment/m111-frozen-protocol-v1", "experiment/m111-canonical-first-result", ["scripts/check_m111_result.py", "--replay"], "positive", True),
                  # M112 is a multi-commit blind-bank/reveal chronology, not a local freeze+uncommitted
                  # result. Its preserved mixed-result checkout is the durable replay context.
                  ("M112", "experiment/m112-mixed-result", "experiment/m112-mixed-result", ["scripts/check_m112_result.py"], "mixed", False),
              ],
          }
          cases = shards[shard]

          failures: list[str] = []
          summary: list[dict[str, object]] = []
          env = os.environ.copy()

          for milestone, freeze_ref, result_ref, args, expected, overlay_result in cases:
              destination = worktree_root / milestone
              print(
                  f"::group::{milestone} freeze={freeze_ref} result={result_ref} expected={expected}",
                  flush=True,
              )
              added = subprocess.run(
                  ["git", "worktree", "add", "--detach", str(destination), freeze_ref],
                  cwd=root,
                  text=True,
                  capture_output=True,
                  check=False,
              )
              if added.returncode != 0:
                  print(added.stdout)
                  print(added.stderr, file=sys.stderr)
                  failures.append(f"{milestone}: could not materialize freeze {freeze_ref}")
                  print("::endgroup::", flush=True)
                  continue

              if overlay_result:
                  result_path = f"experiments/{milestone}/RESULT.json"
                  preserved = subprocess.run(
                      ["git", "show", f"{result_ref}:{result_path}"],
                      cwd=root,
                      capture_output=True,
                      check=False,
                  )
                  if preserved.returncode != 0:
                      print(preserved.stderr.decode(errors="replace"), file=sys.stderr)
                      failures.append(f"{milestone}: could not read preserved RESULT.json from {result_ref}")
                      print("::endgroup::", flush=True)
                      continue
                  target = destination / result_path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(preserved.stdout)
                  print(f"Overlayed preserved first result while HEAD remains at {freeze_ref}")

              # A checker report is never part of the original pre-check working state.
              report = destination / "experiments" / milestone / "CHECK_REPORT.json"
              if report.exists():
                  report.unlink()
                  print(f"Removed disposable checker-report copy: {report.relative_to(destination)}")

              head = subprocess.run(
                  ["git", "rev-parse", "HEAD"], cwd=destination, text=True, capture_output=True, check=True
              ).stdout.strip()
              print(f"HEAD={head}")

              completed = subprocess.run(
                  [sys.executable, *args],
                  cwd=destination,
                  env=env,
                  text=True,
                  capture_output=True,
                  check=False,
              )
              if completed.stdout:
                  print(completed.stdout, end="" if completed.stdout.endswith("\n") else "\n")
              if completed.stderr:
                  print(completed.stderr, file=sys.stderr, end="" if completed.stderr.endswith("\n") else "\n")

              actual = None
              try:
                  payload = json.loads(completed.stdout)
                  actual = payload.get("verdict")
              except Exception as error:
                  failures.append(f"{milestone}: checker output was not one JSON document: {error}")

              row = {
                  "milestone": milestone,
                  "freeze_ref": freeze_ref,
                  "result_ref": result_ref,
                  "expected": expected,
                  "actual": actual,
                  "returncode": completed.returncode,
              }
              summary.append(row)
              if actual != expected:
                  failures.append(f"{milestone}: expected {expected}, reproduced {actual!r}")
              print("::endgroup::", flush=True)

          print(json.dumps({"shard": shard, "historical_reproduction_summary": summary}, indent=2, sort_keys=True))
          if failures:
              print("Historical scientific reproduction mismatches:", file=sys.stderr)
              for failure in failures:
                  print(f"- {failure}", file=sys.stderr)
              raise SystemExit(1)
          PY

  boundary-status:
    name: Open-H boundaries remain fail-closed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: External/private requirements remain unavailable internally
        shell: bash
        run: |
          set -euo pipefail
          if python scripts/check_m075_private_readiness.py --require-ready; then
            echo 'M075/H21 incorrectly reports private external readiness.' >&2
            exit 1
          fi
          if python scripts/check_m085_readiness.py --require-ready; then
            echo 'M085/H31 incorrectly reports external-maintainer readiness.' >&2
            exit 1
          fi

      - name: Closed M119-M123 science is not retroactively manufactured
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          required_text = {
              "experiments/M119/OUTCOME.md": "untested",
              "experiments/M120/OUTCOME.md": "untested",
              "experiments/M122/OUTCOME.md": "untested",
              "experiments/M123/OUTCOME.md": "untested",
          }
          failures = []
          for path_text, marker in required_text.items():
              path = Path(path_text)
              if not path.is_file():
                  failures.append(f"missing closed record: {path_text}")
                  continue
              text = path.read_text(encoding="utf-8").casefold()
              if marker.casefold() not in text:
                  failures.append(f"{path_text} no longer records {marker}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("Closed instrument outcomes remain explicitly untested; no retrospective scientific verdict was introduced.")
          PY
