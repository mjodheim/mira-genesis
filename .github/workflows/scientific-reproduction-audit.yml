name: Scientific reproduction audit

# Audit-only replay of preserved scientific results.
# This workflow never creates a new scientific observation and never changes a recorded verdict.
# Historical text bytes are reconstructed only when a LF/CRLF variant matches a digest already
# preserved in the milestone's frozen/result material. M106 is intentionally classified separately:
# its scientific predicates can reproduce while its frozen stable projection remains cross-machine
# non-portable because it retained an absolute interpreter path.

on:
  pull_request:
    paths:
      - '.github/workflows/scientific-reproduction-audit.yml'
      - 'scripts/**'
      - 'metamorphosis/**'
      - 'experiments/**'
      - 'docs/audits/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserved-results:
    name: Historical replays (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [M095-M100, M101-M106, M107-M112]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.16'

      - name: Restore the frozen SQLite runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://www.sqlite.org/2026/sqlite-autoconf-3530100.tar.gz \
            --output /tmp/sqlite-autoconf-3530100.tar.gz
          tar -xzf /tmp/sqlite-autoconf-3530100.tar.gz -C /tmp
          cd /tmp/sqlite-autoconf-3530100
          ./configure --prefix="$HOME/sqlite-3.53.1" --disable-static
          make -j2
          make install
          echo "$HOME/sqlite-3.53.1/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/sqlite-3.53.1/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Verify canonical runtime and install generic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3
          import sys
          print(sys.version)
          print("sqlite", sqlite3.sqlite_version)
          assert sys.version_info[:3] == (3, 11, 16)
          assert sqlite3.sqlite_version == "3.53.1"
          PY
          python -m pip install --upgrade pip
          python -m pip install numpy
          git fetch --force --tags origin

      - name: Reconstruct original checker state and replay
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys

          root = Path.cwd()
          shard = os.environ["SHARD"]
          worktree_root = Path("/tmp/genesis-scientific-replays") / shard
          shutil.rmtree(worktree_root, ignore_errors=True)
          worktree_root.mkdir(parents=True)

          # Fields: milestone, checkout ref, result ref, checker args, expected audit class,
          # overlay RESULT while keeping HEAD at checkout ref, byte reconstruction mode.
          shards = {
              "M095-M100": [
                  ("M095", "951c7c271f07a5bf2c08735c30b8d49f39cf8b73", "47c69387261e624f205b4d102cc5dec40c289348", ["scripts/check_m095_result.py", "--no-write"], "negative", True, "recorded-bytes"),
                  ("M096", "experiment/m096-contract-safe-freeze", "experiment/m096-positive-result", ["scripts/check_m096_result.py", "--no-write"], "positive", True, "recorded-bytes"),
                  ("M097", "experiment/m097-operation-acquisition-freeze", "experiment/m097-positive-result", ["scripts/check_m097_result.py", "--no-write"], "positive", True, "recorded-bytes"),
                  ("M098", "experiment/m098-process-persistence-freeze", "experiment/m098-negative-result", ["scripts/check_m098_result.py", "--no-write"], "negative", True, "recorded-bytes"),
                  ("M099", "experiment/m099-stable-persistence-freeze", "experiment/m099-positive-result", ["scripts/check_m099_result.py", "--no-write"], "positive", True, "native"),
                  ("M100", "c4214d6bdaeb1326c9dcd6d336ff1d4173c96c98", "experiment/m100-positive-result", ["scripts/check_m100_result.py", "--no-write"], "positive", True, "native"),
              ],
              "M101-M106": [
                  ("M101", "experiment/m101-frozen-protocol-v4", "experiment/m101-canonical-first-result", ["scripts/check_m101_result.py", "--no-write"], "positive", True, "recorded-bytes"),
                  ("M102", "experiment/m102-frozen-protocol-v1", "experiment/m102-canonical-first-result", ["scripts/check_m102_result.py"], "positive", True, "recorded-bytes"),
                  ("M103", "experiment/m103-frozen-protocol-v1", "experiment/m103-canonical-first-result", ["scripts/check_m103_result.py", "--replay"], "negative", True, "native"),
                  # M104's checker intentionally binds HEAD to the RESULT-only child, not the freeze.
                  ("M104", "experiment/m104-canonical-first-result", "experiment/m104-canonical-first-result", ["scripts/check_m104_result.py", "--replay"], "positive", False, "native"),
                  ("M105", "experiment/m105-frozen-protocol-v2", "experiment/m105-canonical-first-result", ["scripts/check_m105_result.py", "--replay"], "negative", True, "native"),
                  # Historical M106 is positive. A fresh cross-machine replay is expected to retain
                  # P1-P15 while P16 alone fails because stable evidence contains an absolute path.
                  ("M106", "experiment/m106-frozen-protocol-v1", "experiment/m106-canonical-first-result", ["scripts/check_m106_result.py", "--replay"], "scientific_predicates_reproduced_nonportable_p16", True, "native"),
              ],
              "M107-M112": [
                  ("M107", "experiment/m107-frozen-protocol-v1", "experiment/m107-canonical-first-result", ["scripts/check_m107_result.py", "--replay"], "positive", True, "native"),
                  ("M108", "experiment/m108-frozen-protocol-v1", "experiment/m108-canonical-first-result", ["scripts/check_m108_result.py", "--replay"], "positive", True, "native"),
                  ("M109", "experiment/m109-frozen-protocol-v1", "experiment/m109-canonical-first-result", ["scripts/check_m109_result.py", "--replay"], "positive", True, "native"),
                  ("M110", "experiment/m110-frozen-protocol-v1", "experiment/m110-canonical-first-result", ["scripts/check_m110_result.py", "--replay"], "positive", True, "native"),
                  ("M111", "experiment/m111-frozen-protocol-v1", "experiment/m111-canonical-first-result", ["scripts/check_m111_result.py", "--replay"], "positive", True, "native"),
                  ("M112", "experiment/m112-mixed-result", "experiment/m112-mixed-result", ["scripts/check_m112_result.py"], "mixed", False, "native"),
              ],
          }
          cases = shards[shard]

          failures: list[str] = []
          summary: list[dict[str, object]] = []
          env = os.environ.copy()
          digest_pattern = re.compile(rb"(?<![0-9A-Fa-f])[0-9A-Fa-f]{64}(?![0-9A-Fa-f])")

          def git_show_bytes(ref: str, relative: str) -> bytes | None:
              completed = subprocess.run(
                  ["git", "show", f"{ref}:{relative}"],
                  cwd=root,
                  capture_output=True,
                  check=False,
              )
              return completed.stdout if completed.returncode == 0 else None

          def collect_recorded_digests(destination: Path, milestone: str, result_bytes: bytes | None) -> set[str]:
              material: list[bytes] = []
              if result_bytes is not None:
                  material.append(result_bytes)
              experiment = destination / "experiments" / milestone
              if experiment.is_dir():
                  for path in sorted(experiment.rglob("*")):
                      if path.is_file() and path.stat().st_size <= 2_000_000:
                          try:
                              material.append(path.read_bytes())
                          except OSError:
                              pass
              return {
                  match.group(0).decode("ascii").lower()
                  for blob in material
                  for match in digest_pattern.finditer(blob)
              }

          def reconstruct_recorded_text_bytes(destination: Path, recorded: set[str]) -> list[str]:
              changed: list[str] = []
              tracked = subprocess.run(
                  ["git", "ls-files", "-z"], cwd=destination, capture_output=True, check=True
              ).stdout.split(b"\0")
              for raw_path in tracked:
                  if not raw_path:
                      continue
                  relative = raw_path.decode("utf-8", errors="surrogateescape")
                  path = destination / relative
                  if not path.is_file() or path.stat().st_size > 2_000_000:
                      continue
                  data = path.read_bytes()
                  if b"\0" in data:
                      continue
                  current = hashlib.sha256(data).hexdigest()
                  if current in recorded:
                      continue
                  lf = data.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
                  crlf = lf.replace(b"\n", b"\r\n")
                  variants: dict[str, bytes] = {}
                  for label, candidate in (("lf", lf), ("crlf", crlf)):
                      digest = hashlib.sha256(candidate).hexdigest()
                      if digest in recorded and candidate != data:
                          variants[label] = candidate
                  # A single evidence-backed line-ending representation is required. If neither or
                  # both match, leave the historical bytes untouched rather than guessing.
                  if len(variants) == 1:
                      label, candidate = next(iter(variants.items()))
                      path.write_bytes(candidate)
                      changed.append(f"{relative}:{label}")
              return changed

          for milestone, checkout_ref, result_ref, args, expected_class, overlay_result, checkout_mode in cases:
              destination = worktree_root / milestone
              print(
                  f"::group::{milestone} checkout={checkout_ref} result={result_ref} expected={expected_class} mode={checkout_mode}",
                  flush=True,
              )
              added = subprocess.run(
                  ["git", "worktree", "add", "--detach", str(destination), checkout_ref],
                  cwd=root,
                  text=True,
                  capture_output=True,
                  check=False,
              )
              if added.returncode != 0:
                  print(added.stdout)
                  print(added.stderr, file=sys.stderr)
                  failures.append(f"{milestone}: could not materialize {checkout_ref}")
                  print("::endgroup::", flush=True)
                  continue

              result_path = f"experiments/{milestone}/RESULT.json"
              preserved_result = git_show_bytes(result_ref, result_path)

              if checkout_mode == "recorded-bytes":
                  recorded = collect_recorded_digests(destination, milestone, preserved_result)
                  changed = reconstruct_recorded_text_bytes(destination, recorded)
                  print(f"Recorded digest tokens available: {len(recorded)}")
                  print("Evidence-backed byte reconstructions: " + (", ".join(changed) if changed else "none"))

              if overlay_result:
                  if preserved_result is None:
                      failures.append(f"{milestone}: could not read preserved RESULT.json from {result_ref}")
                      print("::endgroup::", flush=True)
                      continue
                  target = destination / result_path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(preserved_result)
                  print(f"Overlayed preserved first result while HEAD remains at {checkout_ref}")

              report = destination / "experiments" / milestone / "CHECK_REPORT.json"
              if report.exists():
                  report.unlink()
                  print(f"Removed disposable checker-report copy: {report.relative_to(destination)}")

              head = subprocess.run(
                  ["git", "rev-parse", "HEAD"], cwd=destination, text=True, capture_output=True, check=True
              ).stdout.strip()
              print(f"HEAD={head}")

              completed = subprocess.run(
                  [sys.executable, *args],
                  cwd=destination,
                  env=env,
                  text=True,
                  capture_output=True,
                  check=False,
              )
              if completed.stdout:
                  print(completed.stdout, end="" if completed.stdout.endswith("\n") else "\n")
              if completed.stderr:
                  print(completed.stderr, file=sys.stderr, end="" if completed.stderr.endswith("\n") else "\n")

              payload: dict[str, object] | None = None
              raw_verdict = None
              audit_class = None
              try:
                  loaded = json.loads(completed.stdout)
                  if not isinstance(loaded, dict):
                      raise TypeError("checker output is not a JSON object")
                  payload = loaded
                  raw_verdict = payload.get("verdict")
                  audit_class = raw_verdict
              except Exception as error:
                  failures.append(f"{milestone}: checker output was not one JSON object: {error}")

              if milestone == "M106" and payload is not None:
                  conditions = payload.get("conditions")
                  if isinstance(conditions, dict):
                      p1_p15 = all(conditions.get(f"P{i}") is True for i in range(1, 16))
                      p16_only = conditions.get("P16") is False
                      expected_boundary = (
                          raw_verdict == "negative"
                          and p1_p15
                          and p16_only
                          and payload.get("failed_predicates") == ["P16"]
                          and payload.get("replay_performed") is True
                          and payload.get("model_calls") == 0
                          and payload.get("network_calls") == 0
                          and payload.get("remote_execution_calls") == 0
                      )
                      if expected_boundary:
                          audit_class = "scientific_predicates_reproduced_nonportable_p16"

              summary.append({
                  "milestone": milestone,
                  "checkout_ref": checkout_ref,
                  "result_ref": result_ref,
                  "checkout_mode": checkout_mode,
                  "expected_audit_class": expected_class,
                  "raw_verdict": raw_verdict,
                  "audit_class": audit_class,
                  "returncode": completed.returncode,
              })
              if audit_class != expected_class:
                  failures.append(
                      f"{milestone}: expected audit class {expected_class}, reproduced {audit_class!r} (raw verdict {raw_verdict!r})"
                  )
              print("::endgroup::", flush=True)

          print(json.dumps({"shard": shard, "historical_reproduction_summary": summary}, indent=2, sort_keys=True))
          if failures:
              print("Historical scientific reproduction mismatches:", file=sys.stderr)
              for failure in failures:
                  print(f"- {failure}", file=sys.stderr)
              raise SystemExit(1)
          PY

  boundary-status:
    name: Open-H boundaries remain fail-closed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: External/private requirements remain unavailable internally
        shell: bash
        run: |
          set -euo pipefail
          if python scripts/check_m075_private_readiness.py --require-ready; then
            echo 'M075/H21 incorrectly reports private external readiness.' >&2
            exit 1
          fi
          if python scripts/check_m085_readiness.py --require-ready; then
            echo 'M085/H31 incorrectly reports external-maintainer readiness.' >&2
            exit 1
          fi

      - name: Closed M119-M123 science is not retroactively manufactured
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          required_text = {
              "experiments/M119/OUTCOME.md": "untested",
              "experiments/M120/OUTCOME.md": "untested",
              "experiments/M122/OUTCOME.md": "untested",
              "experiments/M123/OUTCOME.md": "untested",
          }
          failures = []
          for path_text, marker in required_text.items():
              path = Path(path_text)
              if not path.is_file():
                  failures.append(f"missing closed record: {path_text}")
                  continue
              text = path.read_text(encoding="utf-8").casefold()
              if marker.casefold() not in text:
                  failures.append(f"{path_text} no longer records {marker}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("Closed instrument outcomes remain explicitly untested; no retrospective scientific verdict was introduced.")
          PY