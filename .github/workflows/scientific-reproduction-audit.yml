name: Scientific reproduction audit

# Audit-only replay of preserved scientific results.
# This workflow never creates a new scientific observation and never changes a recorded verdict.
# A negative result is successful reproduction when the frozen record is negative.

on:
  pull_request:
    paths:
      - '.github/workflows/scientific-reproduction-audit.yml'
      - 'scripts/**'
      - 'metamorphosis/**'
      - 'experiments/**'
      - 'docs/audits/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserved-results:
    name: Preserved result replays
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Replay preserved results against their recorded verdicts
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          # Each expected verdict is taken from the preserved scientific record.
          # We intentionally accept a non-zero checker exit code when the preserved
          # scientific verdict is negative or mixed. What matters here is exact replay
          # of the recorded outcome, not making every experiment look positive.
          cases = [
              ("M095", [sys.executable, "scripts/check_m095_result.py", "--no-write"], "negative"),
              ("M096", [sys.executable, "scripts/check_m096_result.py", "--no-write"], "positive"),
              ("M097", [sys.executable, "scripts/check_m097_result.py", "--no-write"], "positive"),
              ("M098", [sys.executable, "scripts/check_m098_result.py", "--no-write"], "negative"),
              ("M099", [sys.executable, "scripts/check_m099_result.py", "--no-write"], "positive"),
              ("M100", [sys.executable, "scripts/check_m100_result.py", "--no-write"], "positive"),
              ("M101", [sys.executable, "scripts/check_m101_result.py", "--no-write"], "positive"),
              ("M102", [sys.executable, "scripts/check_m102_result.py", "--no-write"], "positive"),
              ("M103", [sys.executable, "scripts/check_m103_result.py", "--replay"], "negative"),
              ("M104", [sys.executable, "scripts/check_m104_result.py", "--replay"], "positive"),
              ("M105", [sys.executable, "scripts/check_m105_result.py", "--replay"], "negative"),
              ("M106", [sys.executable, "scripts/check_m106_result.py", "--replay"], "positive"),
              ("M107", [sys.executable, "scripts/check_m107_result.py", "--replay"], "positive"),
              ("M108", [sys.executable, "scripts/check_m108_result.py", "--replay"], "positive"),
              ("M109", [sys.executable, "scripts/check_m109_result.py", "--replay"], "positive"),
              ("M110", [sys.executable, "scripts/check_m110_result.py", "--replay"], "positive"),
              ("M111", [sys.executable, "scripts/check_m111_result.py", "--replay"], "positive"),
              ("M112", [sys.executable, "scripts/check_m112_result.py"], "mixed"),
          ]

          failures = []
          summary = []
          for milestone, command, expected in cases:
              print(f"::group::{milestone} expected={expected}", flush=True)
              completed = subprocess.run(command, text=True, capture_output=True, check=False)
              if completed.stdout:
                  print(completed.stdout, end="" if completed.stdout.endswith("\n") else "\n")
              if completed.stderr:
                  print(completed.stderr, file=sys.stderr, end="" if completed.stderr.endswith("\n") else "\n")

              actual = None
              try:
                  payload = json.loads(completed.stdout)
                  actual = payload.get("verdict")
              except Exception as error:
                  failures.append(f"{milestone}: checker output was not one JSON document: {error}")

              row = {
                  "milestone": milestone,
                  "expected": expected,
                  "actual": actual,
                  "returncode": completed.returncode,
              }
              summary.append(row)
              if actual != expected:
                  failures.append(f"{milestone}: expected {expected}, reproduced {actual!r}")
              print("::endgroup::", flush=True)

          print(json.dumps({"reproduction_summary": summary}, indent=2, sort_keys=True))
          if failures:
              print("Scientific reproduction mismatches:", file=sys.stderr)
              for failure in failures:
                  print(f"- {failure}", file=sys.stderr)
              raise SystemExit(1)
          PY

  boundary-status:
    name: Open-H boundaries remain fail-closed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: External/private requirements remain unavailable internally
        shell: bash
        run: |
          set -euo pipefail
          if python scripts/check_m075_private_readiness.py --require-ready; then
            echo 'M075/H21 incorrectly reports private external readiness.' >&2
            exit 1
          fi
          if python scripts/check_m085_readiness.py --require-ready; then
            echo 'M085/H31 incorrectly reports external-maintainer readiness.' >&2
            exit 1
          fi

      - name: Closed M119-M123 science is not retroactively manufactured
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          required_text = {
              "experiments/M119/OUTCOME.md": "untested",
              "experiments/M120/OUTCOME.md": "untested",
              "experiments/M122/OUTCOME.md": "untested",
              "experiments/M123/OUTCOME.md": "untested",
          }
          failures = []
          for path_text, marker in required_text.items():
              path = Path(path_text)
              if not path.is_file():
                  failures.append(f"missing closed record: {path_text}")
                  continue
              text = path.read_text(encoding="utf-8").casefold()
              if marker.casefold() not in text:
                  failures.append(f"{path_text} no longer records {marker}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("Closed instrument outcomes remain explicitly untested; no retrospective scientific verdict was introduced.")
          PY
