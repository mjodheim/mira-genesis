name: Scientific reproduction audit

# Read-only reconstruction/replay of preserved scientific results.
# Historical files are never changed in the repository. In temporary worktrees only,
# LF/CRLF variants may be restored when — and only when — they match a digest frozen
# before the historical result. No checker condition is weakened or patched.

on:
  pull_request:
    paths:
      - '.github/workflows/scientific-reproduction-audit.yml'
      - 'scripts/**'
      - 'metamorphosis/**'
      - 'experiments/**'
      - 'docs/audits/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserved-results:
    name: Historical replays (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [M095-M100, M101-M106, M107-M112]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.16'

      - name: Restore frozen SQLite identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://www.sqlite.org/2026/sqlite-autoconf-3530100.tar.gz \
            --output /tmp/sqlite-autoconf-3530100.tar.gz
          tar -xzf /tmp/sqlite-autoconf-3530100.tar.gz -C /tmp
          cd /tmp/sqlite-autoconf-3530100
          ./configure --prefix="$HOME/sqlite-3.53.1" --disable-static
          make -j2
          make install
          echo "$HOME/sqlite-3.53.1/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/sqlite-3.53.1/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Verify runtime and install generic dependency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3, sys
          print(sys.version)
          print("sqlite", sqlite3.sqlite_version)
          assert sys.version_info[:3] == (3, 11, 16)
          assert sqlite3.sqlite_version == "3.53.1"
          PY
          python -m pip install numpy
          git fetch --force --tags origin

      - name: Reconstruct exact historical checkout and replay
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import itertools
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys

          root = Path.cwd()
          shard = os.environ["SHARD"]
          replay_root = Path("/tmp/genesis-scientific-replays") / shard
          shutil.rmtree(replay_root, ignore_errors=True)
          replay_root.mkdir(parents=True)

          # milestone, checkout-ref, preserved-result-ref, checker-args,
          # expected audit class, overlay preserved RESULT, reconstruct historical text bytes
          cases_by_shard = {
              "M095-M100": [
                  ("M095", "951c7c271f07a5bf2c08735c30b8d49f39cf8b73", "47c69387261e624f205b4d102cc5dec40c289348", ["scripts/check_m095_result.py", "--no-write"], "negative", True, True),
                  ("M096", "experiment/m096-contract-safe-freeze", "experiment/m096-positive-result", ["scripts/check_m096_result.py", "--no-write"], "positive", True, True),
                  ("M097", "experiment/m097-operation-acquisition-freeze", "experiment/m097-positive-result", ["scripts/check_m097_result.py", "--no-write"], "positive", True, True),
                  ("M098", "experiment/m098-process-persistence-freeze", "experiment/m098-negative-result", ["scripts/check_m098_result.py", "--no-write"], "negative", True, True),
                  ("M099", "experiment/m099-stable-persistence-freeze", "experiment/m099-positive-result", ["scripts/check_m099_result.py", "--no-write"], "positive", True, False),
                  ("M100", "c4214d6bdaeb1326c9dcd6d336ff1d4173c96c98", "experiment/m100-positive-result", ["scripts/check_m100_result.py", "--no-write"], "positive", True, False),
              ],
              "M101-M106": [
                  ("M101", "experiment/m101-frozen-protocol-v4", "experiment/m101-canonical-first-result", ["scripts/check_m101_result.py", "--no-write"], "positive", True, True),
                  ("M102", "experiment/m102-frozen-protocol-v1", "experiment/m102-canonical-first-result", ["scripts/check_m102_result.py"], "positive", True, True),
                  ("M103", "experiment/m103-frozen-protocol-v1", "experiment/m103-canonical-first-result", ["scripts/check_m103_result.py", "--replay"], "negative", True, False),
                  # M104 binds HEAD to the RESULT-only child rather than the freeze parent.
                  ("M104", "experiment/m104-canonical-first-result", "experiment/m104-canonical-first-result", ["scripts/check_m104_result.py", "--replay"], "positive", False, False),
                  ("M105", "experiment/m105-frozen-protocol-v2", "experiment/m105-canonical-first-result", ["scripts/check_m105_result.py", "--replay"], "negative", True, False),
                  # Historical M106 is positive; cross-machine P16 is separately classified because
                  # the frozen stable projection retained an absolute interpreter path.
                  ("M106", "experiment/m106-frozen-protocol-v1", "experiment/m106-canonical-first-result", ["scripts/check_m106_result.py", "--replay"], "scientific_predicates_reproduced_nonportable_p16", True, False),
              ],
              "M107-M112": [
                  ("M107", "experiment/m107-frozen-protocol-v1", "experiment/m107-canonical-first-result", ["scripts/check_m107_result.py", "--replay"], "positive", True, False),
                  ("M108", "experiment/m108-frozen-protocol-v1", "experiment/m108-canonical-first-result", ["scripts/check_m108_result.py", "--replay"], "positive", True, False),
                  ("M109", "experiment/m109-frozen-protocol-v1", "experiment/m109-canonical-first-result", ["scripts/check_m109_result.py", "--replay"], "positive", True, False),
                  ("M110", "experiment/m110-frozen-protocol-v1", "experiment/m110-canonical-first-result", ["scripts/check_m110_result.py", "--replay"], "positive", True, False),
                  ("M111", "experiment/m111-frozen-protocol-v1", "experiment/m111-canonical-first-result", ["scripts/check_m111_result.py", "--replay"], "positive", True, False),
                  ("M112", "experiment/m112-mixed-result", "experiment/m112-mixed-result", ["scripts/check_m112_result.py"], "mixed", False, False),
              ],
          }

          digest_token = re.compile(rb"(?<![0-9A-Fa-f])[0-9A-Fa-f]{64}(?![0-9A-Fa-f])")

          def sha(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def canonical_digest(value: object) -> str:
              raw = json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode("ascii")
              return sha(raw)

          def text_variants(data: bytes) -> list[tuple[str, bytes]]:
              if b"\0" in data:
                  return [("native", data)]
              lf = data.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
              crlf = lf.replace(b"\n", b"\r\n")
              out: list[tuple[str, bytes]] = []
              seen: set[bytes] = set()
              for label, candidate in (("native", data), ("lf", lf), ("crlf", crlf)):
                  if candidate not in seen:
                      seen.add(candidate)
                      out.append((label, candidate))
              return out

          def show_bytes(ref: str, relative: str) -> bytes | None:
              run = subprocess.run(["git", "show", f"{ref}:{relative}"], cwd=root, capture_output=True)
              return run.stdout if run.returncode == 0 else None

          def write_if_digest_matches(worktree: Path, relative: str, expected: str) -> str | None:
              path = worktree / relative
              if not path.is_file() or path.stat().st_size > 2_000_000:
                  return None
              for label, candidate in text_variants(path.read_bytes()):
                  if sha(candidate) == expected.lower():
                      if candidate != path.read_bytes():
                          path.write_bytes(candidate)
                          return f"{relative}:{label}"
                      return None
              return None

          def reconstruct_protocol_bindings(worktree: Path, milestone: str) -> list[str]:
              protocol_path = worktree / "experiments" / milestone / "PROTOCOL.json"
              if not protocol_path.is_file():
                  return []
              protocol = json.loads(protocol_path.read_text(encoding="utf-8"))
              changed: list[str] = []

              # First honor explicitly recorded per-file member digests.
              for section_name in ("mechanism", "qualification_apparatus", "checker"):
                  section = protocol.get(section_name)
                  if not isinstance(section, dict):
                      continue
                  members = section.get("member_digests")
                  if isinstance(members, dict):
                      for relative, expected in members.items():
                          if isinstance(relative, str) and isinstance(expected, str):
                              hit = write_if_digest_matches(worktree, relative, expected)
                              if hit:
                                  changed.append(hit)

              # Older protocols (notably M096/M097/M101) stored only a digest of the
              # path->raw-sha mapping. Solve the finite LF/CRLF assignment exactly.
              for section_name in ("mechanism", "qualification_apparatus", "checker"):
                  section = protocol.get(section_name)
                  if not isinstance(section, dict):
                      continue
                  files = section.get("files")
                  expected = section.get("digest")
                  if not isinstance(files, list) or not files or not isinstance(expected, str):
                      continue
                  files = [p for p in files if isinstance(p, str)]
                  options: list[list[tuple[str, bytes]]] = []
                  valid = True
                  for relative in files:
                      path = worktree / relative
                      if not path.is_file() or path.stat().st_size > 2_000_000:
                          valid = False
                          break
                      options.append(text_variants(path.read_bytes()))
                  if not valid:
                      continue
                  combinations = 1
                  for option in options:
                      combinations *= len(option)
                  if combinations > 4096:
                      print(f"{milestone}/{section_name}: skip {combinations} line-ending combinations")
                      continue
                  matches: list[tuple[tuple[str, bytes], ...]] = []
                  for combo in itertools.product(*options):
                      member_map = {relative: sha(candidate) for relative, (_label, candidate) in zip(files, combo)}
                      if canonical_digest(member_map) == expected.lower():
                          matches.append(combo)
                          if len(matches) > 1:
                              break
                  if len(matches) == 1:
                      for relative, (label, candidate) in zip(files, matches[0]):
                          path = worktree / relative
                          if path.read_bytes() != candidate:
                              path.write_bytes(candidate)
                              changed.append(f"{relative}:{label}[{section_name}]")
                      print(f"{milestone}/{section_name}: exact frozen aggregate binding recovered")
                  elif len(matches) == 0:
                      print(f"{milestone}/{section_name}: no LF/CRLF assignment matches frozen aggregate")
                  else:
                      print(f"{milestone}/{section_name}: aggregate match ambiguous; left untouched")
              return changed

          def reconstruct_recorded_digest_tokens(worktree: Path, milestone: str, result_bytes: bytes | None) -> list[str]:
              blobs: list[bytes] = [result_bytes] if result_bytes is not None else []
              experiment = worktree / "experiments" / milestone
              if experiment.is_dir():
                  for path in experiment.rglob("*"):
                      if path.is_file() and path.stat().st_size <= 2_000_000:
                          try:
                              blobs.append(path.read_bytes())
                          except OSError:
                              pass
              recorded = {
                  match.group(0).decode("ascii").lower()
                  for blob in blobs
                  for match in digest_token.finditer(blob)
              }
              changed: list[str] = []
              raw_paths = subprocess.run(["git", "ls-files", "-z"], cwd=worktree, capture_output=True, check=True).stdout.split(b"\0")
              for raw in raw_paths:
                  if not raw:
                      continue
                  relative = raw.decode("utf-8", errors="surrogateescape")
                  path = worktree / relative
                  if not path.is_file() or path.stat().st_size > 2_000_000:
                      continue
                  data = path.read_bytes()
                  if sha(data) in recorded:
                      continue
                  hits = [(label, candidate) for label, candidate in text_variants(data) if sha(candidate) in recorded]
                  if len(hits) == 1 and hits[0][1] != data:
                      label, candidate = hits[0]
                      path.write_bytes(candidate)
                      changed.append(f"{relative}:{label}[token]")
              return changed

          failures: list[str] = []
          summary: list[dict[str, object]] = []
          env = os.environ.copy()

          for milestone, checkout_ref, result_ref, args, expected_class, overlay, reconstruct in cases_by_shard[shard]:
              destination = replay_root / milestone
              print(f"::group::{milestone} expected={expected_class}", flush=True)
              add = subprocess.run(["git", "worktree", "add", "--detach", str(destination), checkout_ref], cwd=root, text=True, capture_output=True)
              if add.returncode != 0:
                  failures.append(f"{milestone}: cannot materialize {checkout_ref}")
                  print(add.stderr, file=sys.stderr)
                  print("::endgroup::")
                  continue

              result_path = f"experiments/{milestone}/RESULT.json"
              result_bytes = show_bytes(result_ref, result_path)
              if reconstruct:
                  changes = reconstruct_protocol_bindings(destination, milestone)
                  changes.extend(reconstruct_recorded_digest_tokens(destination, milestone, result_bytes))
                  print("Evidence-backed historical byte changes: " + (", ".join(changes) if changes else "none"))

              if overlay:
                  if result_bytes is None:
                      failures.append(f"{milestone}: preserved RESULT.json unavailable at {result_ref}")
                      print("::endgroup::")
                      continue
                  target = destination / result_path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(result_bytes)

              report = destination / "experiments" / milestone / "CHECK_REPORT.json"
              if report.exists():
                  report.unlink()

              completed = subprocess.run([sys.executable, *args], cwd=destination, env=env, text=True, capture_output=True)
              if completed.stdout:
                  print(completed.stdout, end="" if completed.stdout.endswith("\n") else "\n")
              if completed.stderr:
                  print(completed.stderr, file=sys.stderr, end="" if completed.stderr.endswith("\n") else "\n")

              raw_verdict = None
              audit_class = None
              payload: dict[str, object] | None = None
              try:
                  loaded = json.loads(completed.stdout)
                  if not isinstance(loaded, dict):
                      raise TypeError("checker output is not a JSON object")
                  payload = loaded
                  raw_verdict = payload.get("verdict")
                  audit_class = raw_verdict
              except Exception as error:
                  failures.append(f"{milestone}: invalid checker JSON: {error}")

              if milestone == "M106" and payload is not None:
                  conditions = payload.get("conditions")
                  if isinstance(conditions, dict):
                      p1_p15 = all(conditions.get(f"P{i}") is True for i in range(1, 16))
                      expected_nonportable = (
                          raw_verdict == "negative"
                          and p1_p15
                          and conditions.get("P16") is False
                          and payload.get("failed_predicates") == ["P16"]
                          and payload.get("replay_performed") is True
                          and payload.get("model_calls") == 0
                          and payload.get("network_calls") == 0
                          and payload.get("remote_execution_calls") == 0
                      )
                      if expected_nonportable:
                          audit_class = "scientific_predicates_reproduced_nonportable_p16"

              summary.append({
                  "milestone": milestone,
                  "expected_audit_class": expected_class,
                  "raw_verdict": raw_verdict,
                  "audit_class": audit_class,
                  "returncode": completed.returncode,
              })
              if audit_class != expected_class:
                  failures.append(f"{milestone}: expected {expected_class}, got {audit_class!r} (raw={raw_verdict!r})")
              print("::endgroup::", flush=True)

          print(json.dumps({"shard": shard, "historical_reproduction_summary": summary}, indent=2, sort_keys=True))
          if failures:
              for failure in failures:
                  print(f"- {failure}", file=sys.stderr)
              raise SystemExit(1)
          PY

  boundary-status:
    name: Open-H boundaries remain fail-closed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install project and development dependencies
        run: |
          python -m pip install -e '.[dev]'
      - name: External/private requirements remain unavailable internally
        shell: bash
        run: |
          set -euo pipefail
          if python scripts/check_m075_private_readiness.py --require-ready; then
            echo 'M075/H21 incorrectly reports private external readiness.' >&2
            exit 1
          fi
          if python scripts/check_m085_readiness.py --require-ready; then
            echo 'M085/H31 incorrectly reports external-maintainer readiness.' >&2
            exit 1
          fi
      - name: Closed M119-M123 science is not retroactively manufactured
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path_text in (
              'experiments/M119/OUTCOME.md',
              'experiments/M120/OUTCOME.md',
              'experiments/M122/OUTCOME.md',
              'experiments/M123/OUTCOME.md',
          ):
              path = Path(path_text)
              assert path.is_file(), path_text
              assert 'untested' in path.read_text(encoding='utf-8').casefold(), path_text
          print('Closed instrument outcomes remain explicitly untested.')
          PY