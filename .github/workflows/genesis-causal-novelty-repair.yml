name: Genesis causal novelty repair

on:
  push:
    branches:
      - fix/genesis-novel-causal-ablation-20260909

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/genesis-novel-causal-ablation-20260909
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply the explicit one-shot repair
        run: python scripts/_repair_genesis_causal_novelty.py

      - name: Install focused development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run focused causal, migration and M108 bridge tests
        run: >-
          python -m pytest -q
          tests/test_genesis_loop.py
          tests/test_genesis_migration.py
          tests/test_genesis_m108_bridge.py

      - name: Publish the repaired tree and remove repair apparatus
        shell: bash
        run: |
          git config user.name 'Anthony Mets'
          git config user.email '110968830+mjodheim@users.noreply.github.com'
          git rm .github/workflows/genesis-causal-novelty-repair.yml scripts/_repair_genesis_causal_novelty.py
          git add genesis/loop.py genesis/development_bodies.py tests/test_genesis_loop.py docs/audits/GENESIS_CAUSAL_NOVELTY_REPAIR_2026-09-09.md
          git diff --cached --name-only
          git commit -s -m 'fix(genesis): bind causal ablation to newly gained work'
          git push origin HEAD:fix/genesis-novel-causal-ablation-20260909
