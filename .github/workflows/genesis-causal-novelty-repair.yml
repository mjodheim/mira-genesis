name: Genesis causal novelty repair

on:
  push:
    branches:
      - fix/genesis-novel-causal-ablation-20260909

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/genesis-novel-causal-ablation-20260909
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply the novelty-specific causal-ablation repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          loop_path = Path('genesis/loop.py')
          text = loop_path.read_text(encoding='utf-8')

          old_doc = '''same budget and requires a loss of reach. `causal_chain` then counts the consecutive acquisitions
          whose dependency was actually established, so a claim about recursive improvement reads a number that
          can be small.'''
          new_doc = '''same budget and requires a loss in work the current generation newly solved over its parent.
          Losing only retained work is not evidence that the new work needed the earlier acquisition.
          `causal_chain` then counts the consecutive acquisitions whose dependency was actually established, so a
          claim about recursive improvement reads a number that can be small.'''
          if old_doc not in text:
              raise SystemExit('loop docstring anchor changed')
          text = text.replace(old_doc, new_doc, 1)

          old_call = '''        outcome = ablation_supports_causal_dependency(
              with_acquisition=candidate["outcomes"],
              without_acquisition=run["outcomes"],
              equal_budget=True,
          )'''
          new_call = '''        outcome = ablation_supports_causal_dependency(
              parent_outcomes=parent["outcomes"],
              with_acquisition=candidate["outcomes"],
              without_acquisition=run["outcomes"],
              equal_budget=True,
          )'''
          if old_call not in text:
              raise SystemExit('causal call anchor changed')
          text = text.replace(old_call, new_call, 1)

          old_fields = '''                "solved_with_acquisition": outcome["solved_with_acquisition"],
                  "solved_without_acquisition": outcome["solved_without_acquisition"],
                  "ablated_arm_differs_from_the_parent_arm": distinct,'''
          new_fields = '''                "solved_with_acquisition": outcome["solved_with_acquisition"],
                  "solved_without_acquisition": outcome["solved_without_acquisition"],
                  "newly_solved_with_acquisition": outcome["newly_solved_with_acquisition"],
                  "newly_solved_lost_without_acquisition": outcome[
                      "newly_solved_lost_without_acquisition"
                  ],
                  "retained_solved_lost_without_acquisition": outcome[
                      "retained_solved_lost_without_acquisition"
                  ],
                  "ablated_arm_differs_from_the_parent_arm": distinct,'''
          if old_fields not in text:
              raise SystemExit('causal record anchor changed')
          text = text.replace(old_fields, new_fields, 1)

          marker = '''# ---------------------------------------------------------------------------------------------
          # Causal dependency between generations
          # ---------------------------------------------------------------------------------------------
          def ablation_supports_causal_dependency('''
          position = text.find(marker)
          if position < 0:
              raise SystemExit('causal function marker changed')
          prefix = text[:position]
          replacement = '''# ---------------------------------------------------------------------------------------------
          # Causal dependency between generations
          # ---------------------------------------------------------------------------------------------
          def ablation_supports_causal_dependency(
              *,
              parent_outcomes: Sequence[Mapping[str, Any]],
              with_acquisition: Sequence[Mapping[str, Any]],
              without_acquisition: Sequence[Mapping[str, Any]],
              equal_budget: bool,
          ) -> dict[str, Any]:
              """Test whether the *new work* of a later generation needed an earlier acquisition.

              A raw loss in total solved tasks is insufficient. The earlier acquisition is retained work, so
              ablating it can trivially break tasks the parent already solved while leaving every task newly solved
              by the later generation intact. That demonstrates retention dependence, not causal dependence of the
              new improvement.

              The comparison therefore identifies the tasks the candidate newly solves relative to its parent and
              requires the equal-budget ablation to lose at least one of those tasks. Losses confined to work the
              parent already solved are recorded separately and establish nothing about the current generation's
              novelty.
              """
              if not equal_budget:
                  return {
                      "supported": False,
                      "reason": "the ablated arm did not run at the same budget, so the comparison is void",
                  }

              def by_task(rows: Sequence[Mapping[str, Any]], label: str) -> dict[str, str]:
                  mapped: dict[str, str] = {}
                  for row in rows:
                      task_id = row.get("task_id")
                      if not isinstance(task_id, str) or not task_id:
                          raise TrustRootError("%s causal outcome carries no task id" % label)
                      if task_id in mapped:
                          raise TrustRootError("%s causal outcome repeats task %r" % (label, task_id))
                      mapped[task_id] = str(row.get("outcome") or "")
                  return mapped

              parent = by_task(parent_outcomes, "parent")
              intact = by_task(with_acquisition, "candidate")
              ablated = by_task(without_acquisition, "ablated candidate")
              if set(parent) != set(intact) or set(parent) != set(ablated):
                  raise TrustRootError("causal parent, candidate and ablation did not face the same tasks")

              parent_solved = {task for task, outcome in parent.items() if outcome == "solved"}
              intact_solved = {task for task, outcome in intact.items() if outcome == "solved"}
              ablated_solved = {task for task, outcome in ablated.items() if outcome == "solved"}

              newly_solved = intact_solved - parent_solved
              lost_newly_solved = newly_solved - ablated_solved
              retained_solved = parent_solved & intact_solved
              lost_retained_solved = retained_solved - ablated_solved
              all_lost = intact_solved - ablated_solved

              supported = bool(lost_newly_solved)
              if supported:
                  reason = ""
              elif not newly_solved:
                  reason = (
                      "the later generation solved no task its parent did not already solve, so there is no "
                      "new work whose dependency could be established"
                  )
              elif all_lost:
                  reason = (
                      "removing the earlier acquisition only broke retained work; every task newly solved by "
                      "the later generation remained solved"
                  )
              else:
                  reason = (
                      "removing the earlier acquisition cost nothing on the later generation's newly solved "
                      "work, so the new improvement did not need it"
                  )

              return {
                  "supported": supported,
                  "solved_with_acquisition": len(intact_solved),
                  "solved_without_acquisition": len(ablated_solved),
                  "newly_solved_with_acquisition": sorted(newly_solved),
                  "newly_solved_lost_without_acquisition": sorted(lost_newly_solved),
                  "retained_solved_lost_without_acquisition": sorted(lost_retained_solved),
                  "reason": reason,
                  "equal_budget": True,
              }
          '''
          loop_path.write_text(prefix + replacement, encoding='utf-8')

          tests_path = Path('tests/test_genesis_loop.py')
          tests = tests_path.read_text(encoding='utf-8')
          start = tests.index('def test_removing_an_earlier_acquisition_must_cost_something():')
          end = tests.index('\n\n# -- causal dependency as a property', start)
          new_tests = '''def test_removing_an_earlier_acquisition_must_cost_new_work():
              parent = [
                  {"task_id": "t0", "outcome": "solved"},
                  {"task_id": "t1", "outcome": "solved"},
                  {"task_id": "t2", "outcome": "unsolved"},
                  {"task_id": "t3", "outcome": "unsolved"},
              ]
              candidate = [{"task_id": "t%d" % i, "outcome": "solved"} for i in range(4)]
              ablated = [
                  {"task_id": "t0", "outcome": "solved"},
                  {"task_id": "t1", "outcome": "solved"},
                  {"task_id": "t2", "outcome": "unsolved"},
                  {"task_id": "t3", "outcome": "unsolved"},
              ]
              outcome = ablation_supports_causal_dependency(
                  parent_outcomes=parent,
                  with_acquisition=candidate,
                  without_acquisition=ablated,
                  equal_budget=True,
              )
              assert outcome["supported"] is True
              assert outcome["newly_solved_with_acquisition"] == ["t2", "t3"]
              assert outcome["newly_solved_lost_without_acquisition"] == ["t2", "t3"]
              assert outcome["retained_solved_lost_without_acquisition"] == []


          def test_breaking_only_retained_work_does_not_establish_causal_dependency():
              """Regression: total solved may collapse while the generation's novelty survives intact."""
              parent = [
                  {"task_id": "old0", "outcome": "solved"},
                  {"task_id": "old1", "outcome": "solved"},
                  {"task_id": "new", "outcome": "unsolved"},
              ]
              candidate = [
                  {"task_id": "old0", "outcome": "solved"},
                  {"task_id": "old1", "outcome": "solved"},
                  {"task_id": "new", "outcome": "solved"},
              ]
              ablated = [
                  {"task_id": "old0", "outcome": "unsolved"},
                  {"task_id": "old1", "outcome": "unsolved"},
                  {"task_id": "new", "outcome": "solved"},
              ]
              outcome = ablation_supports_causal_dependency(
                  parent_outcomes=parent,
                  with_acquisition=candidate,
                  without_acquisition=ablated,
                  equal_budget=True,
              )
              assert outcome["solved_with_acquisition"] == 3
              assert outcome["solved_without_acquisition"] == 1
              assert outcome["supported"] is False
              assert outcome["newly_solved_with_acquisition"] == ["new"]
              assert outcome["newly_solved_lost_without_acquisition"] == []
              assert outcome["retained_solved_lost_without_acquisition"] == ["old0", "old1"]
              assert "only broke retained work" in outcome["reason"]


          def test_an_ablation_that_costs_nothing_refutes_the_causal_claim():
              parent = [
                  {"task_id": "t0", "outcome": "solved"},
                  {"task_id": "t1", "outcome": "solved"},
                  {"task_id": "t2", "outcome": "unsolved"},
                  {"task_id": "t3", "outcome": "unsolved"},
              ]
              rows = [{"task_id": "t%d" % i, "outcome": "solved"} for i in range(4)]
              outcome = ablation_supports_causal_dependency(
                  parent_outcomes=parent,
                  with_acquisition=rows,
                  without_acquisition=list(rows),
                  equal_budget=True,
              )
              assert outcome["supported"] is False
              assert "cost nothing" in outcome["reason"]


          def test_an_unequal_budget_voids_the_comparison_rather_than_passing_it():
              outcome = ablation_supports_causal_dependency(
                  parent_outcomes=[{"task_id": "t0", "outcome": "unsolved"}],
                  with_acquisition=[{"task_id": "t0", "outcome": "solved"}],
                  without_acquisition=[{"task_id": "t0", "outcome": "unsolved"}],
                  equal_budget=False,
              )
              assert outcome["supported"] is False
              assert "same budget" in outcome["reason"]


          def test_causal_ablation_refuses_different_task_sets():
              with pytest.raises(tr.TrustRootError, match="same tasks"):
                  ablation_supports_causal_dependency(
                      parent_outcomes=[{"task_id": "parent", "outcome": "unsolved"}],
                      with_acquisition=[{"task_id": "candidate", "outcome": "solved"}],
                      without_acquisition=[{"task_id": "candidate", "outcome": "unsolved"}],
                      equal_budget=True,
                  )
          '''
          tests_path.write_text(tests[:start] + new_tests + tests[end:], encoding='utf-8')

          audit = Path('docs/audits/GENESIS_CAUSAL_NOVELTY_REPAIR_2026-09-09.md')
          audit.write_text('''# Genesis causal novelty repair — DEVELOPMENT apparatus\n\n**Prepared:** 9 September 2026  \n**Status:** runtime metrology repair; no scientific observation; no gate movement.\n\n## Defect\n\nThe runtime called a later acquisition causally dependent on an earlier one whenever removing the\nearlier acquisition reduced the **total** number of solved tasks. Because retention is required, that\ncriterion could be satisfied merely by breaking work the parent already solved while leaving every\ntask newly solved by the current generation intact.\n\nThat is retention dependence, not evidence that the new improvement needed the earlier acquisition.\n\n## Repair\n\nFor every accepted candidate the causal comparison now receives the parent outcomes as a third arm.\nIt identifies `candidate_solved - parent_solved` and establishes dependency only when the runtime-\nderived, equal-budget ablation loses at least one member of that newly solved set. Losses confined to\nretained parent work are recorded separately and do not establish a causal link.\n\nAll three arms must carry exactly the same task identifiers or the measurement fails closed.\n\n## Regression\n\nA dedicated counterexample has candidate total solved fall from 3 to 1 after ablation while its only\nnewly solved task remains solved. The old scalar criterion reports dependency; the repaired criterion\nreports none and records the two lost tasks as retained work.\n\nThe M108 bridge is re-run under the stronger rule. Its causal link is expected to survive only if the\nM108 tasks newly solved over the M107 parent are themselves lost when M107 is removed.\n\n## Boundary\n\nNo M107–M125 frozen source, protocol, result, sealed bank, reveal state or scientific decision is\nmodified. This changes only the integrated Genesis DEVELOPMENT measurement.\n''', encoding='utf-8')
          PY

      - name: Install focused development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run focused causal and M108 bridge tests
        run: |
          python -m pytest -q tests/test_genesis_loop.py tests/test_genesis_m108_bridge.py

      - name: Publish the repaired tree and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name 'Anthony Mets'
          git config user.email '110968830+mjodheim@users.noreply.github.com'
          git rm .github/workflows/genesis-causal-novelty-repair.yml
          git add genesis/loop.py tests/test_genesis_loop.py docs/audits/GENESIS_CAUSAL_NOVELTY_REPAIR_2026-09-09.md
          git diff --cached --name-only
          git commit -s -m 'fix(genesis): bind causal ablation to newly gained work'
          git push origin HEAD:fix/genesis-novel-causal-ablation-20260909
