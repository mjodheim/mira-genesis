name: M041 isolated completion development

on:
  pull_request:
    paths:
      - 'experiments/M041/**'
      - 'metamorphosis/m041_*.py'
      - 'tests/test_m041_*.py'
      - '.github/workflows/m041-development.yml'

permissions:
  contents: read

concurrency:
  group: m041-development-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  passive-dfa-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run permanent M041 workspace tests
        run: pytest -q tests/test_m041_isolated_validation.py
      - name: Verify repository integrity
        run: python scripts/check_repository_integrity.py
