name: M041 isolated completion development

on:
  pull_request:
    paths:
      - 'experiments/M041/**'
      - 'metamorphosis/m040_engine.py'
      - 'metamorphosis/m041_*.py'
      - 'tests/test_m041_*.py'
      - '.github/workflows/m041-development.yml'

permissions:
  contents: read

concurrency:
  group: m041-development-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  passive-dfa-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run permanent M041 focused tests
        run: >-
          pytest -q
          tests/test_m041_isolated_validation.py
          tests/test_m041_pre_adoption_hook.py
      - name: Verify repository integrity
        run: python scripts/check_repository_integrity.py

  integrated-development-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Reproduce the unchanged M040 development path
        run: |
          python experiments/M040/run_development.py \
            --output m040-compatibility-result.json
      - name: Run the consumed M041 integration lineage
        run: |
          python experiments/M041/run_development.py \
            --output m041-development-result.json
      - name: Verify the development gate surface
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('m041-development-result.json').read_text())
          assert payload['schema'] == 'm041-development-result/1'
          assert payload['status'] == 'consumed-development-integration-result'
          assert payload['isolated_validation_count'] == 2
          assert payload['isolated_replay_byte_identical'] is True
          assert payload['gates_one_to_nine_supported'] is True
          assert payload['eligible_for_freeze'] is True
          assert payload['gate_verdicts']['gate_4_isolated_validation'] is True
          assert payload['gate_verdicts']['gate_10_measurement_integrity'] is False
          assert payload['no_sealed_block_opened'] is True
          assert payload['no_canonical_claim'] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m041-development-${{ github.event.pull_request.head.sha }}
          path: |
            m040-compatibility-result.json
            m041-development-result.json
          if-no-files-found: error
          retention-days: 30
