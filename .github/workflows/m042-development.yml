name: M042 preserve canonical first result

on:
  pull_request:
    paths:
      - 'experiments/M042/**'
      - 'metamorphosis/m042_*.py'
      - 'scripts/run_m042_constructive_bank.py'
      - 'scripts/preserve_m042_canonical.py'
      - 'tests/test_m042_*.py'
      - '.github/workflows/m042-development.yml'

permissions:
  contents: write

concurrency:
  group: m042-first-result-preservation
  cancel-in-progress: false

jobs:
  preserve:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Download unique first-result artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/8912305339/zip > /tmp/m042.zip
          rm -rf /tmp/m042-first-result
          mkdir -p /tmp/m042-first-result
          unzip -q /tmp/m042.zip -d /tmp/m042-first-result
      - name: Preserve and audit without reexecution
        run: python scripts/preserve_m042_canonical.py
      - name: Commit preservation records once
        run: |
          git config user.name 'mjodheim'
          git config user.email '110968830+mjodheim@users.noreply.github.com'
          git add experiments/M042/STATUS.md results/M042_CANONICAL_RESULT.md results/artifacts/M042_CANONICAL_*.json
          if git diff --cached --quiet; then
            echo 'Canonical records already preserved.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'M042: preserve positive canonical first result'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
