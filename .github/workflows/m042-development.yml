name: M042 constructive completion development

on:
  pull_request:
    paths:
      - 'experiments/M042/**'
      - 'metamorphosis/m042_*.py'
      - 'scripts/run_m042_constructive_bank.py'
      - 'tests/test_m042_*.py'
      - '.github/workflows/m042-development.yml'

permissions:
  contents: read

concurrency:
  group: m042-development-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  constructive-bank:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run permanent M042 focused tests
        run: pytest -q tests/test_m042_constructive_bank.py
      - name: Verify repository integrity
        run: python scripts/check_repository_integrity.py
      - name: Build and replay the whole constructive bank
        run: |
          python scripts/run_m042_constructive_bank.py \
            --selection-index 0 \
            --output m042-development-result.json
      - name: Verify the consumed development result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('m042-development-result.json').read_text())
          assert payload['schema'] == 'm042-development-result/1'
          assert payload['status'] == 'consumed-constructive-bank-development-result'
          assert payload['bank_size'] >= payload['minimum_bank_size'] == 4
          assert payload['bank_replay_identical'] is True
          assert payload['all_ten_development_mechanisms_supported'] is True
          assert payload['eligible_for_freeze'] is True
          assert payload['gate_verdicts']['gate_10_measurement_integrity'] is False
          assert payload['m041_failed_seed_not_reused'] is True
          assert payload['no_sealed_block_opened'] is True
          assert payload['no_canonical_claim'] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m042-development-${{ github.event.pull_request.head.sha }}
          path: m042-development-result.json
          if-no-files-found: error
          retention-days: 30
