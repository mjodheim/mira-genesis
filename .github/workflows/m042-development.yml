name: M042 constructive completion development

on:
  pull_request:
    paths:
      - '.github/workflows/m042-development.yml'

permissions:
  contents: read

concurrency:
  group: m042-workflow-cleanup-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  export-historical-workflow-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Convert completed experiments to manual dispatch
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = {
              'M021 development comparison',
              'M022 adaptation-stress controls',
              'M026 decidable metaproductivity',
              'M027 seeded clade guidance',
              'M028 adaptive evaluation weighting',
              'M029 component transfer probe',
              'M030 untouched-seed confirmation',
              'M031 structural transport',
              'M032 trans-substrate lifecycle',
              'M033 combined controls',
              'M033 embodied controls',
              'M033 post-migration controls',
          }

          changed = set()
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              text = path.read_text(encoding='utf-8')
              first = next((line for line in text.splitlines() if line.startswith('name: ')), None)
              if first is None:
                  continue
              name = first.removeprefix('name: ').strip()
              if name not in targets:
                  continue

              lines = text.splitlines(keepends=True)
              start = next(
                  index for index, line in enumerate(lines)
                  if line.rstrip('\r\n') == 'on:'
              )
              end = start + 1
              while end < len(lines):
                  raw = lines[end]
                  stripped = raw.strip()
                  if not stripped or raw.startswith((' ', '\t')) or stripped.startswith('#'):
                      end += 1
                      continue
                  break

              replacement = ['on:\n', '  workflow_dispatch:\n', '\n']
              path.write_text(
                  ''.join(lines[:start] + replacement + lines[end:]),
                  encoding='utf-8',
              )
              changed.add(name)

          if changed != targets:
              raise SystemExit(
                  f'expected={sorted(targets)} changed={sorted(changed)}'
              )
          print(f'Converted {len(changed)} historical workflows to manual dispatch.')
          PY

      - name: Package the exact workflow replacements
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only -- .github/workflows)
          test "${#changed[@]}" -eq 12
          printf '%s\n' "${changed[@]}" > workflow-cleanup-files.txt
          tar -czf workflow-cleanup.tar.gz "${changed[@]}" workflow-cleanup-files.txt

      - uses: actions/upload-artifact@v4
        with:
          name: historical-workflow-cleanup-${{ github.event.pull_request.head.sha }}
          path: workflow-cleanup.tar.gz
          if-no-files-found: error
          retention-days: 7
