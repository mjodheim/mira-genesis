name: M014b development preflight

on:
  push:
    branches: [research/m014b-sealed-portable-plasticity]

permissions:
  contents: read

env:
  PYTHONPATH: .:scripts

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Run M014b development tests
        run: pytest -q tests/test_m014b.py
