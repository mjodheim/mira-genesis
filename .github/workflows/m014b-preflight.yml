name: M014b development preflight

on:
  push:
    branches: [research/m014b-sealed-portable-plasticity]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONPATH: .:scripts

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Run M014b development tests
        run: pytest -q tests/test_m014b.py
      - name: Run full non-canonical development benchmark
        run: python scripts/run_m014b_development.py
      - name: Upload development-only benchmark
        uses: actions/upload-artifact@v4
        with:
          name: m014b-development-${{ github.run_id }}
          path: results/M014b_development.json
          if-no-files-found: error
          retention-days: 30
