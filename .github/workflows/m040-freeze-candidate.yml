name: M040 freeze candidate

on:
  pull_request:
    paths:
      - 'experiments/M040/PROTOCOL.md'
      - 'experiments/M040/run_canonical.py'
      - 'metamorphosis/m040_sealed.py'
      - 'scripts/check_m040_canonical_guard.py'
      - 'tests/test_m040_sealed.py'
      - '.github/workflows/m040-freeze-candidate.yml'
      - '.github/workflows/m040-canonical.yml'

permissions:
  contents: read

concurrency:
  group: m040-freeze-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  frozen-candidate:
    name: Validate frozen M040 candidate without opening the block
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Confirm no canonical marker exists
        run: test ! -e experiments/M040/CANONICAL_ARMED.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the frozen package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run permanent sealing and guard tests
        run: pytest -q tests/test_m040_sealed.py

      - name: Compile the frozen canonical surface
        run: |
          python -m py_compile \
            experiments/M040/run_canonical.py \
            metamorphosis/m040_sealed.py \
            scripts/check_m040_canonical_guard.py

      - name: Record identities without deriving the sealed seed
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          protocol = Path('experiments/M040/PROTOCOL.md').read_bytes()
          payload = {
              'schema': 'm040-freeze-candidate/1',
              'head_sha': os.environ['HEAD_SHA'],
              'protocol_path': 'experiments/M040/PROTOCOL.md',
              'protocol_sha256': hashlib.sha256(protocol).hexdigest(),
              'protocol_bytes': len(protocol),
              'canonical_marker_absent': True,
              'sealed_seed_not_derived': True,
              'development_seeds_consumed': list(range(400040, 400048)),
              'task_family': 'lineage_anchor',
              'post_migration_depth': 4,
              'equal_node_budget': 4096,
              'task_generation_bound': 2048,
          }
          Path('m040-freeze-candidate.json').write_text(
              json.dumps(payload, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload the frozen candidate identity
        uses: actions/upload-artifact@v4
        with:
          name: m040-freeze-candidate-${{ github.event.pull_request.head.sha }}
          path: m040-freeze-candidate.json
          if-no-files-found: error
          retention-days: 30
