name: M040 post-migration development

on:
  pull_request:
    paths:
      - 'experiments/M040/**'
      - 'metamorphosis/m040_*.py'
      - 'tests/test_m040_*.py'
      - '.github/workflows/m040-development.yml'

permissions:
  contents: read

concurrency:
  group: m040-development-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run permanent M040 tests
        run: pytest -q tests/test_m040_post_migration.py
      - name: Produce consumed development artefact
        run: |
          python experiments/M040/run_development.py \
            --output results/artifacts/M040_DEVELOPMENT_RESULT.json
      - uses: actions/upload-artifact@v4
        with:
          name: m040-development-${{ github.event.pull_request.head.sha }}
          path: results/artifacts/M040_DEVELOPMENT_RESULT.json
          if-no-files-found: error
          retention-days: 30
