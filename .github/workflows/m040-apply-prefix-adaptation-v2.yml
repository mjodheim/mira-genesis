name: Apply M040 prefix adaptation v2

on:
  pull_request:
    paths:
      - '.github/workflows/m040-apply-prefix-adaptation-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Reapply prefix adaptation and complete audit imports
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/m040-apply-prefix-adaptation.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'm040-prefix-adaptation-v1', 'exec'))

          audit_path = Path('metamorphosis/m040_search_audit.py')
          audit = audit_path.read_text()
          audit = audit.replace(
              'from .m039_lineage import LineageTool, ORIGIN_LINEAGE_CONSTRUCTED',
              'from .m039_lineage import (\n'
              '    LineageTool,\n'
              '    ORIGIN_LINEAGE_CONSTRUCTED,\n'
              '    ORIGIN_PROTOCOL_SUPPLIED,\n'
              ')',
              1,
          )
          audit_path.write_text(audit)
          PY
      - name: Compile amendment before measurement
        run: |
          python -m py_compile \
            metamorphosis/m040_engine.py \
            metamorphosis/m040_search_audit.py \
            tests/test_m040_post_migration.py \
            tests/test_m040_consumed_failures.py
      - name: Evaluate seed 400044 with exhaustive replay
        run: |
          python -m pip install -e ".[dev]"
          pytest -q \
            tests/test_m040_duplicate_dependencies.py \
            tests/test_m040_post_migration.py \
            tests/test_m040_consumed_failures.py
      - name: Commit amendment implementation
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          mkdir -p archives/workflows
          cp .github/workflows/m040-apply-prefix-adaptation.yml archives/workflows/m040-apply-prefix-adaptation.yml
          cp .github/workflows/m040-apply-prefix-adaptation-v2.yml archives/workflows/m040-apply-prefix-adaptation-v2.yml
          git rm .github/workflows/m040-apply-prefix-adaptation.yml
          git rm .github/workflows/m040-apply-prefix-adaptation-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            metamorphosis/m040_engine.py \
            metamorphosis/m040_search_audit.py \
            tests/test_m040_post_migration.py \
            tests/test_m040_consumed_failures.py \
            archives/workflows/m040-apply-prefix-adaptation.yml \
            archives/workflows/m040-apply-prefix-adaptation-v2.yml
          git commit -m 'feat(m040): adapt transported continuation prefixes after migration'
          git push origin "HEAD:${BRANCH}"
