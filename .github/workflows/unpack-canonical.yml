name: Expand canonical repository bundle

on:
  push:
    paths:
      - bundle/manifest.json

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Expand verified bundle
        run: python tools/unpack_bundle.py
      - name: Commit expanded repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: expand canonical Mira Genesis repository"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
