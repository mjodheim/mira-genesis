name: Genesis contiguous causal-chain repair

on:
  push:
    branches:
      - fix/genesis-contiguous-causal-chain-20260909

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/genesis-contiguous-causal-chain-20260909
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply explicit one-shot repair
        run: python scripts/_repair_genesis_contiguous_chain.py

      - name: Install focused development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run focused causal-chain and M108 tests
        run: >-
          python -m pytest -q
          tests/test_genesis_loop.py
          tests/test_genesis_m108_bridge.py

      - name: Publish repaired tree and remove repair apparatus
        shell: bash
        run: |
          git config user.name 'Anthony Mets'
          git config user.email '110968830+mjodheim@users.noreply.github.com'
          git rm .github/workflows/genesis-contiguous-chain-repair.yml scripts/_repair_genesis_contiguous_chain.py
          git add genesis/loop.py tests/test_genesis_loop.py docs/audits/GENESIS_CONTIGUOUS_CAUSAL_CHAIN_2026-09-09.md
          git commit -s -m 'fix(genesis): require contiguous causal-chain links'
          git push origin HEAD:fix/genesis-contiguous-causal-chain-20260909
