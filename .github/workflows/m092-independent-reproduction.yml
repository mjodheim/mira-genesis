name: M092 first independent canonical reproduction

# Reproduce the first canonical criterion search from the frozen criterion genesis before any
# qualification may begin. The canonical result content is deliberately unavailable while the
# reproduction trajectory is running; it is downloaded only after a terminal reproduced state has
# already been preserved. A mismatch is preserved and fails closed rather than authorizing a reroll.
on:
  workflow_dispatch:
    inputs:
      arming_pr_number:
        description: Exact still-open marker-only arming PR number
        required: true
        type: string
      arming_head_sha:
        description: Immutable marker-only arming head
        required: true
        type: string
      arming_parent_sha:
        description: Frozen parent of the arming commit
        required: true
        type: string
      segment_index:
        description: Exact next zero-based reproduction segment index
        required: true
        type: string
      source_canonical_run_id:
        description: Run containing the completed first canonical search artifact
        required: true
        type: string
      source_canonical_artifact_id:
        description: Immutable completed canonical search artifact id
        required: true
        type: string
      source_canonical_artifact_digest:
        description: SHA-256 returned for the completed canonical search artifact
        required: true
        type: string
      previous_run_id:
        description: Run containing the predecessor reproduction segment artifact
        required: false
        default: ''
        type: string
      previous_artifact_id:
        description: Immutable predecessor reproduction artifact id
        required: false
        default: ''
        type: string
      previous_artifact_digest:
        description: SHA-256 returned for the predecessor reproduction artifact
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: m092-first-independent-canonical-reproduction
  cancel-in-progress: false

jobs:
  guarded-reproduction-segment:
    name: Guarded M092 independent reproduction segment
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Resolve immutable reproduction invocation
        id: invocation
        env:
          ARMING_PR_NUMBER: ${{ inputs.arming_pr_number }}
          ARM_HEAD_SHA: ${{ inputs.arming_head_sha }}
          ARM_PARENT_SHA: ${{ inputs.arming_parent_sha }}
          SEGMENT_INDEX: ${{ inputs.segment_index }}
          SOURCE_RUN_ID: ${{ inputs.source_canonical_run_id }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_canonical_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ inputs.source_canonical_artifact_digest }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
          PREVIOUS_ARTIFACT_ID: ${{ inputs.previous_artifact_id }}
          PREVIOUS_ARTIFACT_DIGEST: ${{ inputs.previous_artifact_digest }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          values = {
              'arming_pr_number': os.environ['ARMING_PR_NUMBER'],
              'arming_head_sha': os.environ['ARM_HEAD_SHA'],
              'arming_parent_sha': os.environ['ARM_PARENT_SHA'],
              'segment_index': os.environ['SEGMENT_INDEX'],
              'source_canonical_run_id': os.environ['SOURCE_RUN_ID'],
              'source_canonical_artifact_id': os.environ['SOURCE_ARTIFACT_ID'],
              'source_canonical_artifact_digest': os.environ['SOURCE_ARTIFACT_DIGEST'],
              'previous_run_id': os.environ['PREVIOUS_RUN_ID'],
              'previous_artifact_id': os.environ['PREVIOUS_ARTIFACT_ID'],
              'previous_artifact_digest': os.environ['PREVIOUS_ARTIFACT_DIGEST'],
          }
          for field in ('arming_pr_number', 'source_canonical_run_id', 'source_canonical_artifact_id'):
              if int(values[field]) <= 0:
                  raise SystemExit(f'{field} must be a positive integer')
          index = int(values['segment_index'])
          if index < 0:
              raise SystemExit('segment_index must be non-negative')
          if index == 0:
              if any(values[field] for field in (
                  'previous_run_id', 'previous_artifact_id', 'previous_artifact_digest',
              )):
                  raise SystemExit('reproduction genesis unexpectedly names a predecessor')
          else:
              for field in ('previous_run_id', 'previous_artifact_id'):
                  if int(values[field]) <= 0:
                      raise SystemExit(f'{field} must be a positive integer')
              if not values['previous_artifact_digest']:
                  raise SystemExit('continuation requires predecessor artifact digest')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              for key, value in values.items():
                  handle.write(f'{key}={value}\n')
          PY

      - name: Check out the immutable arming head
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.invocation.outputs.arming_head_sha }}
          fetch-depth: 2

      - name: Verify frozen arming PR and resolve immutable workflow ref
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARMING_PR_NUMBER: ${{ steps.invocation.outputs.arming_pr_number }}
          ARM_HEAD_SHA: ${{ steps.invocation.outputs.arming_head_sha }}
          ARM_PARENT_SHA: ${{ steps.invocation.outputs.arming_parent_sha }}
        run: |
          actual_parent="$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD)" = "$ARM_HEAD_SHA"
          test "$actual_parent" = "$ARM_PARENT_SHA"
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{os.environ['ARMING_PR_NUMBER']}"
          request = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              pr = json.load(response)
          if pr.get('state') != 'open':
              raise SystemExit('canonical arming PR is no longer open')
          if pr.get('head', {}).get('sha') != os.environ['ARM_HEAD_SHA']:
              raise SystemExit('canonical arming PR head moved')
          if pr.get('base', {}).get('sha') != os.environ['ARM_PARENT_SHA']:
              raise SystemExit('canonical arming PR base moved')
          branch_ref = pr.get('head', {}).get('ref')
          if not isinstance(branch_ref, str) or not branch_ref or '\n' in branch_ref:
              raise SystemExit('canonical arming PR branch ref is malformed')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f'arming_branch_ref={branch_ref}\n')
          PY

          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD)
          mapfile -t statuses < <(git diff-tree --no-commit-id --name-status -r HEAD^ HEAD)
          args=()
          status_args=()
          for path in "${changed[@]}"; do args+=(--changed-file "$path"); done
          for status in "${statuses[@]}"; do status_args+=(--changed-status "$status"); done
          python scripts/check_m092_canonical_guard.py \
            --head-sha "$ARM_HEAD_SHA" \
            --parent-sha "$actual_parent" \
            --base-sha "$ARM_PARENT_SHA" \
            --commit-message "$(git log -1 --pretty=%B)" \
            "${args[@]}" "${status_args[@]}"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install the frozen package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Refuse an already completed independent reproduction
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          name = urllib.parse.quote('m092-first-independent-reproduction', safe='')
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts?name={name}&per_page=100"
          request = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          if any(not item.get('expired') for item in payload.get('artifacts', [])):
              raise SystemExit('a completed M092 independent reproduction already exists')
          PY

      - name: Recheck decisive M092 boundaries before reproduction
        run: |
          python -m scripts.check_m092a_checkpoint
          python -m scripts.check_m092b_protocol
          python -m scripts.check_m092b_candidate_scanner
          python -m scripts.check_m092b_search_enumerator
          python -m scripts.check_m092_certificate_policy_search

      - name: Authenticate completed canonical source artifact without downloading content
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARM_HEAD_SHA: ${{ steps.invocation.outputs.arming_head_sha }}
          SOURCE_RUN_ID: ${{ steps.invocation.outputs.source_canonical_run_id }}
          SOURCE_ARTIFACT_ID: ${{ steps.invocation.outputs.source_canonical_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.invocation.outputs.source_canonical_artifact_digest }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          run_id = int(os.environ['SOURCE_RUN_ID'])
          artifact_id = int(os.environ['SOURCE_ARTIFACT_ID'])
          run_url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"
          with urllib.request.urlopen(urllib.request.Request(run_url, headers=headers), timeout=30) as response:
              run = json.load(response)
          if run.get('head_sha') != os.environ['ARM_HEAD_SHA']:
              raise SystemExit('canonical source run used a different arming head')
          if run.get('path') != '.github/workflows/m092-canonical-search.yml':
              raise SystemExit('canonical source run came from a different workflow')
          artifacts_url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}/artifacts?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(artifacts_url, headers=headers), timeout=30) as response:
              artifacts = json.load(response).get('artifacts', [])
          matches = [item for item in artifacts if item.get('id') == artifact_id]
          if len(matches) != 1:
              raise SystemExit('canonical source artifact id does not belong to the declared run')
          artifact = matches[0]
          if artifact.get('expired'):
              raise SystemExit('canonical source artifact has expired')
          if artifact.get('name') != 'm092-first-canonical-search':
              raise SystemExit('canonical source artifact name differs')
          api_digest = str(artifact.get('digest') or '').removeprefix('sha256:')
          supplied = os.environ['SOURCE_ARTIFACT_DIGEST'].removeprefix('sha256:')
          if not api_digest or api_digest != supplied:
              raise SystemExit('canonical source artifact digest differs')
          workflow_run = artifact.get('workflow_run') or {}
          if workflow_run.get('head_sha') not in (None, os.environ['ARM_HEAD_SHA']):
              raise SystemExit('canonical source artifact was produced from another arming head')
          PY

      - name: Validate reproduction segment position and predecessor artifact
        id: segment_meta
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARM_HEAD_SHA: ${{ steps.invocation.outputs.arming_head_sha }}
          SEGMENT_INDEX: ${{ steps.invocation.outputs.segment_index }}
          PREVIOUS_RUN_ID: ${{ steps.invocation.outputs.previous_run_id }}
          PREVIOUS_ARTIFACT_ID: ${{ steps.invocation.outputs.previous_artifact_id }}
          PREVIOUS_ARTIFACT_DIGEST: ${{ steps.invocation.outputs.previous_artifact_digest }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          index = int(os.environ['SEGMENT_INDEX'])
          head = os.environ['ARM_HEAD_SHA']
          current_name = f'm092-independent-reproduction-segment-{head}-{index:06d}'
          previous_name = None if index == 0 else f'm092-independent-reproduction-segment-{head}-{index - 1:06d}'
          headers = {
              'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          name = urllib.parse.quote(current_name, safe='')
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts?name={name}&per_page=100"
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
              existing = json.load(response)
          if any(not item.get('expired') for item in existing.get('artifacts', [])):
              raise SystemExit('this reproduction segment index already has an immutable artifact')

          if index == 0:
              if any(os.environ[key] for key in ('PREVIOUS_RUN_ID', 'PREVIOUS_ARTIFACT_ID', 'PREVIOUS_ARTIFACT_DIGEST')):
                  raise SystemExit('reproduction genesis unexpectedly names a predecessor artifact')
          else:
              run_id = int(os.environ['PREVIOUS_RUN_ID'])
              artifact_id = int(os.environ['PREVIOUS_ARTIFACT_ID'])
              run_url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"
              with urllib.request.urlopen(urllib.request.Request(run_url, headers=headers), timeout=30) as response:
                  run = json.load(response)
              if run.get('head_sha') != head or run.get('path') != '.github/workflows/m092-independent-reproduction.yml':
                  raise SystemExit('reproduction predecessor run identity differs')
              artifacts_url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}/artifacts?per_page=100"
              with urllib.request.urlopen(urllib.request.Request(artifacts_url, headers=headers), timeout=30) as response:
                  artifacts = json.load(response).get('artifacts', [])
              matches = [item for item in artifacts if item.get('id') == artifact_id]
              if len(matches) != 1:
                  raise SystemExit('reproduction predecessor artifact id does not belong to the declared run')
              artifact = matches[0]
              if artifact.get('expired') or artifact.get('name') != previous_name:
                  raise SystemExit('reproduction predecessor artifact name or lifetime differs')
              api_digest = str(artifact.get('digest') or '').removeprefix('sha256:')
              supplied = os.environ['PREVIOUS_ARTIFACT_DIGEST'].removeprefix('sha256:')
              if not api_digest or api_digest != supplied:
                  raise SystemExit('reproduction predecessor artifact digest differs')
              workflow_run = artifact.get('workflow_run') or {}
              if workflow_run.get('head_sha') not in (None, head):
                  raise SystemExit('reproduction predecessor artifact came from another arming head')

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f'current_name={current_name}\n')
          PY

      - name: Download exact predecessor reproduction segment
        if: steps.invocation.outputs.segment_index != '0'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.invocation.outputs.previous_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.invocation.outputs.previous_run_id }}
          path: previous-reproduction

      - name: Assert canonical result content is unavailable to reproduction trajectory
        run: |
          test ! -e canonical-reference
          test ! -e m092-first-canonical-search-result.json
          test ! -e experiments/M092/VALIDATION_RECEIPT.json
          test ! -e experiments/M092/QUALIFICATION.json
          test ! -e experiments/M092/RESULT.json

      - name: Execute next independent reproduction segment
        id: reproduce
        continue-on-error: true
        env:
          ARM_HEAD_SHA: ${{ steps.invocation.outputs.arming_head_sha }}
          ARM_PARENT_SHA: ${{ steps.invocation.outputs.arming_parent_sha }}
          SOURCE_RUN_ID: ${{ steps.invocation.outputs.source_canonical_run_id }}
          SOURCE_ARTIFACT_ID: ${{ steps.invocation.outputs.source_canonical_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.invocation.outputs.source_canonical_artifact_digest }}
          SEGMENT_INDEX: ${{ steps.invocation.outputs.segment_index }}
        run: |
          if [ "$SEGMENT_INDEX" = "0" ]; then
            timeout --signal=TERM --kill-after=30s 320m \
              python scripts/run_m092_independent_reproduction.py \
                --requirement experiments/M092/TARGET_THEOREM.json \
                --output m092-independent-reproduction-state.json \
                --program-limit 2000000 \
                --checkpoint-programs 1
          else
            timeout --signal=TERM --kill-after=30s 320m \
              python scripts/run_m092_independent_reproduction.py \
                --requirement experiments/M092/TARGET_THEOREM.json \
                --state previous-reproduction/m092-independent-reproduction-state.json \
                --reproduction-segment-record previous-reproduction/m092-independent-reproduction-segment.json \
                --arming-head-sha "$ARM_HEAD_SHA" \
                --arming-parent-sha "$ARM_PARENT_SHA" \
                --source-canonical-run-id "$SOURCE_RUN_ID" \
                --source-canonical-artifact-id "$SOURCE_ARTIFACT_ID" \
                --source-canonical-artifact-digest "$SOURCE_ARTIFACT_DIGEST" \
                --previous-segment-index "$((SEGMENT_INDEX - 1))" \
                --output m092-independent-reproduction-state.json \
                --program-limit 2000000 \
                --checkpoint-programs 1
          fi

      - name: Package immutable reproduction segment receipt
        id: segment_record
        if: always() && steps.reproduce.outcome != 'skipped'
        env:
          ARM_HEAD_SHA: ${{ steps.invocation.outputs.arming_head_sha }}
          ARM_PARENT_SHA: ${{ steps.invocation.outputs.arming_parent_sha }}
          SOURCE_RUN_ID: ${{ steps.invocation.outputs.source_canonical_run_id }}
          SOURCE_ARTIFACT_ID: ${{ steps.invocation.outputs.source_canonical_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.invocation.outputs.source_canonical_artifact_digest }}
          SEGMENT_INDEX: ${{ steps.invocation.outputs.segment_index }}
          PREVIOUS_ARTIFACT_ID: ${{ steps.invocation.outputs.previous_artifact_id }}
          PREVIOUS_ARTIFACT_DIGEST: ${{ steps.invocation.outputs.previous_artifact_digest }}
          REPRODUCTION_OUTCOME: ${{ steps.reproduce.outcome }}
        run: |
          args=(
            --output-state m092-independent-reproduction-state.json
            --requirement experiments/M092/TARGET_THEOREM.json
            --arming-head-sha "$ARM_HEAD_SHA"
            --arming-parent-sha "$ARM_PARENT_SHA"
            --source-canonical-run-id "$SOURCE_RUN_ID"
            --source-canonical-artifact-id "$SOURCE_ARTIFACT_ID"
            --source-canonical-artifact-digest "$SOURCE_ARTIFACT_DIGEST"
            --segment-index "$SEGMENT_INDEX"
            --reproduction-step-outcome "$REPRODUCTION_OUTCOME"
            --github-run-id "${{ github.run_id }}"
            --github-run-attempt "${{ github.run_attempt }}"
            --output m092-independent-reproduction-segment.json
          )
          if [ "$SEGMENT_INDEX" != "0" ]; then
            args+=(
              --input-state previous-reproduction/m092-independent-reproduction-state.json
              --previous-segment previous-reproduction/m092-independent-reproduction-segment.json
              --previous-artifact-id "$PREVIOUS_ARTIFACT_ID"
              --previous-artifact-digest "$PREVIOUS_ARTIFACT_DIGEST"
            )
          fi
          python scripts/package_m092_reproduction_segment.py "${args[@]}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          value = json.loads(Path('m092-independent-reproduction-segment.json').read_text())
          progressed = (
              value['generated_programs_end'] > value['generated_programs_start']
              or value['certificate_policy_attempts_end'] > value['certificate_policy_attempts_start']
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f"terminal={'true' if value['checkpoint_terminal'] else 'false'}\n")
              handle.write(f"segment_digest={value['segment_digest']}\n")
              handle.write(f"progressed={'true' if progressed else 'false'}\n")
          PY

      - name: Upload immutable reproduction segment
        id: reproduction_upload
        if: always() && steps.segment_record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.segment_meta.outputs.current_name }}
          path: |
            m092-independent-reproduction-state.json
            m092-independent-reproduction-segment.json
          if-no-files-found: error
          retention-days: 90

      - name: Download canonical result only after reproduction is terminal
        if: always() && steps.reproduction_upload.outcome == 'success' && steps.segment_record.outputs.terminal == 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.invocation.outputs.source_canonical_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.invocation.outputs.source_canonical_run_id }}
          path: canonical-reference

      - name: Compare terminal reproduction with independently validated canonical result
        id: compare
        if: always() && steps.reproduction_upload.outcome == 'success' && steps.segment_record.outputs.terminal == 'true'
        run: |
          python scripts/package_m092_independent_reproduction.py \
            --reproduced-state m092-independent-reproduction-state.json \
            --terminal-reproduction-segment m092-independent-reproduction-segment.json \
            --canonical-result canonical-reference/m092-first-canonical-search-result.json \
            --target-theorem experiments/M092/TARGET_THEOREM.json \
            --marker experiments/M092/CANONICAL_SEARCH_ARMED.json \
            --arming-head-sha "${{ steps.invocation.outputs.arming_head_sha }}" \
            --arming-parent-sha "${{ steps.invocation.outputs.arming_parent_sha }}" \
            --source-canonical-run-id "${{ steps.invocation.outputs.source_canonical_run_id }}" \
            --source-canonical-artifact-id "${{ steps.invocation.outputs.source_canonical_artifact_id }}" \
            --source-canonical-artifact-digest "${{ steps.invocation.outputs.source_canonical_artifact_digest }}" \
            --output m092-first-independent-reproduction-result.json
          test ! -e experiments/M092/VALIDATION_RECEIPT.json
          test ! -e experiments/M092/QUALIFICATION.json
          test ! -e experiments/M092/RESULT.json

      - name: Preserve completed independent reproduction before enforcing match
        id: completed_upload
        if: always() && steps.compare.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: m092-first-independent-reproduction
          path: |
            m092-independent-reproduction-state.json
            m092-independent-reproduction-segment.json
            m092-first-independent-reproduction-result.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce reproduction match only after preservation
        if: always() && steps.completed_upload.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('m092-first-independent-reproduction-result.json').read_text())
          if value.get('state_byte_identical') is not True or value.get('qualification_gate_open') is not True:
              raise SystemExit('independent reproduction mismatched the canonical result; qualification remains closed')
          print('Independent M092 reproduction is byte-identical; qualification may be designed next.')
          PY

      - name: Dispatch exact next reproduction segment from immutable arming branch
        if: always() && steps.reproduction_upload.outcome == 'success' && steps.segment_record.outputs.terminal == 'false' && steps.segment_record.outputs.progressed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARMING_BRANCH_REF: ${{ steps.guard.outputs.arming_branch_ref }}
          ARMING_PR_NUMBER: ${{ steps.invocation.outputs.arming_pr_number }}
          ARM_HEAD_SHA: ${{ steps.invocation.outputs.arming_head_sha }}
          ARM_PARENT_SHA: ${{ steps.invocation.outputs.arming_parent_sha }}
          SOURCE_RUN_ID: ${{ steps.invocation.outputs.source_canonical_run_id }}
          SOURCE_ARTIFACT_ID: ${{ steps.invocation.outputs.source_canonical_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.invocation.outputs.source_canonical_artifact_digest }}
          SEGMENT_INDEX: ${{ steps.invocation.outputs.segment_index }}
          ARTIFACT_ID: ${{ steps.reproduction_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.reproduction_upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          next_index = int(os.environ['SEGMENT_INDEX']) + 1
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/m092-independent-reproduction.yml/dispatches"
          payload = {
              'ref': os.environ['ARMING_BRANCH_REF'],
              'inputs': {
                  'arming_pr_number': os.environ['ARMING_PR_NUMBER'],
                  'arming_head_sha': os.environ['ARM_HEAD_SHA'],
                  'arming_parent_sha': os.environ['ARM_PARENT_SHA'],
                  'segment_index': str(next_index),
                  'source_canonical_run_id': os.environ['SOURCE_RUN_ID'],
                  'source_canonical_artifact_id': os.environ['SOURCE_ARTIFACT_ID'],
                  'source_canonical_artifact_digest': os.environ['SOURCE_ARTIFACT_DIGEST'],
                  'previous_run_id': os.environ['GITHUB_RUN_ID'],
                  'previous_artifact_id': os.environ['ARTIFACT_ID'],
                  'previous_artifact_digest': os.environ['ARTIFACT_DIGEST'],
              },
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f'reproduction continuation dispatch returned HTTP {response.status}')
          print(f'Dispatched independent reproduction segment {next_index}.')
          PY

      - name: Refuse automatic reproduction retry loop without checkpoint progress
        if: always() && steps.reproduction_upload.outcome == 'success' && steps.segment_record.outputs.terminal == 'false' && steps.segment_record.outputs.progressed != 'true'
        run: |
          echo "Independent reproduction segment made no completed-program progress; automatic continuation is fail-closed."
          exit 1
