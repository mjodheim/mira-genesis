name: One-shot V23 L5 holdout calibration 2026-09-24

on:
  push:
    branches:
      - research/rsi-v23-l5-causal-recursion

permissions:
  contents: read

jobs:
  brewtrack:
    name: Calibrate BrewTrack L5 holdouts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Genesis apparatus
        uses: actions/checkout@v6
      - name: Materialize exact BrewTrack L5 snapshot
        shell: bash
        run: |
          set -euo pipefail
          cp -a experiment/rsi_v23/holdout/host_snapshot/brewtrack brewtrack
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("brewtrack/SNAPSHOT_MANIFEST.json").read_text())
          assert m["source_repository"]=="mjodheim/BrewTrack"
          assert m["source_commit"]=="1727fc0158c6dbd741bfb0b6d85e8fe70f1a40f3"
          assert len(m["files"])==7
          print("L5_BREWTRACK_SNAPSHOT=PASS")
          PY
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore once
        working-directory: brewtrack
        run: dotnet restore Tests/L5Snapshot.Tests.csproj
      - name: Public oracle guard
        working-directory: brewtrack
        run: |
          dotnet build Tests/L5Snapshot.Tests.csproj -c Release --no-restore
          dotnet test Tests/L5Snapshot.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~BrewMathTests|FullyQualifiedName~RecipeMathTests" --verbosity normal
      - name: Calibrate BrewMath oracle and defect root
        shell: bash
        run: |
          set -euo pipefail
          cp -a brewtrack /tmp/brewmath-oracle
          cp -a brewtrack /tmp/brewmath-defect
          cp experiment/rsi_v23/holdout/evaluator/L5BrewMathReservedTests.cs /tmp/brewmath-oracle/Tests/
          cp experiment/rsi_v23/holdout/evaluator/L5BrewMathReservedTests.cs /tmp/brewmath-defect/Tests/
          git -C /tmp/brewmath-defect apply "$GITHUB_WORKSPACE/experiment/rsi_v23/holdout/defects/brewtrack-brewmath-precision.patch"

          dotnet test /tmp/brewmath-oracle/Tests/L5Snapshot.Tests.csproj -c Release --filter FullyQualifiedName~L5BrewMathReservedTests --logger "trx;LogFileName=oracle.trx"
          set +e
          dotnet test /tmp/brewmath-defect/Tests/L5Snapshot.Tests.csproj -c Release --filter FullyQualifiedName~L5BrewMathReservedTests --logger "trx;LogFileName=defect.trx"
          defect_rc=$?
          set -e
          test "$defect_rc" -ne 0
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          def counters(path):
              root=ET.parse(path).getroot()
              for elem in root.iter():
                  if elem.tag.endswith("Counters"):
                      return {k:int(v) for k,v in elem.attrib.items() if v.isdigit()}
              raise SystemExit(f"no counters in {path}")
          oracle=counters(Path("/tmp/brewmath-oracle/Tests/TestResults/oracle.trx"))
          defect=counters(Path("/tmp/brewmath-defect/Tests/TestResults/defect.trx"))
          print("L5_BREWMATH_ORACLE",oracle)
          print("L5_BREWMATH_DEFECT",defect)
          assert oracle.get("total")==4 and oracle.get("passed")==4 and oracle.get("failed")==0
          assert defect.get("total")==4 and defect.get("passed")==0 and defect.get("failed")==4
          PY
          rm /tmp/brewmath-defect/Tests/L5BrewMathReservedTests.cs
          dotnet test /tmp/brewmath-defect/Tests/L5Snapshot.Tests.csproj -c Release --verbosity normal

      - name: Calibrate RecipeMath oracle and defect root
        shell: bash
        run: |
          set -euo pipefail
          cp -a brewtrack /tmp/recipemath-oracle
          cp -a brewtrack /tmp/recipemath-defect
          cp experiment/rsi_v23/holdout/evaluator/L5RecipeMathReservedTests.cs /tmp/recipemath-oracle/Tests/
          cp experiment/rsi_v23/holdout/evaluator/L5RecipeMathReservedTests.cs /tmp/recipemath-defect/Tests/
          git -C /tmp/recipemath-defect apply "$GITHUB_WORKSPACE/experiment/rsi_v23/holdout/defects/brewtrack-recipemath-units-water.patch"

          dotnet test /tmp/recipemath-oracle/Tests/L5Snapshot.Tests.csproj -c Release --filter FullyQualifiedName~L5RecipeMathReservedTests --logger "trx;LogFileName=oracle.trx"
          set +e
          dotnet test /tmp/recipemath-defect/Tests/L5Snapshot.Tests.csproj -c Release --filter FullyQualifiedName~L5RecipeMathReservedTests --logger "trx;LogFileName=defect.trx"
          defect_rc=$?
          set -e
          test "$defect_rc" -ne 0
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          def counters(path):
              root=ET.parse(path).getroot()
              for elem in root.iter():
                  if elem.tag.endswith("Counters"):
                      return {k:int(v) for k,v in elem.attrib.items() if v.isdigit()}
              raise SystemExit(f"no counters in {path}")
          oracle=counters(Path("/tmp/recipemath-oracle/Tests/TestResults/oracle.trx"))
          defect=counters(Path("/tmp/recipemath-defect/Tests/TestResults/defect.trx"))
          print("L5_RECIPEMATH_ORACLE",oracle)
          print("L5_RECIPEMATH_DEFECT",defect)
          assert oracle.get("total")==4 and oracle.get("passed")==4 and oracle.get("failed")==0
          assert defect.get("total")==4 and defect.get("passed")==0 and defect.get("failed")==4
          PY
          rm /tmp/recipemath-defect/Tests/L5RecipeMathReservedTests.cs
          dotnet test /tmp/recipemath-defect/Tests/L5Snapshot.Tests.csproj -c Release --verbosity normal

  brewstead:
    name: Calibrate Brewstead L5 holdouts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Genesis apparatus
        uses: actions/checkout@v6
      - name: Checkout exact Brewstead host
        uses: actions/checkout@v6
        with:
          repository: mjodheim/mjodheim-brewstead
          ref: 84f6c2462b810a83870974068db1e12d7f1e3720
          path: brewstead
      - name: Setup Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
      - name: Public oracle guard
        working-directory: brewstead
        run: |
          chmod +x mvnw
          ./mvnw -q -Dtest='*ServiceTest,*ControllerTest,DomainBehaviorTest,RequestValidationTest,MapperTest,GameClockTest,ApiExceptionHandlerTest' test
      - name: Calibrate EffectService oracle and defect root
        shell: bash
        run: |
          set -euo pipefail
          cp -a brewstead /tmp/effect-oracle
          cp -a brewstead /tmp/effect-defect
          cp experiment/rsi_v23/holdout/evaluator/L5EffectServiceReservedTest.java /tmp/effect-oracle/src/test/java/be/mjodheim/brewstead/service/
          cp experiment/rsi_v23/holdout/evaluator/L5EffectServiceReservedTest.java /tmp/effect-defect/src/test/java/be/mjodheim/brewstead/service/
          git -C /tmp/effect-defect apply "$GITHUB_WORKSPACE/experiment/rsi_v23/holdout/defects/brewstead-effect-rounding.patch"

          (cd /tmp/effect-oracle && ./mvnw -q -Dtest=L5EffectServiceReservedTest test)
          set +e
          (cd /tmp/effect-defect && ./mvnw -q -Dtest=L5EffectServiceReservedTest test)
          defect_rc=$?
          set -e
          test "$defect_rc" -ne 0
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          def counts(path):
              root=ET.parse(path).getroot()
              return {k:int(root.attrib.get(k,0)) for k in ("tests","failures","errors","skipped")}
          oracle=counts("/tmp/effect-oracle/target/surefire-reports/TEST-be.mjodheim.brewstead.service.L5EffectServiceReservedTest.xml")
          defect=counts("/tmp/effect-defect/target/surefire-reports/TEST-be.mjodheim.brewstead.service.L5EffectServiceReservedTest.xml")
          print("L5_EFFECT_ORACLE",oracle)
          print("L5_EFFECT_DEFECT",defect)
          assert oracle=={"tests":4,"failures":0,"errors":0,"skipped":0}
          assert defect=={"tests":4,"failures":4,"errors":0,"skipped":0}
          PY
          rm /tmp/effect-defect/src/test/java/be/mjodheim/brewstead/service/L5EffectServiceReservedTest.java
          (cd /tmp/effect-defect && ./mvnw -q -Dtest='*ServiceTest,*ControllerTest,DomainBehaviorTest,RequestValidationTest,MapperTest,GameClockTest,ApiExceptionHandlerTest' test)

      - name: Calibrate BrewService oracle and defect root
        shell: bash
        run: |
          set -euo pipefail
          cp -a brewstead /tmp/brew-oracle
          cp -a brewstead /tmp/brew-defect
          cp experiment/rsi_v23/holdout/evaluator/L5BrewServiceReservedTest.java /tmp/brew-oracle/src/test/java/be/mjodheim/brewstead/service/
          cp experiment/rsi_v23/holdout/evaluator/L5BrewServiceReservedTest.java /tmp/brew-defect/src/test/java/be/mjodheim/brewstead/service/
          git -C /tmp/brew-defect apply "$GITHUB_WORKSPACE/experiment/rsi_v23/holdout/defects/brewstead-brew-lifecycle-thresholds.patch"

          (cd /tmp/brew-oracle && ./mvnw -q -Dtest=L5BrewServiceReservedTest test)
          set +e
          (cd /tmp/brew-defect && ./mvnw -q -Dtest=L5BrewServiceReservedTest test)
          defect_rc=$?
          set -e
          test "$defect_rc" -ne 0
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          def counts(path):
              root=ET.parse(path).getroot()
              return {k:int(root.attrib.get(k,0)) for k in ("tests","failures","errors","skipped")}
          oracle=counts("/tmp/brew-oracle/target/surefire-reports/TEST-be.mjodheim.brewstead.service.L5BrewServiceReservedTest.xml")
          defect=counts("/tmp/brew-defect/target/surefire-reports/TEST-be.mjodheim.brewstead.service.L5BrewServiceReservedTest.xml")
          print("L5_BREW_ORACLE",oracle)
          print("L5_BREW_DEFECT",defect)
          assert oracle=={"tests":4,"failures":0,"errors":0,"skipped":0}
          assert defect=={"tests":4,"failures":4,"errors":0,"skipped":0}
          PY
          rm /tmp/brew-defect/src/test/java/be/mjodheim/brewstead/service/L5BrewServiceReservedTest.java
          (cd /tmp/brew-defect && ./mvnw -q -Dtest='*ServiceTest,*ControllerTest,DomainBehaviorTest,RequestValidationTest,MapperTest,GameClockTest,ApiExceptionHandlerTest' test)
