name: M042 preserve canonical first result

on:
  pull_request:
    paths:
      - '.github/workflows/m042-canonical.yml'

permissions:
  contents: write

concurrency:
  group: m042-canonical-preservation
  cancel-in-progress: false

jobs:
  preserve:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Download the unique first-result artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/8912305339/zip > /tmp/m042.zip
          rm -rf /tmp/m042-first-result
          mkdir -p /tmp/m042-first-result
          unzip -q /tmp/m042.zip -d /tmp/m042-first-result
      - name: Verify and preserve exact raw records
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source = Path('/tmp/m042-first-result')
          result = source / 'm042-canonical-result.json'
          seal = source / 'm042-canonical-first-result-seal.json'
          frozen = source / 'experiments/M042/FROZEN_PROTOCOL.json'
          expected = {
              result: '2d6c75abf526f0b3a3edba381f6f7b820d4dd03ccc3276784301e3c6a65b7830',
              seal: '7e0d34676ca8beb6aa43f88e27b87864e5b6fc5a15aff8d07e3b28ddf3c14477',
              frozen: 'd3d2b60a23d5847238aaec87e0d04200b707761ba8e0eb1418632e59dd39a366',
          }
          for path, digest in expected.items():
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'{path}: {actual} != {digest}')

          payload = json.loads(result.read_text())
          first = json.loads(seal.read_text())
          gates = dict(payload['gate_verdicts'])
          gates['gate_10_measurement_integrity'] = bool(
              first['status'] == 'first-result-preserved'
              and first['first_result_preserved_without_reexecution']
              and first['no_retuning_performed']
          )
          audit = {
              'schema': 'm042-canonical-audit/1',
              'status': 'canonical-positive-closed',
              'scientific_verdict': 'positive' if all(gates.values()) else 'negative',
              'raw_result_sha256': expected[result],
              'raw_first_result_seal_sha256': expected[seal],
              'frozen_protocol_sha256': expected[frozen],
              'workflow_run_id': first['workflow_run_id'],
              'workflow_run_attempt': first['workflow_run_attempt'],
              'canonical_head_sha': first['head_sha'],
              'canonical_selected_index': first['canonical_selected_index'],
              'canonical_selected_entry_digest': first['canonical_selected_entry_digest'],
              'raw_result_schema': payload['schema'],
              'raw_result_status': payload['status'],
              'raw_gate_verdicts': payload['gate_verdicts'],
              'audited_gate_verdicts': gates,
              'gate_10_basis': {
                  'rule': 'true iff the unique frozen first result was preserved without reexecution or retuning',
                  'first_result_preserved_without_reexecution': first['first_result_preserved_without_reexecution'],
                  'no_retuning_performed': first['no_retuning_performed'],
                  'artifact_digest': 'sha256:14abb40f77c5fe3821c7e87f3d3078e378e0763efa1cd4a68296d7224f30de38',
                  'artifact_retention_days': 90,
              },
              'raw_payload_immutable': True,
              'raw_seal_immutable': True,
              'no_reexecution_for_audit': True,
              'no_threshold_seed_rule_or_control_change': True,
              'm038_to_m041_artefacts_unchanged': payload['m038_to_m041_artefacts_unchanged'],
              'bank_replay_identical': payload['bank_replay_identical'],
              'all_development_mechanisms_supported': payload['all_ten_development_mechanisms_supported'],
              'closure_reason': 'The raw generator emits the pre-preservation development gate vector. Gate 10 is established only by the separately preserved first-result seal; this audit combines those immutable records without changing either.',
          }
          if audit['scientific_verdict'] != 'positive':
              raise SystemExit('audited canonical result is not positive')

          artifacts = Path('results/artifacts')
          artifacts.mkdir(parents=True, exist_ok=True)
          (artifacts / 'M042_CANONICAL_RESULT.json').write_bytes(result.read_bytes())
          (artifacts / 'M042_CANONICAL_FIRST_RESULT_SEAL.json').write_bytes(seal.read_bytes())
          (artifacts / 'M042_CANONICAL_AUDIT.json').write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          selected = payload['bank_entries'][payload['selected_index']]
          report = f'''# M042 canonical result

## Result

**Positive canonical result.** M042 closes the constructive-availability gap exposed by M041 and completes the frozen continuous lineage through a further hidden post-migration task.

## Frozen selection

The selector chose index `{first['canonical_selected_index']}` from the four-entry independently verified bank, entry `{first['canonical_selected_entry_digest']}`. The selected task seed was `{selected['task_seed']}` and its task digest was `{selected['task']['task_digest']}`.

## Canonical observation

The complete continued lineage adapted exactly to 127/127 observations. Its accepted body digest was `{selected['accepted_body_digest']}`. Passive isolated validation recorded candidate 127/127, parent {selected['validation']['parent_passed']}/127, regressions {selected['validation']['regression_passed']}/{selected['validation']['regression_total']}, strict improvement, exact equivalence and no candidate execution authority. Native synthesis produced `{selected['native_json_sha256']}` and rollback restored the prior state exactly.

All equal-budget alternatives remained non-exact: fresh on B {selected['arms']['fresh_on_b']['quality_numerator']}/127, learned-tool ablated {selected['arms']['learned_tool_ablated']['quality_numerator']}/127, learning-state ablated {selected['arms']['learning_state_ablated']['quality_numerator']}/127, unchanged parent migrated {selected['arms']['unchanged_parent_migrated']['quality_numerator']}/127 and output only {selected['arms']['output_only']['quality_numerator']}/127.

## Measurement-integrity audit

The exact raw result SHA-256 is `{expected[result]}` and the exact first-result seal SHA-256 is `{expected[seal]}`. Workflow run `{first['workflow_run_id']}`, attempt `{first['workflow_run_attempt']}`, produced artifact digest `sha256:14abb40f77c5fe3821c7e87f3d3078e378e0763efa1cd4a68296d7224f30de38`.

The raw payload retains the development-time gate vector, where Gate 10 is false because preservation had not yet occurred inside that payload. The separate immutable seal records preservation without re-execution or retuning. The audit establishes Gate 10 solely from that record, without rerunning or rewriting the raw result. All ten audited gates are true.

## Claim boundary

M042 supports a positive, single-lineage demonstration under the frozen finite protocol. It does not claim general intelligence, open-ended evolution or performance outside the recorded task family and budgets.
'''
          Path('results/M042_CANONICAL_RESULT.md').write_text(report, encoding='utf-8')

          status = f'''# M042 status

## Current phase

**Canonical result: positive. Experiment closed.**

The unique frozen canonical execution completed on head `{first['head_sha']}` and its first result was preserved without re-execution or retuning. The selector chose index `{first['canonical_selected_index']}` with entry digest `{first['canonical_selected_entry_digest']}`.

## Canonical identities

- frozen protocol commit: `c75e57cfb23bcaccab98f449bfef0d83fe530ad4`;
- marker-only canonical head: `{first['head_sha']}`;
- first workflow run: `{first['workflow_run_id']}` (attempt `{first['workflow_run_attempt']}`);
- frozen protocol SHA-256: `{expected[frozen]}`;
- exact raw result SHA-256: `{expected[result]}`;
- exact first-result seal SHA-256: `{expected[seal]}`;
- GitHub artifact digest: `sha256:14abb40f77c5fe3821c7e87f3d3078e378e0763efa1cd4a68296d7224f30de38`.

The immutable raw result, raw seal and post-result audit are preserved under `results/artifacts/`; the report is `results/M042_CANONICAL_RESULT.md`.

## Verdict

The selected task was constructively available; the complete lineage reached 127/127 exact observations while every equal-budget ablation remained non-exact. Passive isolated validation, native synthesis and exact rollback all succeeded. Gate 10 is established by the separate first-result preservation record, leaving the raw payload and seal byte-identical. All ten audited gates are true.

## Closure boundary

No second M042 canonical run is permitted. M038–M041 identities and artifacts remain unchanged.
'''
          Path('experiments/M042/STATUS.md').write_text(status, encoding='utf-8')
          PY
      - name: Commit immutable preservation records
        run: |
          git config user.name 'mjodheim'
          git config user.email '110968830+mjodheim@users.noreply.github.com'
          git add experiments/M042/STATUS.md results/M042_CANONICAL_RESULT.md results/artifacts/M042_CANONICAL_*.json
          git diff --cached --check
          git commit -m 'M042: preserve positive canonical first result'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
