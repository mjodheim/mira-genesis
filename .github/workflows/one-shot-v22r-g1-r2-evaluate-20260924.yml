name: One-shot V22R G1 R2 retained evaluation 2026-09-24

on:
  push:
    branches:
      - results/rsi-v22r-r1-20260924

permissions:
  contents: read
  actions: read

jobs:
  evaluate-r2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Genesis result branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Checkout frozen Brewstead host
        uses: actions/checkout@v4
        with:
          repository: mjodheim/mjodheim-brewstead
          ref: 720b27c8bc80de16c04953e13d5f9e8425beea8c
          path: host

      - name: Verify exact received R2 bytes
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF' | sha256sum -c -
          94847b17864b215f9fd15d3ff8b2e1f5f501b85028dd0eec83a40db82e3ca612  results/rsi-v22r/r2-20260924/catalog/s1/proposal.patch
          4edbc66f621deb6a410c77b9a644510c7c1885f943f5c2db321dd16db77e3712  results/rsi-v22r/r2-20260924/catalog/s1/transcript.json
          7df456192aff85104e72390baa28e79925afad244e88f8df67a5dbc270467514  results/rsi-v22r/r2-20260924/catalog/s2/proposal.patch
          2b0db2aae58caf72a9af78fdf1a7b750e160fdfc4a7006a20c43c418fb7dd45d  results/rsi-v22r/r2-20260924/catalog/s2/transcript.json
          8d2ef1270c72499de644d1b0f01c26034f5ae3dc30db41171c06f06a7bd91994  results/rsi-v22r/r2-20260924/game-state/s1/proposal.patch
          7d75b9d8b693a0504f857e9d159844a7a0d2460688660eb945dd932413d5c3ad  results/rsi-v22r/r2-20260924/game-state/s1/transcript.json
          b5178b10ba550a0e8240724c9c2daf5b765691d6ae292733ef644478aa33f697  results/rsi-v22r/r2-20260924/game-state/s2/proposal.patch
          b66490c6087695ca35b5bf28998d1ba1bf43d7a6358d799ef085eb7a3f6995dd  results/rsi-v22r/r2-20260924/game-state/s2/transcript.json
          50220ff944eee39d1b9d3119ebad68723763a5298fce5e0baad9b7c094059004  results/rsi-v22r/r2-20260924/progression/s1/proposal.patch
          56976889b0fccb486180c8a43c6d3aed37264889d41524946e2b6e5ec6a32bec  results/rsi-v22r/r2-20260924/progression/s1/transcript.json
          319babe94527ec47b1e555e91916bc6887d55c783406da9bf98abf417e74d52e  results/rsi-v22r/r2-20260924/progression/s2/proposal.patch
          9b895feffc927e1b17804a4cd1c491601f86023883f9943f38d7f79ee7709185  results/rsi-v22r/r2-20260924/progression/s2/transcript.json
          EOF

      - name: Recover exact R1 state artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r1
          gh run download 35951143503 -n v22r-r1-retained-evaluation -D /tmp/r1
          test -f /tmp/r1/catalog-state.json
          test -f /tmp/r1/game-state-state.json
          test -f /tmp/r1/progression-state.json

      - name: Rebuild V22R roots and exact R2 capsules
        shell: bash
        run: |
          set -euo pipefail
          python3 experiment/rsi_v22r/build_root_bundles.py \
            --host "$GITHUB_WORKSPACE/host" \
            --apparatus-commit 6babe495ef00f2a5c666a5268bace3c79c5a226a \
            --out /tmp/roots > /tmp/root-build.json

          mkdir -p /tmp/r2-bundles
          build_task() {
            short="$1"; task="$2"
            python3 experiment/rsi_v22/build_next_bundles.py \
              --state "/tmp/r1/$short-state.json" \
              --arm g1 \
              --root-bundle "/tmp/roots/genesis-v22r-$task-r1-shared-s1.zip" \
              --results-dir results/rsi-v22r/r1-20260924 \
              --freeze-commit 6babe495ef00f2a5c666a5268bace3c79c5a226a \
              --out /tmp/r2-bundles
          }
          build_task catalog brewstead-catalog-crop-ingredient-name
          build_task game-state brewstead-game-state-estate-max-fields
          build_task progression brewstead-progression-merchant-coin-bonus

          cat <<'EOF' | sha256sum -c -
          0f916832ffe2a3406bb488cf64e4852c2c2c0248e6d3a6ba4116274eaf7492a0  /tmp/r2-bundles/genesis-v22-brewstead-catalog-crop-ingredient-name-r2-g1-s1.zip
          47655eef490f9155b9cfe78bc27d9cdc7bda96e473d5ef3bd078f807c361cba5  /tmp/r2-bundles/genesis-v22-brewstead-catalog-crop-ingredient-name-r2-g1-s2.zip
          7717405016c106f9b5ac70ad4d65cf6d10cfb5c2359b5da59551bd1929c8a906  /tmp/r2-bundles/genesis-v22-brewstead-game-state-estate-max-fields-r2-g1-s1.zip
          3d7109fd833d8cc02e76dd5cbf904e34acbcb6bc455ca0394a491a292d9b33f3  /tmp/r2-bundles/genesis-v22-brewstead-game-state-estate-max-fields-r2-g1-s2.zip
          f12ff4213ad952b214b42774009d1f8e5334b9761a07b2d84fd01b8ec9181ac7  /tmp/r2-bundles/genesis-v22-brewstead-progression-merchant-coin-bonus-r2-g1-s1.zip
          f58ea30fed1f9ffa26b595efab1d2260c91035f767d3b464ccb7ed844ce66d05  /tmp/r2-bundles/genesis-v22-brewstead-progression-merchant-coin-bonus-r2-g1-s2.zip
          EOF

      - name: Execute retained evaluator and record G1 R2
        shell: bash
        run: |
          set -euo pipefail
          A=experiment/rsi_v22
          R=results/rsi-v22r/r2-20260924
          mkdir -p /tmp/r2-results

          eval_slot() {
            short="$1"; task="$2"; slot="$3"
            python3 "$A/evaluate_proposal.py" \
              "/tmp/r2-bundles/genesis-v22-$task-r2-g1-$slot.zip" \
              "$R/$short/$slot/proposal.patch" \
              "$R/$short/$slot/transcript.json" \
              --out "/tmp/r2-results/$short-$slot-evaluation.json"
          }

          eval_slot catalog brewstead-catalog-crop-ingredient-name s1
          eval_slot catalog brewstead-catalog-crop-ingredient-name s2
          eval_slot game-state brewstead-game-state-estate-max-fields s1
          eval_slot game-state brewstead-game-state-estate-max-fields s2
          eval_slot progression brewstead-progression-merchant-coin-bonus s1
          eval_slot progression brewstead-progression-merchant-coin-bonus s2

          record_task() {
            short="$1"
            cp "/tmp/r1/$short-state.json" "/tmp/r2-results/$short-state.json"
            python3 "$A/campaign_cli.py" record \
              "/tmp/r2-results/$short-state.json" g1 \
              "/tmp/r2-results/$short-s1-evaluation.json" \
              "/tmp/r2-results/$short-s2-evaluation.json" \
              --out "/tmp/r2-results/$short-state.json"
            python3 "$A/campaign_cli.py" summary "/tmp/r2-results/$short-state.json" > "/tmp/r2-results/$short-summary.json"
          }

          record_task catalog
          record_task game-state
          record_task progression

          for f in /tmp/r2-results/*-evaluation.json /tmp/r2-results/*-summary.json; do
            echo "===V22R_R2_RESULT:$(basename "$f")==="
            cat "$f"
            echo "===END_V22R_R2_RESULT:$(basename "$f")==="
          done

      - name: Upload exact R2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v22r-g1-r2-retained-evaluation
          path: /tmp/r2-results
          if-no-files-found: error
