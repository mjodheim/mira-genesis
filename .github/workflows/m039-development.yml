name: M039 three-cycle development

# Development only. Seed 390039 and every revealed task are consumed by the first run.
# This workflow cannot produce a canonical Gate 2 or Gate 9 result.
on:
  pull_request:
    paths:
      - 'metamorphosis/m039_*.py'
      - 'experiments/M039/**'
      - 'tests/test_m039_*.py'
      - '.github/workflows/m039-development.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m039-development-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  three-cycle-development:
    name: Three-cycle cumulative lineage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run M039 permanent tests first
        run: pytest -q tests/test_m039_lineage.py tests/test_m039_journal.py

      - name: Run the committed development lineage
        run: |
          python experiments/M039/run_development.py \
            --output m039-development-result.json \
            --require-combined

      - name: Verify the consumed development artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('m039-development-result.json').read_text())
          assert payload['schema'] == 'm039-development-result/1'
          assert payload['status'] == 'consumed-development-result'
          assert payload['development_seed_consumed'] is True
          assert payload['three_cycles_accepted'] is True
          assert payload['later_tool_reuse_supported'] is True
          assert payload['tool_ablation_supported'] is True
          assert payload['seed_to_head_replay_supported'] is True
          assert payload['gate2_tool_ids']
          assert payload['no_sealed_block_opened'] is True
          assert payload['no_canonical_claim'] is True
          PY

      - name: Upload the consumed development artifact
        uses: actions/upload-artifact@v4
        with:
          name: m039-development-${{ github.event.pull_request.head.sha || github.sha }}
          path: m039-development-result.json
          if-no-files-found: error
          retention-days: 30
