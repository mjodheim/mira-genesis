name: Diagnose explicit M012b replacement stream

on:
  push:
    branches: [research/m012b-sealed-morphogenesis]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/m012b-sealed-morphogenesis

      - name: Record explicit stream integrity
        shell: bash
        run: |
          set -u
          files=(
            tools/m012b-payload/fixed-00a
            tools/m012b-payload/fixed-00b
            tools/m012b-payload/part-01
            tools/m012b-payload/fixed-02
            tools/m012b-payload/fixed-03
            tools/m012b-payload/fixed-04
            tools/m012b-payload/part-05-07
          )
          : > tools/m012b-payload/final-diagnostic.txt
          for file in "${files[@]}"; do
            printf '%s bytes=%s sha256=%s\n' "$(basename "$file")" "$(wc -c < "$file")" "$(sha256sum "$file" | cut -d' ' -f1)" >> tools/m012b-payload/final-diagnostic.txt
          done
          cat "${files[@]}" > /tmp/m012b-final.b64
          echo "stream_bytes=$(wc -c < /tmp/m012b-final.b64)" >> tools/m012b-payload/final-diagnostic.txt
          echo "stream_sha256=$(sha256sum /tmp/m012b-final.b64 | cut -d' ' -f1)" >> tools/m012b-payload/final-diagnostic.txt
          if base64 -d /tmp/m012b-final.b64 > /tmp/m012b-final.tar.gz; then
            echo "decode=success" >> tools/m012b-payload/final-diagnostic.txt
            echo "archive_sha256=$(sha256sum /tmp/m012b-final.tar.gz | cut -d' ' -f1)" >> tools/m012b-payload/final-diagnostic.txt
          else
            echo "decode=failed" >> tools/m012b-payload/final-diagnostic.txt
          fi
          rm .github/workflows/m012b-final-expand.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "diagnostic(m012b): record explicit stream integrity"
          git push origin HEAD:research/m012b-sealed-morphogenesis
