name: Attribution policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: attribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    if: github.event_name == 'pull_request_target'
    name: Human-only attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Fetch the proposed commit without checking it out
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          git fetch --no-tags origin
          "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pull/${PR_NUMBER}/head"
      - name: Check commit and pull-request attribution from trusted code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PATH: ${{ github.event_path }}
        run: >-
          python scripts/check_attribution_policy.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --event "$EVENT_PATH"

  repository-cleanup-once:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[repo-cleanup-once]')
    name: Repository cleanup (one-shot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Delete fully merged branches and old unprotected Actions history
        env:
          GH_TOKEN: ${{ github.token }}
          # The repository contains intentionally huge decimal fixtures. The cleanup treats any
          # numeric token as protected evidence, so Python must be allowed to parse those tokens.
          PYTHONINTMAXSTRDIGITS: '0'
        run: python scripts/run_repository_cleanup_once.py
