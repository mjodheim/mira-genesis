name: Repository cleanup (one-shot)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repository-cleanup-once.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: repository-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove fully merged stale branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          python - <<'PY' > /tmp/open-pr-heads.txt
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          page = 1
          while True:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/pulls?state=open&per_page=100&page={page}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  items = json.load(response)
              if not items:
                  break
              for pr in items:
                  if pr.get('head', {}).get('repo', {}).get('full_name') == repo:
                      print(pr['head']['ref'])
              if len(items) < 100:
                  break
              page += 1
          PY

          : > /tmp/deleted-branches.txt
          : > /tmp/kept-branches.txt

          while IFS= read -r remote_ref; do
            branch="${remote_ref#origin/}"
            if [[ "$branch" == "HEAD" || "$branch" == "main" ]]; then
              continue
            fi
            if grep -Fxq "$branch" /tmp/open-pr-heads.txt; then
              echo "$branch (open PR)" >> /tmp/kept-branches.txt
              continue
            fi
            if git merge-base --is-ancestor "origin/$branch" origin/main; then
              if git push origin --delete "$branch"; then
                echo "$branch" >> /tmp/deleted-branches.txt
              else
                echo "$branch (delete refused)" >> /tmp/kept-branches.txt
              fi
            else
              echo "$branch (contains non-main history)" >> /tmp/kept-branches.txt
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin | sort -u)

          {
            echo '## Branch cleanup'
            echo
            echo "Deleted fully merged branches: $(wc -l < /tmp/deleted-branches.txt)"
            if [[ -s /tmp/deleted-branches.txt ]]; then
              sed 's/^/- `/' /tmp/deleted-branches.txt | sed 's/$/`/'
            fi
            echo
            echo 'Branches deliberately retained because they are active or contain history not in `main`:'
            if [[ -s /tmp/kept-branches.txt ]]; then
              sed 's/^/- `/' /tmp/kept-branches.txt | sed 's/$/`/'
            else
              echo '- none'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Purge old Actions artifacts and runs safely
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          REPO = os.environ['GITHUB_REPOSITORY']
          TOKEN = os.environ['GH_TOKEN']
          CURRENT_RUN = int(os.environ['GITHUB_RUN_ID'])
          KEEP_NEWEST_RUNS = 100
          MAX_ARTIFACT_DELETES = 380
          MAX_RUN_DELETES = 350

          headers = {
              'Authorization': f'Bearer {TOKEN}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mira-genesis-repository-cleanup',
          }

          def request(path, method='GET'):
              url = path if path.startswith('http') else f'https://api.github.com/repos/{REPO}/{path.lstrip("/")}'
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', 'replace')
                  raise RuntimeError(f'{method} {url} -> HTTP {exc.code}: {body[:500]}') from exc

          def paged(path, key):
              page = 1
              out = []
              sep = '&' if '?' in path else '?'
              while True:
                  payload = request(f'{path}{sep}per_page=100&page={page}')
                  items = payload[key] if isinstance(payload, dict) else payload
                  if not items:
                      break
                  out.extend(items)
                  if len(items) < 100:
                      break
                  page += 1
              return out

          def extract_run_ids(text):
              if not text:
                  return set()
              ids = {int(x) for x in re.findall(r'actions/runs/(\d+)', text)}
              ids.update(int(x) for x in re.findall(r'(?i)\brun(?:\s+|[`#:_-]+)(\d{8,})\b', text))
              return ids

          protected = {CURRENT_RUN}
          protected_reasons = {CURRENT_RUN: 'current cleanup run'}

          completed_runs = paged('actions/runs?status=completed', 'workflow_runs')
          completed_runs.sort(key=lambda r: r.get('created_at', ''), reverse=True)
          for run in completed_runs[:KEEP_NEWEST_RUNS]:
              protected.add(run['id'])
              protected_reasons.setdefault(run['id'], 'newest 100')

          # Protect any run identifier cited in the tracked repository.
          try:
              tracked_text = subprocess.check_output(
                  ['git', 'grep', '-I', '-h', '-e', 'actions/runs/', '-e', 'run '],
                  text=True,
                  stderr=subprocess.DEVNULL,
              )
          except subprocess.CalledProcessError:
              tracked_text = ''
          for run_id in extract_run_ids(tracked_text):
              protected.add(run_id)
              protected_reasons.setdefault(run_id, 'cited in repository')

          # Protect run identifiers cited in PR descriptions, including historical scientific PRs.
          all_prs = []
          page = 1
          while True:
              prs = request(f'pulls?state=all&per_page=100&page={page}')
              if not prs:
                  break
              all_prs.extend(prs)
              if len(prs) < 100:
                  break
              page += 1
          for pr in all_prs:
              for run_id in extract_run_ids(pr.get('body') or ''):
                  protected.add(run_id)
                  protected_reasons.setdefault(run_id, f'cited by PR #{pr["number"]}')

          # Protect every run belonging to a currently open same-repository PR branch.
          open_heads = {
              pr['head']['ref']
              for pr in all_prs
              if pr.get('state') == 'open'
              and pr.get('head', {}).get('repo', {}).get('full_name') == REPO
          }
          for run in completed_runs:
              if run.get('head_branch') in open_heads:
                  protected.add(run['id'])
                  protected_reasons.setdefault(run['id'], 'open PR branch')

          artifacts = paged('actions/artifacts?', 'artifacts')
          live_artifacts = [a for a in artifacts if not a.get('expired', False)]
          live_artifacts.sort(key=lambda a: a.get('size_in_bytes', 0), reverse=True)

          deleted_artifacts = []
          freed_bytes = 0
          for artifact in live_artifacts:
              if len(deleted_artifacts) >= MAX_ARTIFACT_DELETES:
                  break
              run_id = (artifact.get('workflow_run') or {}).get('id')
              if run_id in protected:
                  continue
              request(f'actions/artifacts/{artifact["id"]}', method='DELETE')
              deleted_artifacts.append(artifact['id'])
              freed_bytes += int(artifact.get('size_in_bytes') or 0)

          # Delete oldest unprotected completed workflow runs. Deleting a run also removes its logs
          # and any remaining artifacts associated with that run.
          deleted_runs = []
          for run in sorted(completed_runs, key=lambda r: r.get('created_at', '')):
              if len(deleted_runs) >= MAX_RUN_DELETES:
                  break
              run_id = run['id']
              if run_id in protected:
                  continue
              request(f'actions/runs/{run_id}', method='DELETE')
              deleted_runs.append(run_id)

          mib = freed_bytes / (1024 * 1024)
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a', encoding='utf-8') as fh:
              fh.write('\n## GitHub Actions cleanup\n\n')
              fh.write(f'- Completed runs inspected: **{len(completed_runs)}**\n')
              fh.write(f'- Run IDs explicitly protected: **{len(protected)}**\n')
              fh.write(f'- Live artifacts inspected: **{len(live_artifacts)}**\n')
              fh.write(f'- Old artifacts deleted: **{len(deleted_artifacts)}** (at least **{mib:.1f} MiB** freed from artifact payloads)\n')
              fh.write(f'- Old completed workflow runs deleted: **{len(deleted_runs)}**\n')
              fh.write(f'- Newest runs always retained: **{KEEP_NEWEST_RUNS}**\n')
              fh.write('- Runs from open PR branches and run IDs cited in tracked files / PR descriptions were retained.\n')

          print(json.dumps({
              'completed_runs_inspected': len(completed_runs),
              'protected_run_ids': len(protected),
              'live_artifacts_inspected': len(live_artifacts),
              'deleted_artifacts': len(deleted_artifacts),
              'freed_artifact_bytes': freed_bytes,
              'deleted_runs': len(deleted_runs),
              'open_pr_heads': sorted(open_heads),
          }, indent=2))
          PY
