name: Sync canonical reproducer with hardened base

on:
  push:
    branches:
      - review/gpt56-genesis-canonical-metamorphosis-reproducer-20260911

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Merge latest hardened base and remove one-shot workflow
        run: |
          git config user.name 'Anthony Mets'
          git config user.email '110968830+mjodheim@users.noreply.github.com'
          git fetch origin review/gpt56-genesis-architectural-probe-crash-consistency-20260911
          git merge --no-edit origin/review/gpt56-genesis-architectural-probe-crash-consistency-20260911
          rm .github/workflows/gpt56-sync-canonical-reproducer-base.yml
          git add -A
          git commit -m 'chore(genesis): sync canonical reproducer with frozen milestone base' -m 'Signed-off-by: Anthony Mets <110968830+mjodheim@users.noreply.github.com>'
          git push origin HEAD:review/gpt56-genesis-canonical-metamorphosis-reproducer-20260911
