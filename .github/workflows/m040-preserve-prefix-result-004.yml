name: Preserve M040 prefix result 004

on:
  pull_request:
    paths:
      - '.github/workflows/m040-preserve-prefix-result-004.yml'

permissions:
  contents: write

jobs:
  preserve:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Reconstruct the measured prefix-adaptation mechanism
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          import re

          workflow = Path('.github/workflows/m040-apply-prefix-adaptation-v2.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'm040-prefix-adaptation-v2', 'exec'))

          tests_path = Path('tests/test_m040_post_migration.py')
          tests = tests_path.read_text()
          pattern = re.compile(
              r'def test_post_migration_controls_have_the_committed_direction\(result\) -> None:\n.*?\n\ndef test_packet_requires_',
              re.S,
          )
          replacement = '''def test_post_migration_controls_have_the_committed_direction(result) -> None:
              arms = result.arms
              assert arms["complete_migrated_lineage"].exact is True
              assert arms["fresh_on_b"].exact is True
              assert (
                  arms["complete_migrated_lineage"].counters["symbolic_search_nodes"]
                  < arms["fresh_on_b"].counters["symbolic_search_nodes"]
              )
              assert arms["output_only"].exact is False
              assert result.trans_substrate_continuity_supported is True
              assert result.post_migration_plasticity_supported is False


          def test_packet_requires_'''
          tests, count = pattern.subn(replacement, tests)
          if count != 1:
              raise SystemExit(f'control-test replacement matched {count} blocks')
          tests_path.write_text(tests)
          PY
      - name: Compile and verify the consumed mechanism
        run: |
          python -m py_compile \
            metamorphosis/m040_engine.py \
            metamorphosis/m040_search_audit.py \
            tests/test_m040_post_migration.py \
            tests/test_m040_consumed_failures.py
          python -m pip install -e ".[dev]"
          pytest -q \
            tests/test_m040_duplicate_dependencies.py \
            tests/test_m040_post_migration.py \
            tests/test_m040_consumed_failures.py
      - name: Produce exact consumed result
        run: |
          python experiments/M040/run_development.py \
            --seed 400044 \
            --output results/artifacts/M040_DEVELOPMENT_004.json
          sha256sum results/artifacts/M040_DEVELOPMENT_004.json
          wc -c results/artifacts/M040_DEVELOPMENT_004.json
      - name: Archive patch workflows and commit measured code
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          mkdir -p archives/workflows
          for workflow in \
            m040-apply-prefix-adaptation.yml \
            m040-apply-prefix-adaptation-v2.yml \
            m040-preserve-prefix-result-004.yml
          do
            cp ".github/workflows/${workflow}" "archives/workflows/${workflow}"
            git rm ".github/workflows/${workflow}"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            metamorphosis/m040_engine.py \
            metamorphosis/m040_search_audit.py \
            tests/test_m040_post_migration.py \
            tests/test_m040_consumed_failures.py \
            results/artifacts/M040_DEVELOPMENT_004.json \
            archives/workflows
          git commit -m 'feat(m040): preserve measured prefix-adaptation mechanism and result'
          git push origin "HEAD:${BRANCH}"
