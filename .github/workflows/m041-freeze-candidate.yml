name: M041 freeze candidate

on:
  pull_request:
    paths:
      - 'experiments/M041/PROTOCOL.md'
      - 'experiments/M041/run_canonical.py'
      - 'metamorphosis/m040_engine.py'
      - 'metamorphosis/m041_*.py'
      - 'scripts/check_m041_canonical_guard.py'
      - 'tests/test_m041_*.py'
      - '.github/workflows/m041-freeze-candidate.yml'
      - '.github/workflows/m041-canonical.yml'

permissions:
  contents: read

concurrency:
  group: m041-freeze-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  frozen-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Keep the canonical marker absent
        run: test ! -e experiments/M041/CANONICAL_ARMED.json
      - name: Run permanent M041 freeze tests
        run: >-
          pytest -q
          tests/test_m041_isolated_validation.py
          tests/test_m041_pre_adoption_hook.py
          tests/test_m041_sealed.py
          tests/test_m041_canonical_guard.py
      - name: Verify repository integrity
        run: python scripts/check_repository_integrity.py
      - name: Reproduce the canonical result path on the consumed development seed
        run: |
          python - <<'PY'
          from experiments.M041.run_canonical import _execute_positive
          from metamorphosis.m041_result_verify import verify_m041_result

          result = _execute_positive(400_047, 'm040-development-v1')
          verify_m041_result(result)
          assert result['all_ten_gates_supported'] is True
          assert result['canonical_completion_claim_supported'] is True
          PY
      - name: Record frozen candidate identity without deriving a seed
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          protocol = Path('experiments/M041/PROTOCOL.md').read_bytes()
          payload = {
              'schema': 'm041-freeze-candidate/1',
              'head_sha': os.environ['HEAD_SHA'],
              'protocol_sha256': hashlib.sha256(protocol).hexdigest(),
              'protocol_bytes': len(protocol),
              'canonical_marker_absent': True,
              'sealed_seed_not_derived': True,
          }
          Path('m041-freeze-candidate.json').write_text(
              json.dumps(payload, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(payload, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m041-freeze-${{ github.event.pull_request.head.sha }}
          path: m041-freeze-candidate.json
          if-no-files-found: error
          retention-days: 30
