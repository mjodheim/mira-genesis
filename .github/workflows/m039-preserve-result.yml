name: M039 preserve first canonical artifact

on:
  pull_request:
    paths:
      - '.github/workflows/m039-preserve-result.yml'

permissions:
  actions: read
  contents: write

jobs:
  preserve:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact source branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download the immutable first canonical artifact
        uses: actions/download-artifact@v4
        with:
          name: m039-first-canonical-02df1fab0bc589d7563c6d9293073751220185f3
          path: .m039-first-result
          repository: ${{ github.repository }}
          run-id: 30907896768
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and place the bytes without rewriting
        run: |
          test -f .m039-first-result/m039-canonical-result.json
          echo '6141918f47bd6021148725324992e85c00e7726d9b7cc0624dce1f95ee64ac3b  .m039-first-result/m039-canonical-result.json' | sha256sum --check --strict
          test "$(wc -c < .m039-first-result/m039-canonical-result.json)" = '210811'
          mkdir -p results/artifacts
          cp --preserve=mode,timestamps .m039-first-result/m039-canonical-result.json results/artifacts/M039_CANONICAL_RESULT.json
          echo '6141918f47bd6021148725324992e85c00e7726d9b7cc0624dce1f95ee64ac3b  results/artifacts/M039_CANONICAL_RESULT.json' | sha256sum --check --strict

      - name: Commit the exact artifact to the pull-request branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/artifacts/M039_CANONICAL_RESULT.json
          git commit -m 'chore(m039): preserve first canonical artifact byte for byte'
          git push origin "HEAD:${BRANCH}"
