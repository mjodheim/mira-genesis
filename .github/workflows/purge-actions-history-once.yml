name: Purge Actions history (one-shot)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/purge-actions-history-once.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: purge-actions-history-once
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Keep only the 50 newest completed runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed

          REPO = os.environ['GITHUB_REPOSITORY']
          TOKEN = os.environ['GH_TOKEN']
          KEEP = 50
          WORKERS = 10
          MAX_CYCLES = 10

          headers = {
              'Authorization': f'Bearer {TOKEN}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mira-genesis-actions-purge',
          }

          def request(path, method='GET'):
              url = f'https://api.github.com/repos/{REPO}/{path.lstrip("/")}'
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', 'replace')
                  if method == 'DELETE' and exc.code == 404:
                      return None
                  raise RuntimeError(f'{method} {url} -> HTTP {exc.code}: {body[:500]}') from exc

          def fetch_completed_window():
              runs = []
              for page in range(1, 11):
                  payload = request(f'actions/runs?status=completed&per_page=100&page={page}')
                  batch = payload.get('workflow_runs', [])
                  if not batch:
                      break
                  runs.extend(batch)
                  if len(batch) < 100:
                      break
              runs.sort(key=lambda r: r.get('created_at', ''), reverse=True)
              return runs

          def delete_run(run_id):
              request(f'actions/runs/{run_id}', method='DELETE')
              return run_id

          total_deleted = 0
          cycles = 0

          while cycles < MAX_CYCLES:
              cycles += 1
              runs = fetch_completed_window()
              if len(runs) <= KEEP:
                  break

              protected = {r['id'] for r in runs[:KEEP]}
              candidates = [r['id'] for r in runs if r['id'] not in protected]
              if not candidates:
                  break

              deleted_this_cycle = 0
              with ThreadPoolExecutor(max_workers=WORKERS) as executor:
                  futures = [executor.submit(delete_run, run_id) for run_id in candidates]
                  for future in as_completed(futures):
                      future.result()
                      deleted_this_cycle += 1

              total_deleted += deleted_this_cycle
              print(f'cycle={cycles} deleted={deleted_this_cycle} total_deleted={total_deleted}')
              time.sleep(2)

          remaining = fetch_completed_window()
          print(json.dumps({
              'deleted_runs': total_deleted,
              'remaining_completed_runs_visible': len(remaining),
              'keep_target': KEEP,
              'cycles': cycles,
          }, indent=2))

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('## Actions history purge\n\n')
              fh.write(f'- Deleted old completed runs: **{total_deleted}**\n')
              fh.write(f'- Target retained completed runs: **{KEEP} newest**\n')
              fh.write(f'- Visible completed runs after purge: **{len(remaining)}**\n')
          PY
