name: M040 first canonical run

on:
  pull_request:
    paths:
      - 'experiments/M040/CANONICAL_ARMED.json'
      - 'experiments/M040/PROTOCOL.md'
      - 'experiments/M040/run_canonical.py'
      - 'metamorphosis/m040_*.py'
      - 'scripts/check_m040_canonical_guard.py'
      - '.github/workflows/m040-canonical.yml'

permissions:
  contents: read

concurrency:
  group: m040-canonical-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  guarded-canonical-run:
    name: Guarded first M040 canonical run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the immutable pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Inspect the head without opening the sealed block
        id: guard
        shell: bash
        run: |
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD)
          args=()
          for path in "${changed[@]}"; do
            args+=(--changed-file "$path")
          done
          python scripts/check_m040_canonical_guard.py \
            --head-sha "$(git rev-parse HEAD)" \
            --parent-sha "$(git rev-parse HEAD^)" \
            --commit-message "$(git log -1 --pretty=%B)" \
            --github-output "$GITHUB_OUTPUT" \
            "${args[@]}"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.armed == 'true'
        with:
          python-version: '3.11'

      - name: Install the frozen package
        if: steps.guard.outputs.armed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Execute the unique canonical evaluation
        if: steps.guard.outputs.armed == 'true'
        env:
          M040_CANONICAL_RUN: '1'
        run: |
          python experiments/M040/run_canonical.py \
            --head-sha "$(git rev-parse HEAD)" \
            --parent-sha "$(git rev-parse HEAD^)" \
            --marker experiments/M040/CANONICAL_ARMED.json \
            --protocol experiments/M040/PROTOCOL.md \
            --output m040-canonical-result.json

      - name: Verify first-run metadata
        if: steps.guard.outputs.armed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('m040-canonical-result.json').read_text())
          assert payload['schema'] == 'm040-canonical-result/1'
          assert payload['status'] == 'first-canonical-result'
          assert payload['first_run_only'] is True
          assert payload['reruns_are_reproductions_only'] is True
          assert payload['execution_completed'] is True
          assert payload['arming_head_sha'] == '${{ github.event.pull_request.head.sha }}'
          assert payload['scientific_outcome'] in {'positive', 'negative'}
          PY

      - name: Upload the immutable first result
        if: steps.guard.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: m040-first-canonical-${{ github.event.pull_request.head.sha }}
          path: m040-canonical-result.json
          if-no-files-found: error
          retention-days: 90

      - name: Confirm the sealed block stayed closed
        if: steps.guard.outputs.armed != 'true'
        run: echo "M040 canonical block remains closed on this commit."
