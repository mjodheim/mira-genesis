name: One-shot stale branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[branch-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete stale remote branches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          branches=(
            'chore/ip-protection-boundary'
            'chore/ip-protection-boundary-2'
            'chore/ip-protection-boundary-3'
            'chore/ip-protection-boundary-4'
            'chore/ip-provenance-and-dependency-audit'
            'chore/private-rnd-operations'
            'chore/public-agent-ip-guard'
            'chore/public-commercial-licensing'
            'chore/record-m086-public-disclosure'
            'claude/dreamy-swanson-d63fc5'
            'codex/licensing-attribution'
            'codex/m062-synthesized-control'
            'codex/m063-control-transfer'
            'codex/m064-real-substrate-completion'
            'codex/m065-canonical-arm'
            'codex/m066-canonical-arm'
            'codex/m066-canonical-evidence'
            'codex/m066-canonical-governance'
            'codex/m069-governed-terminal-body'
            'codex/m070-external-container-agent'
            'codex/m072-causal-governance-isolation'
            'codex/m074-refusal-calibration'
            'docs/register-sync-m054-m061'
            'maintenance/digest-artifact-eol-guard'
            'research/m061-structural-discovery'
            'research/m075-intake-kit'
            'research/m076-multimodal-grounding'
            'research/m077-long-horizon-recovery'
            'research/m078-incompatible-refusal'
            'research/m079-planning-clarification'
            'research/m080-continual-retention'
            'research/m081-two-real-environments'
            'research/m082-browser-environment'
            'research/m083-gui-desktop-session'
            'research/m084-integrated-persistent-embodiment'
            'research/m085-cross-domain-transfer'
            'research/m086-evolvable-improvement-mechanism'
            'maintenance/cleanup-stale-branches'
          )

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

          mapfile -t remaining < <(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | grep -v '^main$' || true)
          if ((${#remaining[@]})); then
            printf 'Unexpected branches remain:\n%s\n' "${remaining[*]}"
            exit 1
          fi

          echo 'Branch cleanup complete: only main remains.'
